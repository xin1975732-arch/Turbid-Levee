t": "写了一夜的呈子，听了余司吏的话，锁进床底下的木匣"}, {"ch": 15, "t": "把三十四户张家佃户写成无主贫户；把宋家的田界批了“俟秋后会勘”"}, {"ch": 16, "t": "三更打开余司吏的柜子，誊下柜里的真话"}, {"ch": 17, "t": "八月十五夜写成呈文，第二日交驿，寄往按察司"}, {"ch": 19, "t": "原呈退回；写下具结，画了押"}, {"ch": 20, "t": "教新来的小顾：批语栏写“照册转录”"}], "rel": [{"to": "yusili", "label": "上司，荐他进户房的人", "ch": 1}, {"to": "wuxiancheng", "label": "署县事的上官", "ch": 1}, {"to": "laozhou", "label": "同乡，井头村的老相识", "ch": 1}, {"to": "ayun", "label": "被她看着", "ch": 1}, {"to": "sunshuban", "label": "接了他的案子", "ch": 1}, {"to": "heshi", "label": "夫妻", "ch": 6}, {"to": "ahe", "label": "父子", "ch": 6}, {"to": "muqin", "label": "母子", "ch": 6}, {"to": "wanglaoshi", "label": "核他的料石", "ch": 2}, {"to": "zhengdianshi", "label": "同衙办差", "ch": 4}, {"to": "linyicheng", "label": "两回请他记一笔", "ch": 4}, {"to": "qiulaohan", "label": "压下了他的呈子", "ch": 8}, {"to": "zhangyuanwai", "label": "被他算账", "ch": 8}, {"to": "xiaolu", "label": "带新书手", "ch": 20}]}, {"id": "yusili", "name": "余司吏", "aliases": ["余司吏", "余先生", "余伯伯", "余某"], "group": "ya", "mark": ["余司吏"], "role": "户房司吏", "intro": "背驼，咳嗽，说话平平淡淡。库房的钥匙只在他腰上。他说：账是平的，就没有错；不平，才有错。", "events": [{"ch": 1, "t": "在库房里说：不落笔，也有人替你落"}, {"ch": 3, "t": "漫水的夜里帮着搬册子；问沈默册费多出来的三钱"}, {"ch": 6, "t": "说没画押的名字自己写上去，就叫越例"}, {"ch": 9, "t": "和孙书办同一天进的衙门；嘉靖二十六年那一笔，孙书办替他认了"}, {"ch": 12, "t": "三十五年那张单子，是他递给沈默誊的"}, {"ch": 13, "t": "劝沈默：这一叠，烧了也好，锁了也好，别递"}, {"ch": 15, "t": "说出验收簿被拆的两页是孙书办的字；把柜子的钥匙留在案角"}, {"ch": 16, "t": "天亮前替沈默顶下私开官柜的事，被带走候问"}, {"ch": 19, "t": "擅开官柜一条免议，回了户房"}], "rel": [{"to": "sunshuban", "label": "同年，同一天进衙门", "ch": 9}, {"to": "wuxiancheng", "label": "照他的口谕造册", "ch": 16}]}, {"id": "wuxiancheng", "name": "吴县丞", "aliases": ["吴县丞", "县丞老爷", "县丞"], "group": "ya", "mark": ["吴县丞"], "role": "县丞，知县丁忧，暂署县事", "intro": "看文书看得很慢，看到要紧处，眼睛就停住。知县丁忧，府里还没派人下来，县印暂由他掌着。", "events": [{"ch": 3, "t": "六月十二日天没黑，骑马去了府里"}, {"ch": 5, "t": "回城先问城里进水没有；把老宋的禀帖收进自己的抽屉"}, {"ch": 6, "t": "把灾状上的三百一十二户，改成“勘实二百四十户，余俟续勘”"}, {"ch": 10, "t": "看见“奉县丞口谕”，说：我没有交代过。照样落了款"}, {"ch": 14, "t": "收下张员外的三百石米，答应了他的条件"}, {"ch": 17, "t": "看过驿簿，说：让他寄"}, {"ch": 19, "t": "说五条都对；递过一张空白的具结纸；把禀帖还给沈默"}], "rel": [{"to": "zhengdianshi", "label": "属下", "ch": 4}, {"to": "zhangyuanwai", "label": "受他捐米", "ch": 14}]}, {"id": "zhengdianshi", "name": "郑典史", "aliases": ["郑典史", "郑老爷"], "group": "ya", "mark": ["郑典史"], "role": "典史，管捕务、差役和承发房", "intro": "嗓子喊哑了也不打伞。会从自己碗里拨一半饭给册上没名字的孩子，也会站在门楼底下说：城门不开。", "events": [{"ch": 4, "t": "上堤点夫，写下险情急报，交沈默送驿"}, {"ch": 5, "t": "城门不开；从小门叫郎中出去给发热的孩子看病"}, {"ch": 6, "t": "在粥锅前立牌：凭册领米"}, {"ch": 10, "t": "认下十三日夜里调夫是他点的头，那句口谕是冯四传的"}, {"ch": 13, "t": "奉府文封存西堤一应册籍"}, {"ch": 16, "t": "五更带人来封户房的柜子"}, {"ch": 17, "t": "在衙门口告诉沈默：县丞老爷看过驿簿了"}], "rel": [{"to": "fengsi", "label": "承发房的差役", "ch": 10}]}, {"id": "sunshuban", "name": "孙书办", "aliases": ["孙书办", "孙某"], "group": "ya", "mark": ["孙书办"], "role": "沈默的前任，去年腊月告病", "intro": "走得很急，什么也没交代，只留下一张案子，和笔筒里一支没洗的笔。", "events": [{"ch": 1, "t": "去年腊月告了病，案子交给沈默"}, {"ch": 2, "t": "腊月里，王老实跟他说过：料石到堤上的，四百出头"}, {"ch": 9, "t": "嘉靖二十六年认下擅改税册，杖二十，永不升补"}, {"ch": 15, "t": "腊月验料，不肯画押；半年没往县里递一个字"}, {"ch": 19, "t": "九月初十夜里，在二都没了"}], "rel": [{"to": "sunjiahaizi", "label": "父子", "ch": 9}]}, {"id": "sunjiahaizi", "name": "孙家孩子", "aliases": ["孙书办的儿子"], "group": "ya", "mark": ["孙书办的儿子"], "role": "孙书办的儿子，十二三岁", "intro": "替父亲来取铺盖和书箱，站在门口，不敢进。", "events": [{"ch": 9, "t": "来户房取铺盖：我爹说，那支笔，不要了"}, {"ch": 19, "t": "来户房朝余司吏作了个揖：我爹没了"}], "rel": []}, {"id": "fengsi", "name": "冯四", "aliases": ["冯四"], "group": "ya", "mark": ["冯四"], "role": "承发房差役", "intro": "承发房的差役，衙门里派人、传话，常是他跑腿。不识字。", "events": [{"ch": 10, "t": "六月十二、十三两夜一更，“奉县丞口谕”出城往西堤调夫"}, {"ch": 10, "t": "告假回乡，在二都溪口失足溺毙"}, {"ch": 11, "t": "怀里那张泡烂的纸上，剩下“西堤”“不必入册”"}], "rel": []}, {"id": "xiaolu", "name": "小顾", "aliases": ["小顾", "顾"], "group": "ya", "mark": ["小顾"], "role": "新来的书手，十九岁", "intro": "穿一件洗得发白的长衫，作揖作得很深。", "events": [{"ch": 20, "t": "坐到孙书办那张案子后头；收下册费，没问为什么是这个数"}], "rel": []}, {"id": "laozhou", "name": "老宋", "aliases": ["老宋", "宋某"], "group": "xx", "mark": ["老宋"], "role": "西乡三都东村的农户", "intro": "蓑衣淌水，在堂外站了半个时辰也不肯走。说话慢，记性好。", "events": [{"ch": 1, "t": "递禀帖：堤脚塌了两处，求县里拨几个人夫"}, {"ch": 4, "t": "在堤上扛土袋，不许下堤回家搬粮"}, {"ch": 5, "t": "屋塌了，草册上写着：未受灾"}, {"ch": 7, "t": "在土地庙前说：你中秀才那年，站在井沿上说，往后西乡有你"}, {"ch": 14, "t": "递帖子告张家挪了田界，半亩"}, {"ch": 18, "t": "把一亩田押给张宅，借米二石"}], "rel": [{"to": "ayun", "label": "父女", "ch": 1}, {"to": "zhangyuanwai", "label": "田挨着田", "ch": 14}]}, {"id": "ayun", "name": "阿芸", "aliases": ["阿芸", "芸儿"], "group": "xx", "mark": ["阿芸", "芸儿"], "role": "老宋的女儿，十七岁", "intro": "不是求，也不是怕。她看人的时候，眼睛里一点湿意也没有。", "events": [{"ch": 1, "t": "在县衙阶下看着沈默，捏扁了一只蚕茧"}, {"ch": 6, "t": "头一回跟他说话：我家淹没淹，你是看见的"}, {"ch": 8, "t": "说：邱家阿公那张，你压在底下了。抓了两把米给邱家的孩子"}, {"ch": 15, "t": "说：那半亩，我家今秋还要种的"}, {"ch": 17, "t": "说出六月十二夜在堤上看见的人；不肯画押"}], "rel": [{"to": "qiusunzi", "label": "给过他两把米", "ch": 8}]}, {"id": "wanglaoshi", "name": "王老实", "aliases": ["王老实", "王领工", "王某"], "group": "xx", "mark": ["王老实"], "role": "西堤领工", "intro": "编竹筐编得极快，侧身一挪，就挡住了墙上那片涂改过的数字。", "events": [{"ch": 2, "t": "说料石到堤上的，四百出头"}, {"ch": 4, "t": "求沈默记一笔：中段那截新土，不是他的人动的"}, {"ch": 5, "t": "被带到衙门问话，认了卖过二三十方石头"}, {"ch": 10, "t": "认了开春放过人；十三日夜里，是冯四来叫走的"}, {"ch": 19, "t": "挨了二十板，追赔料石银二十两"}, {"ch": 20, "t": "又在西堤上当领工"}], "rel": [{"to": "fengsi", "label": "那一夜被他叫走", "ch": 10}]}, {"id": "zhangyuanwai", "name": "张员外", "aliases": ["张员外", "员外", "张宅", "张家"], "group": "xx", "mark": ["张员外"], "role": "三都的大户", "intro": "四十多岁，脸很白，穿一件半旧的绸衫。说话很慢，很和气，像是在跟一个懂行的人算账。", "events": [{"ch": 8, "t": "粥施到第十二日，改成借米：借一斗还一斗二，田契作保"}, {"ch": 14, "t": "捐米三百石；佃户归东家自赈；提起宋家那张田界帖子"}, {"ch": 15, "t": "让账房送来船单：腊月实运石料四百二十方"}, {"ch": 20, "t": "开了缫丝坊；东村的低田栽上了桑苗"}], "rel": [{"to": "qiulaohan", "label": "东家与佃户", "ch": 8}]}, {"id": "qiulaohan", "name": "邱老汉", "aliases": ["邱老汉", "邱某", "邱家阿公"], "group": "xx", "mark": ["邱老汉"], "role": "外县来的佃户，六十多岁", "intro": "在三都租张家的田种了七八年，户籍还在原籍，不在三都的册上。", "events": [{"ch": 8, "t": "托孙子送来一张呈子：伏乞垂怜"}, {"ch": 8, "t": "六月二十九日，殁于三都土地庙"}], "rel": [{"to": "qiusunzi", "label": "祖孙", "ch": 8}]}, {"id": "qiusunzi", "name": "邱家孙子", "aliases": ["邱家那孩子", "邱家那个孩子"], "group": "xx", "mark": ["邱家那孩子", "邱家那个孩子"], "role": "邱老汉的孙子，十来岁", "intro": "不认字，看不出赈册底下压着什么。手里那只碗，是空的。", "events": [{"ch": 8, "t": "送来阿公的呈子，空着碗回去"}, {"ch": 15, "t": "照赈册领了米：三都，邱，口一。朝沈默作了个揖"}], "rel": []}, {"id": "laotongsheng", "name": "老童生", "aliases": ["老童生"], "group": "xx", "mark": ["老童生"], "role": "庙门口代写呈子的人", "intro": "考了一辈子没考中秀才，也是逃水来的。三文钱一张，念起呈子来，拖着读书人念文章的腔调。", "events": [{"ch": 7, "t": "在土地庙门口摆一张缺腿的桌子，替人写呈子"}, {"ch": 8, "t": "邱老汉那张呈子，是他写的"}], "rel": []}, {"id": "linyicheng", "name": "祝驿丞", "aliases": ["祝驿丞"], "group": "xx", "mark": ["祝驿丞"], "role": "县驿驿丞", "intro": "爱把桌上的东西边角对齐。催粮牌上填着限，误一个时辰，挨板子的是他。", "events": [{"ch": 4, "t": "先走催粮牌，险报压到五更；驿簿上记下一更二点"}, {"ch": 17, "t": "问沈默：若你是我，你送哪一封？然后说：我都送"}, {"ch": 18, "t": "灶边烘干省里的札付，看见了几行反着的字，没有往户房去"}], "rel": []}, {"id": "heshi", "name": "何氏", "aliases": ["何氏"], "group": "jia", "mark": ["何氏"], "role": "沈默的妻子", "intro": "替巷口布店纳鞋底，一双二十文。嫁过来那年就说过：衙门里的事，回家不要讲。", "events": [{"ch": 6, "t": "数出册费比往月多了三钱，没问"}, {"ch": 13, "t": "一包一包数药钱、束脩、米价"}, {"ch": 17, "t": "头一回问衙门里的事：会连累家里吗"}], "rel": [{"to": "ahe", "label": "母子", "ch": 6}]}, {"id": "ahe", "name": "阿禾", "aliases": ["阿禾"], "group": "jia", "mark": ["阿禾"], "role": "沈默的儿子，七岁", "intro": "在户房写坏的竹纸背面描红，一笔一画，很用力。", "events": [{"ch": 13, "t": "问：书办是做什么的？"}, {"ch": 20, "t": "说：等我长大了，也能进衙门"}], "rel": []}, {"id": "muqin", "name": "沈母", "aliases": ["母亲"], "group": "jia", "mark": [], "role": "沈默的母亲", "intro": "惦记着三都村口那棵老槐树。沈默的父亲在的时候，夏天就在那树底下吃饭。", "events": [{"ch": 6, "t": "问：村口那棵槐树，还在不在"}, {"ch": 13, "t": "回三都看老屋，回来就咳；只说了一句：槐树死了"}], "rel": []}]}, "timeline": {"eras": [{"id": "old", "name": "旧账"}, {"id": "now", "name": "嘉靖四十年"}], "events": [{"k": "1543-03", "era": "old", "d": "嘉靖二十二年 三月", "t": "同一天进衙门", "s": "生员余某、生员孙某，同日充户房书手。都是进过学的。", "ch": 9, "who": ["yusili", "sunshuban"]}, {"k": "1547-06", "era": "old", "d": "嘉靖二十六年 夏", "t": "伏乞垂怜", "s": "西乡涝了一个多月，粮照交。十六岁的沈默替父亲写呈子求减，誊了三遍。等了一个冬天，家里卖了牛，第二年卖了井边那块田。", "ch": 7, "who": ["shenmo"]}, {"k": "1547-07", "era": "old", "d": "嘉靖二十六年 七月", "t": "孙某认之", "s": "西乡二都一户税册减半。吏役册上记的是孙书办擅改，杖二十，永不升补。字是台阁体。", "ch": 9, "who": ["sunshuban", "yusili"]}, {"k": "1548", "era": "old", "d": "嘉靖二十七年", "t": "升司吏", "s": "余某升户房司吏。", "ch": 9, "who": ["yusili"]}, {"k": "1556-03", "era": "old", "d": "嘉靖三十五年 三月", "t": "充户房书手", "s": "生员沈默，字子鸣，充户房书手。是余司吏荐进来的，说户房缺一个字写得端正的人。", "ch": 9, "who": ["shenmo", "yusili"]}, {"k": "1556-07-09", "era": "old", "d": "嘉靖三十五年 七月初九", "t": "此事不必入册", "s": "西堤中段塌了一段，连夜抢住。临时核销单：共银一千三百八十两。誊录，书手沈默。", "ch": 12, "who": ["shenmo", "yusili"]}, {"k": "1560-02", "era": "old", "d": "嘉靖三十九年 二月", "t": "中段修竣", "s": "西堤中段补修一段，银三百六十两，修竣。验收另存，戌字七号。", "ch": 3, "who": []}, {"k": "1560-12-19", "era": "old", "d": "嘉靖三十九年 腊月十九", "t": "未敢验收", "s": "孙书办往中段验料：册载七百二十方，实到四百二十方。他不肯画押，回来问余司吏：账册与堤，先信哪个。", "ch": 16, "who": ["sunshuban", "yusili"]}, {"k": "1561-05-07", "era": "now", "d": "五月初七", "t": "照府核数造册", "s": "县丞口谕：西堤核销照一千三百八十两造册。末页贴补，册首孙某的名字刮去。", "ch": 16, "who": ["wuxiancheng", "yusili"]}, {"k": "1561-05-28", "era": "now", "d": "五月廿八", "t": "册已缴销", "s": "戌字七号，西堤中段验收簿，登缴销。", "ch": 3, "who": []}, {"k": "1561-06-10", "era": "now", "d": "六月初十", "t": "接案", "s": "沈默在孙书办留下的案子上，接过西堤核销册。笔筒里一支笔没洗。", "ch": 1, "who": ["shenmo"]}, {"k": "1561-06-12a", "era": "now", "d": "六月十二", "t": "差六百八十两", "s": "册载一千三百八十两，存留额七百两。老宋递来禀帖，户房收讫。夜里，沈默挑开末页，底下是“柒佰两”。", "ch": 1, "who": ["shenmo", "laozhou", "ayun", "yusili"]}, {"k": "1561-06-12b", "era": "now", "d": "六月十二 夜", "t": "堤上撤人", "s": "吴县丞天没黑骑马去了府里。一更，冯四“奉县丞口谕”出城调夫；二更，沈默上堤，看见守夜的人被调走。", "ch": 2, "who": ["shenmo", "wanglaoshi", "fengsi", "wuxiancheng"]}, {"k": "1561-06-13a", "era": "now", "d": "六月十三 凌晨", "t": "库房漫水", "s": "沈默从水里捞出验收簿，搁到最上一层。天亮时，它不见了。", "ch": 3, "who": ["shenmo", "yusili"]}, {"k": "1561-06-13b", "era": "now", "d": "六月十三 白日", "t": "点夫", "s": "西堤点夫一百四十二名。中段只剩九个人，水离竿头的红，只差一道。", "ch": 4, "who": ["shenmo", "zhengdianshi", "laozhou", "wanglaoshi"]}, {"k": "1561-06-13c", "era": "now", "d": "六月十三 一更二点", "t": "险报交驿", "s": "郑典史的险报送到驿站。催粮牌先走，险报压在桌上，驿簿上记了一笔。", "ch": 4, "who": ["shenmo", "linyicheng"]}, {"k": "1561-06-13d", "era": "now", "d": "六月十三 三更", "t": "中段决口", "s": "二更，守夫被叫去东埠头扛粮。三更，一声闷响。水到城墙第三块砖，停了。", "ch": 4, "who": ["shenmo", "wanglaoshi", "fengsi"]}, {"k": "1561-06-14", "era": "now", "d": "六月十四 巳时", "t": "城里一滴水也没进", "s": "城门不开，粥抬出去。吴县丞从东门回城，先问城里进水没有。", "ch": 5, "who": ["wuxiancheng", "zhengdianshi"]}, {"k": "1561-06-15", "era": "now", "d": "六月十五", "t": "未受灾", "s": "东村十七户，屋塌十五，无存二。草册上，宋家一行写着：未受灾。", "ch": 5, "who": ["shenmo", "laozhou", "ayun"]}, {"k": "1561-06-16", "era": "now", "d": "决口后第三日", "t": "收了，为何不报", "s": "王老实被带去问话。傍晚，吴县丞把老宋的禀帖收进了自己的抽屉。", "ch": 5, "who": ["wanglaoshi", "wuxiancheng", "shenmo"]}, {"k": "1561-06-20", "era": "now", "d": "六月二十", "t": "凭册领米", "s": "粥厂立牌。夜里，沈默在赈册末尾补上东村五户；第二日，被划掉，旁注：越例。", "ch": 6, "who": ["shenmo", "zhengdianshi", "yusili", "ayun"]}, {"k": "1561-06-23", "era": "now", "d": "又过三日", "t": "土地庙", "s": "核三都的田。老宋说：你那时候，不是这样说话的。", "ch": 7, "who": ["shenmo", "laozhou", "laotongsheng"]}, {"k": "1561-06-26", "era": "now", "d": "张家粥第十二日", "t": "一碗粥", "s": "张家改施粥为借米。东村五户取了保结；邱老汉的呈子压在赈册底下。", "ch": 8, "who": ["zhangyuanwai", "shenmo", "qiulaohan", "qiusunzi", "ayun"]}, {"k": "1561-06-29", "era": "now", "d": "六月二十九", "t": "殁于土地庙", "s": "邱老汉的名字，头一回上了这个县的册子，是殓埋册。", "ch": 8, "who": ["qiulaohan", "shenmo"]}, {"k": "1561-07-03", "era": "now", "d": "七月初三", "t": "取铺盖", "s": "孙书办的儿子来取铺盖。吏役册上，余某、孙某同日进衙门。", "ch": 9, "who": ["sunjiahaizi", "shenmo", "yusili"]}, {"k": "1561-07-05", "era": "now", "d": "七月初五", "t": "奉县丞口谕", "s": "工食单、西门门簿上，都是这五个字。吴县丞说：我没有交代过。照样落了款。", "ch": 10, "who": ["shenmo", "zhengdianshi", "wuxiancheng", "wanglaoshi"]}, {"k": "1561-07-07", "era": "now", "d": "七月初七", "t": "冯四溺毙", "s": "告假回乡，行至二都溪口，失足。怀里一张泡烂的纸。", "ch": 10, "who": ["fengsi"]}, {"k": "1561-07-08", "era": "now", "d": "七月", "t": "不必入册", "s": "冯四的纸上剩下几个字。沈默想起，这句话他誊过。", "ch": 11, "who": ["shenmo", "fengsi", "yusili"]}, {"k": "1561-07-10", "era": "now", "d": "七月", "t": "旧笔", "s": "库房里翻出三十五年的临时核销单，一千三百八十两，一两不多，一两不少。", "ch": 12, "who": ["shenmo", "yusili"]}, {"k": "1561-07-12", "era": "now", "d": "七月", "t": "木匣", "s": "写了一夜的呈子，没有递，锁进床底下的旧木匣。第七日，府文到，西堤册籍封存。", "ch": 13, "who": ["shenmo", "yusili", "zhengdianshi", "heshi"]}, {"k": "1561-07-25", "era": "now", "d": "七月下旬", "t": "三百石", "s": "官仓见底。张员外捐米三百石，佃户归东家自赈。廊下，他提起宋家那张田界帖子。", "ch": 14, "who": ["zhangyuanwai", "wuxiancheng", "shenmo"]}, {"k": "1561-07-28", "era": "now", "d": "三日后", "t": "无主贫户", "s": "三十四户写进赈册；宋家的田界批了“俟秋后会勘”。船单抄件：四百二十方。余司吏留下一把钥匙。", "ch": 15, "who": ["shenmo", "qiusunzi", "ayun", "yusili", "zhangyuanwai"]}, {"k": "1561-07-29", "era": "now", "d": "当夜三更", "t": "钥匙", "s": "沈默打开司吏的柜子，一年一捆，三十年的真话。五更，余司吏把柜子的事揽到自己身上。", "ch": 16, "who": ["shenmo", "yusili", "zhengdianshi", "sunshuban"]}, {"k": "1561-08-15", "era": "now", "d": "八月十五 夜", "t": "据实陈明", "s": "可证之事五条，未能证实之事四条。那一叠誊来的竹纸，放回了木匣。", "ch": 17, "who": ["shenmo", "heshi"]}, {"k": "1561-08-16", "era": "now", "d": "八月十六", "t": "寄出", "s": "阿芸说出六月十二夜看见的人，不肯画押。夜里，祝驿丞把私书装进县里的公文袋，两封都记。", "ch": 17, "who": ["shenmo", "ayun", "linyicheng", "zhengdianshi", "wuxiancheng"]}, {"k": "1561-08-30", "era": "now", "d": "八月底", "t": "重造鱼鳞册", "s": "着书办沈默专办。宋家那一条界，照现界描下来，往宋家那边挪了二尺。", "ch": 18, "who": ["shenmo", "wuxiancheng"]}, {"k": "1561-09-03", "era": "now", "d": "九月初", "t": "借米二石", "s": "老宋来税契：田一亩押与张宅。“先把今年过了。”", "ch": 18, "who": ["laozhou", "shenmo"]}, {"k": "1561-09-08", "era": "now", "d": "九月初八 夜", "t": "灶边", "s": "省里的札付淋湿了，祝驿丞在灶边烘，火光从封套背后透过来。", "ch": 18, "who": ["linyicheng"]}, {"k": "1561-09-10", "era": "now", "d": "九月初十 夜", "t": "孙书办没了", "s": "咳了一夜，天亮前睡着了，就没醒。", "ch": 19, "who": ["sunshuban"]}, {"k": "1561-09-15", "era": "now", "d": "九月十五", "t": "批回", "s": "原呈发回该县，照常办理。沈默写下具结。第二日，王老实挨了二十板，余司吏回了户房。", "ch": 19, "who": ["shenmo", "wuxiancheng", "wanglaoshi", "yusili", "sunjiahaizi"]}, {"k": "1561-11-01", "era": "now", "d": "十一月初一", "t": "照例", "s": "头一场霜。小顾坐到靠里那张案子后头。傍晚，一张三文钱的帖子，压在了账册底下。", "ch": 20, "who": ["shenmo", "xiaolu", "yusili", "wanglaoshi", "ayun", "ahe"]}], "lede": "从嘉靖二十二年两个生员同一天进衙门，到四十年十一月的头一场霜。还没读到的事先模糊着，点一下才显示。"}, "chapters": [{"n": 1, "cn": "一", "title": "雨账", "era": "", "chars": 3070, "mins": 8, "html": "<p data-p=\"0\">户房靠里那张案上，笔筒里插着三支笔。有一支没洗，笔头的墨干成了硬壳。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>接手这张案子的头一天，没碰它，也没让人来收走。<\/p>\n<p data-p=\"2\">浙西这座小县城，黄梅雨从五月上旬落下来，一落就是一个多月，进了六月还不见收。起先淅淅沥沥，后来密得扯不断，从县衙的青瓦檐头一挂一挂垂下来，把街面、河埠、桑田都罩在一张灰网里。墙根的青苔爬上阶石，爬进门槛。城外的河水涨了三回，一回比一回浑，退下去的时候，在埠头石级上留下一道黄线。<\/p>\n<p data-p=\"3\">户房在县衙最里一进，窗纸潮得发软，账册翻一页，指腹上便沾一层湿。屋里终日一股味道：霉纸、陈墨，还有炭盆里那点永远烧不透的潮炭。<\/p>\n<p data-p=\"4\">后日巳时，<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>要看西堤的核销册。<\/p>\n<p data-p=\"5\">催办的签条压在册面上，末尾写着“署县事”。知县去乡丁忧，府里还没派人下来，县印暂由吴县丞掌着。<\/p>\n<p data-p=\"6\">册子的头一行，要写一句：经手书办沈默。<\/p>\n<p data-p=\"7\">这是他接差的第三天。堤本是工房的事，可工料银子要从户房过手，核销册便归户房出。<\/p>\n<p data-p=\"8\">前任<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>去年腊月告了病，走得很急，什么也没交代，只留下这张案子。<\/p>\n<p data-p=\"9\">沈默把案头收拾了一遍：砚台挪到右手边，算盘摆在左手边，朱笔搁上笔山，又裁了一张小竹纸，压在镇纸下面。竹纸上已经写了一行小字：<\/p>\n<p class=\"chao\" data-p=\"10\">嘉靖四十年六月初十日，接西堤核销册于户房旧案，册面如此。<\/p>\n<p data-p=\"11\">日子他写得极实，连是哪一天都不含糊。日子写得越实，越像他没什么可瞒。<\/p>\n<p data-p=\"12\">袖袋里，这个月的册费还是温的，二两一钱，红纸裹着，纸角折得整整齐齐。是昨日<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>让人送来的，他收的时候没问过一句为什么是这个数。<\/p>\n<p data-p=\"13\">五年了，他知道这钱该收，也知道收了就不必问。<\/p>\n<p data-p=\"14\">他这才翻开册子。<\/p>\n<p data-p=\"15\">账面写得工整：西堤十二里，堤高三尺，底宽三丈，顶宽一丈五尺；石三千七百方，夯土两万四千方，人夫三千二百工；工银，一千三百八十两。<\/p>\n<p data-p=\"16\">他拨了一遍算盘，数是对的。<\/p>\n<p data-p=\"17\">他又拨了一遍。每一颗珠落在哪里，他都在心里默念一次，好像将来有人会来问他。<\/p>\n<p data-p=\"18\">第三遍，他取过本县存留银的旧册，翻到“堤防”一项。<\/p>\n<p class=\"chao\" data-p=\"19\">岁修额定：柒佰两。<\/p>\n<p data-p=\"20\">他把手从书页上收回来，在袖口上擦了擦，仿佛纸上有什么不干净的东西。<\/p>\n<p data-p=\"21\">是我抄错了。<\/p>\n<p data-p=\"22\">这是他头一个念头。<\/p>\n<p data-p=\"23\">他把那一页的数字重抄一遍，对着册子逐字比。没有错。<\/p>\n<p data-p=\"24\">第二个念头来得慢一些，也冷一些：这数，过不去。<\/p>\n<p data-p=\"25\">不是他不认得这个数，是这个数摆在这里，后日巳时，他的名字要压在它上头。<\/p>\n<p data-p=\"26\">数对不上，吴县丞若问起来，被问的是经手人。<\/p>\n<p data-p=\"27\">批语栏里，他不写“核明无误”，写“照册转录”。前一个是他担保，后一个只是他抄。<\/p>\n<p data-p=\"28\">他写了。字很小，很端正。<\/p>\n<p data-p=\"29\">可写完，他没有松气。“照册转录”能挡一句问话，挡不住第二句。<\/p>\n<p data-p=\"30\">他在竹纸上添了一行：<\/p>\n<p class=\"chao\" data-p=\"31\">六月十二日核。册载银一千三百八十两，存留额七百两，差六百八十两。此系前册所载。<\/p>\n<p data-p=\"32\">吹干，折两折，夹进褡裢的夹层里。夹层里已经有一张了，上个月税册那一张。<\/p>\n<p data-p=\"33\">廊下有脚步声，踩着水，啪，啪。<\/p>\n<p data-p=\"34\">差役在门外站住。<\/p>\n<p data-p=\"35\">“沈书办，西乡的<b class=\"rn\" data-c=\"laozhou\">老宋<\/b>在堂外等了半个时辰，有禀帖，说堤脚塌了。顺带还问夏税。”<\/p>\n<p data-p=\"36\">“没见我核着账？让他等。”<\/p>\n<p data-p=\"37\">“他带着女儿，姑娘手里提了个篮子。”<\/p>\n<p data-p=\"38\">朱笔在纸上悬着，落不下去。<\/p>\n<p data-p=\"39\">他在想：一个老农，带着女儿，站了半个时辰，还不肯走。这样的人，明天还会来，后天还会来。来多了，衙门里就有人知道，户房的沈书办，手里压着一份西乡的堤禀。那就是他的事了。<\/p>\n<p data-p=\"40\">他起身出去。<\/p>\n<p data-p=\"41\">老宋站在阶下，蓑衣往下淌水，斗笠檐上垂着一串一串水珠。他身后的姑娘低着头，篮沿露着几片被雨打蔫的桑叶。<\/p>\n<p data-p=\"42\">“堤脚塌了两处，渗水。里长让递个禀帖，求县里拨几个人夫。”老宋把纸递上来，纸是软的，边上已经洇开了。<\/p>\n<p data-p=\"43\">沈默没接。他扫了一眼那页纸，脸上没有表情，语气很平：“堤工的账后日才报，新银子拨不下来，人夫也调不动。回去让里长先带着乡里人垫一垫。”<\/p>\n<p data-p=\"44\">“这雨再落几日，怕是——”<\/p>\n<p data-p=\"45\">“朝廷有朝廷的规矩。”<\/p>\n<p data-p=\"46\">这话他说得很顺，一个字不用想。<\/p>\n<p data-p=\"47\">老宋的嘴张了张，又合上。他把禀帖放在石阶上，压了一块小石子，说：“那夏税折绢的事……”<\/p>\n<p data-p=\"48\">“夏税有粮长收，你去找粮长。”<\/p>\n<p data-p=\"49\">老宋点点头，戴上斗笠，拉了拉女儿的袖子。<\/p>\n<p data-p=\"50\">那姑娘没有动。<\/p>\n<p data-p=\"51\">她抬着头，正对着沈默。不是求，也不是怕，那双眼睛一点湿意也没有，像在看檐下一块被水泡黑了的石头。她的手指慢慢收紧，篮子里的蚕茧发出一声极轻的碎响。灰黄，个头小，被她捏扁了一只。<\/p>\n<p data-p=\"52\">“<b class=\"rn\" data-c=\"ayun\">芸儿<\/b>。”老宋低声唤她。<\/p>\n<p data-p=\"53\">她这才转身，临走前又朝沈默看了一眼。<\/p>\n<p data-p=\"54\">沈默皱了皱眉。一个乡下丫头，这样瞪着当差的看，也不知是谁家教的规矩。<\/p>\n<p data-p=\"55\">他转身要进屋，懒得再理会。一只脚已经跨过了门槛，又收了回来。<\/p>\n<p data-p=\"56\">这才弯腰，把那页禀帖拿起来。纸边已经烂了，一捏就是一层浆。<\/p>\n<p data-p=\"57\">他取来一枚小印，在禀帖的右下角盖了“户房收讫”，又提笔在旁边写了日期和“西乡民宋某具”。<\/p>\n<p data-p=\"58\">他把这页纸夹进《核销册》和存留旧册之间。<\/p>\n<p data-p=\"59\">万一将来有人问起这条堤，他想，我手里有一张当日已收的纸。<\/p>\n<p data-p=\"60\">这跟老宋的堤修不修没什么关系。他做这一手，为的是自己。<\/p>\n<p data-p=\"61\">想到这里，他心里倒松快了些——这差事，他接得稳。<\/p>\n<p data-p=\"62\">又想到刚刚的账目，他起身去了库房。<\/p>\n<p data-p=\"63\">走之前，他从抽屉里取出一小包姜茶，是自己带来的，纸包上还印着药铺的字号。<\/p>\n<p data-p=\"64\">库房是县衙最暗的地方，小窗开在很高的墙上，漏下一点灰蒙蒙的光。一排排木架上摞着历年的账册、鱼鳞图册。余司吏蹲在最里头一只旧木箱前，背驼着，咳了两声，声音像砂纸磨过木头。<\/p>\n<p data-p=\"65\">“余先生，这雨天，喝点姜茶暖暖。”<\/p>\n<p data-p=\"66\">“放那儿吧。”<\/p>\n<p data-p=\"67\">沈默把纸包搁在木架边上，不多说，也不多看。<\/p>\n<p data-p=\"68\">他知道这一包东西要是放得太近，就成了人情；放得太远，又成了客套。放在这个位置，刚好。<\/p>\n<p data-p=\"69\">“想请教先生，”他说，“西堤的册子我接了手，往上递的时候，该怎么落笔，才算合适。”<\/p>\n<p data-p=\"70\">“什么叫合适？”<\/p>\n<p data-p=\"71\">“就是数目上，若有不妥，将来不至于……”<\/p>\n<p data-p=\"72\">“不至于？”余司吏转过半个身子。光线暗，看不清他的脸，只听见他的声音，平平淡淡，“你是怕账不平，还是怕账太平？”<\/p>\n<p data-p=\"73\">沈默没答上来。<\/p>\n<p data-p=\"74\">“账是平的，就没有错。”余司吏说，“不平，才有错。”<\/p>\n<p data-p=\"75\">沈默把这两句话在心里过了一遍，记下了。<\/p>\n<p data-p=\"76\">“孙书办走前，可留了话？”他换了个问法。<\/p>\n<p data-p=\"77\">“没有。”余司吏说，“他走得急。”<\/p>\n<p data-p=\"78\">说完，他咳了很久，弓下腰去，手撑在木箱沿上。<\/p>\n<p data-p=\"79\">“后日巳时，吴县丞要看，”他直起腰，声音更哑了，“册子上，是你的名字。”<\/p>\n<p data-p=\"80\">“是。”<\/p>\n<p data-p=\"81\">“你要是觉得数不对，就别落笔。”<\/p>\n<p data-p=\"82\">沈默一怔。“不落笔？”<\/p>\n<p data-p=\"83\">“不落笔，也有人替你落。”<\/p>\n<p data-p=\"84\">余司吏又蹲回木箱前，背对着他，“自己掂量。”<\/p>\n<p data-p=\"85\">沈默站了一会儿，把“是”字咽回去，退出库房。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"86\">回到户房，天更暗了。他点起灯，把册子从头翻起。<\/p>\n<p data-p=\"87\">册子潮了，得逐页对光看有没有洇烂，这是他的差事，出了差错，也是他的责任。他一页一页举起来，凑到窗前那一线灰白的雨光里。<\/p>\n<p data-p=\"88\">翻到末页，银数那一行，他的手停了。<\/p>\n<p data-p=\"89\">那一行字，比别处平整。颜色也比别处浅一点点。<\/p>\n<p data-p=\"90\">他把册页举高，让雨光从纸背透过来。<\/p>\n<p data-p=\"91\">那一行的边沿，有一道极细的、笔直的线。<\/p>\n<p data-p=\"92\">像有人拿刀比着尺，裁过一条纸，又贴回去。<\/p>\n<p data-p=\"93\">是贴上去的。<\/p>\n<p data-p=\"94\">浆糊的边还没干透。这样的雨天，浆糊干得慢，可也不像去年腊月时贴的。<\/p>\n<p data-p=\"95\">他用指甲，很轻很轻地，挑起了一点边。<\/p>\n<p data-p=\"96\">纸底下，透出另一行字。原来的墨，压在新贴的纸下头，隔着一层竹纸，灰白的雨光把它照成一道模糊的影子：<\/p>\n<p class=\"chao\" data-p=\"97\">柒佰两。<\/p>\n<p data-p=\"98\">沈默的手僵在那里。<\/p>\n<p data-p=\"99\">窗外，檐水一滴一滴，落在阶石上。<\/p>\n<p data-p=\"100\">他把那一角轻轻按了回去，按平，用指腹抹了两下，直到看不出痕迹。<\/p>\n<p data-p=\"101\">然后他坐下来，取过竹纸，蘸了墨，手竟有些抖，写：<\/p>\n<p class=\"chao\" data-p=\"102\">六月十二日夜。末页银数，系贴补，非原字。浆未干。<\/p>\n<p data-p=\"103\">吹干，折两折，夹进褡裢里。<\/p>\n<p data-p=\"104\">夹层里，已经有三张了。<\/p>\n<p data-p=\"105\">他把册子翻回册首。经手书办那一行，空着，等他落笔。<\/p>\n<p data-p=\"106\">他把灯挪近了些。<\/p>\n<p data-p=\"107\">那一行空白处的纸面，比别处毛一点，像是用刀刮过，又用潮布擦过。刮掉的那几个字，还剩一点极淡的墨影，认不出是谁的名字。<\/p>\n<p data-p=\"108\">案上的笔筒里，那支没洗的笔，还插在那里。<\/p>\n<p data-p=\"109\">后日巳时。他的名字，要写在这一页的头一行。<\/p>", "paras": ["户房靠里那张案上，笔筒里插着三支笔。有一支没洗，笔头的墨干成了硬壳。", "沈默接手这张案子的头一天，没碰它，也没让人来收走。", "浙西这座小县城，黄梅雨从五月上旬落下来，一落就是一个多月，进了六月还不见收。起先淅淅沥沥，后来密得扯不断，从县衙的青瓦檐头一挂一挂垂下来，把街面、河埠、桑田都罩在一张灰网里。墙根的青苔爬上阶石，爬进门槛。城外的河水涨了三回，一回比一回浑，退下去的时候，在埠头石级上留下一道黄线。", "户房在县衙最里一进，窗纸潮得发软，账册翻一页，指腹上便沾一层湿。屋里终日一股味道：霉纸、陈墨，还有炭盆里那点永远烧不透的潮炭。", "后日巳时，吴县丞要看西堤的核销册。", "催办的签条压在册面上，末尾写着“署县事”。知县去乡丁忧，府里还没派人下来，县印暂由吴县丞掌着。", "册子的头一行，要写一句：经手书办沈默。", "这是他接差的第三天。堤本是工房的事，可工料银子要从户房过手，核销册便归户房出。", "前任孙书办去年腊月告了病，走得很急，什么也没交代，只留下这张案子。", "沈默把案头收拾了一遍：砚台挪到右手边，算盘摆在左手边，朱笔搁上笔山，又裁了一张小竹纸，压在镇纸下面。竹纸上已经写了一行小字：", "嘉靖四十年六月初十日，接西堤核销册于户房旧案，册面如此。", "日子他写得极实，连是哪一天都不含糊。日子写得越实，越像他没什么可瞒。", "袖袋里，这个月的册费还是温的，二两一钱，红纸裹着，纸角折得整整齐齐。是昨日余司吏让人送来的，他收的时候没问过一句为什么是这个数。", "五年了，他知道这钱该收，也知道收了就不必问。", "他这才翻开册子。", "账面写得工整：西堤十二里，堤高三尺，底宽三丈，顶宽一丈五尺；石三千七百方，夯土两万四千方，人夫三千二百工；工银，一千三百八十两。", "他拨了一遍算盘，数是对的。", "他又拨了一遍。每一颗珠落在哪里，他都在心里默念一次，好像将来有人会来问他。", "第三遍，他取过本县存留银的旧册，翻到“堤防”一项。", "岁修额定：柒佰两。", "他把手从书页上收回来，在袖口上擦了擦，仿佛纸上有什么不干净的东西。", "是我抄错了。", "这是他头一个念头。", "他把那一页的数字重抄一遍，对着册子逐字比。没有错。", "第二个念头来得慢一些，也冷一些：这数，过不去。", "不是他不认得这个数，是这个数摆在这里，后日巳时，他的名字要压在它上头。", "数对不上，吴县丞若问起来，被问的是经手人。", "批语栏里，他不写“核明无误”，写“照册转录”。前一个是他担保，后一个只是他抄。", "他写了。字很小，很端正。", "可写完，他没有松气。“照册转录”能挡一句问话，挡不住第二句。", "他在竹纸上添了一行：", "六月十二日核。册载银一千三百八十两，存留额七百两，差六百八十两。此系前册所载。", "吹干，折两折，夹进褡裢的夹层里。夹层里已经有一张了，上个月税册那一张。", "廊下有脚步声，踩着水，啪，啪。", "差役在门外站住。", "“沈书办，西乡的老宋在堂外等了半个时辰，有禀帖，说堤脚塌了。顺带还问夏税。”", "“没见我核着账？让他等。”", "“他带着女儿，姑娘手里提了个篮子。”", "朱笔在纸上悬着，落不下去。", "他在想：一个老农，带着女儿，站了半个时辰，还不肯走。这样的人，明天还会来，后天还会来。来多了，衙门里就有人知道，户房的沈书办，手里压着一份西乡的堤禀。那就是他的事了。", "他起身出去。", "老宋站在阶下，蓑衣往下淌水，斗笠檐上垂着一串一串水珠。他身后的姑娘低着头，篮沿露着几片被雨打蔫的桑叶。", "“堤脚塌了两处，渗水。里长让递个禀帖，求县里拨几个人夫。”老宋把纸递上来，纸是软的，边上已经洇开了。", "沈默没接。他扫了一眼那页纸，脸上没有表情，语气很平：“堤工的账后日才报，新银子拨不下来，人夫也调不动。回去让里长先带着乡里人垫一垫。”", "“这雨再落几日，怕是——”", "“朝廷有朝廷的规矩。”", "这话他说得很顺，一个字不用想。", "老宋的嘴张了张，又合上。他把禀帖放在石阶上，压了一块小石子，说：“那夏税折绢的事……”", "“夏税有粮长收，你去找粮长。”", "老宋点点头，戴上斗笠，拉了拉女儿的袖子。", "那姑娘没有动。", "她抬着头，正对着沈默。不是求，也不是怕，那双眼睛一点湿意也没有，像在看檐下一块被水泡黑了的石头。她的手指慢慢收紧，篮子里的蚕茧发出一声极轻的碎响。灰黄，个头小，被她捏扁了一只。", "“芸儿。”老宋低声唤她。", "她这才转身，临走前又朝沈默看了一眼。", "沈默皱了皱眉。一个乡下丫头，这样瞪着当差的看，也不知是谁家教的规矩。", "他转身要进屋，懒得再理会。一只脚已经跨过了门槛，又收了回来。", "这才弯腰，把那页禀帖拿起来。纸边已经烂了，一捏就是一层浆。", "他取来一枚小印，在禀帖的右下角盖了“户房收讫”，又提笔在旁边写了日期和“西乡民宋某具”。", "他把这页纸夹进《核销册》和存留旧册之间。", "万一将来有人问起这条堤，他想，我手里有一张当日已收的纸。", "这跟老宋的堤修不修没什么关系。他做这一手，为的是自己。", "想到这里，他心里倒松快了些——这差事，他接得稳。", "又想到刚刚的账目，他起身去了库房。", "走之前，他从抽屉里取出一小包姜茶，是自己带来的，纸包上还印着药铺的字号。", "库房是县衙最暗的地方，小窗开在很高的墙上，漏下一点灰蒙蒙的光。一排排木架上摞着历年的账册、鱼鳞图册。余司吏蹲在最里头一只旧木箱前，背驼着，咳了两声，声音像砂纸磨过木头。", "“余先生，这雨天，喝点姜茶暖暖。”", "“放那儿吧。”", "沈默把纸包搁在木架边上，不多说，也不多看。", "他知道这一包东西要是放得太近，就成了人情；放得太远，又成了客套。放在这个位置，刚好。", "“想请教先生，”他说，“西堤的册子我接了手，往上递的时候，该怎么落笔，才算合适。”", "“什么叫合适？”", "“就是数目上，若有不妥，将来不至于……”", "“不至于？”余司吏转过半个身子。光线暗，看不清他的脸，只听见他的声音，平平淡淡，“你是怕账不平，还是怕账太平？”", "沈默没答上来。", "“账是平的，就没有错。”余司吏说，“不平，才有错。”", "沈默把这两句话在心里过了一遍，记下了。", "“孙书办走前，可留了话？”他换了个问法。", "“没有。”余司吏说，“他走得急。”", "说完，他咳了很久，弓下腰去，手撑在木箱沿上。", "“后日巳时，吴县丞要看，”他直起腰，声音更哑了，“册子上，是你的名字。”", "“是。”", "“你要是觉得数不对，就别落笔。”", "沈默一怔。“不落笔？”", "“不落笔，也有人替你落。”", "余司吏又蹲回木箱前，背对着他，“自己掂量。”", "沈默站了一会儿，把“是”字咽回去，退出库房。", "回到户房，天更暗了。他点起灯，把册子从头翻起。", "册子潮了，得逐页对光看有没有洇烂，这是他的差事，出了差错，也是他的责任。他一页一页举起来，凑到窗前那一线灰白的雨光里。", "翻到末页，银数那一行，他的手停了。", "那一行字，比别处平整。颜色也比别处浅一点点。", "他把册页举高，让雨光从纸背透过来。", "那一行的边沿，有一道极细的、笔直的线。", "像有人拿刀比着尺，裁过一条纸，又贴回去。", "是贴上去的。", "浆糊的边还没干透。这样的雨天，浆糊干得慢，可也不像去年腊月时贴的。", "他用指甲，很轻很轻地，挑起了一点边。", "纸底下，透出另一行字。原来的墨，压在新贴的纸下头，隔着一层竹纸，灰白的雨光把它照成一道模糊的影子：", "柒佰两。", "沈默的手僵在那里。", "窗外，檐水一滴一滴，落在阶石上。", "他把那一角轻轻按了回去，按平，用指腹抹了两下，直到看不出痕迹。", "然后他坐下来，取过竹纸，蘸了墨，手竟有些抖，写：", "六月十二日夜。末页银数，系贴补，非原字。浆未干。", "吹干，折两折，夹进褡裢里。", "夹层里，已经有三张了。", "他把册子翻回册首。经手书办那一行，空着，等他落笔。", "他把灯挪近了些。", "那一行空白处的纸面，比别处毛一点，像是用刀刮过，又用潮布擦过。刮掉的那几个字，还剩一点极淡的墨影，认不出是谁的名字。", "案上的笔筒里，那支没洗的笔，还插在那里。", "后日巳时。他的名字，要写在这一页的头一行。"], "recap": ""}, {"n": 2, "cn": "二", "title": "堤脚", "era": "", "chars": 1941, "mins": 5, "html": "<p data-p=\"0\">雨没停，只是从密雨换成了那种下不透、也停不住的毛雨，落在脸上像是有人在吹一层湿气。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>出城时，已是二更。<\/p>\n<p data-p=\"2\">西门早闭了。门军提着灯笼照了照他的腰牌，嘟囔了一句：“你们衙门里的人，白日里不见出城，专挑半夜。今夜出城的，你是第二拨了。”<\/p>\n<p data-p=\"3\">他只带了褡裢、一把伞、一盏灯笼。褡裢里塞着一本连夜誊抄的工料簿。料石、人夫这两项，他刚才在灯下又算了一遍：这两笔账，经手的是堤夫，若差额能落在这上头，后日巳时那本册子，便能干净些。<\/p>\n<p data-p=\"4\">出了西门，路便是烂泥。挑担的脚印一个压一个，深深浅浅，积着浑水。灯笼只照得见脚前三尺，他走得慢，鞋底陷进泥里，拔出来时带起一声闷响。<\/p>\n<p data-p=\"5\">西堤到了，他没进工棚，提着灯笼顺着堤身走。<\/p>\n<p data-p=\"6\">堤面被雨水冲出一道道细沟，浅浅的，像是老人脸上的皱纹。他蹲下身，伸手按了按一处堤脚，指尖陷进去，泥是软的，捻开来，掺着水，比别处稀。<\/p>\n<p data-p=\"7\">再往前走了十几步，又按了一处。这里干得多，按下去回弹得很快。<\/p>\n<p data-p=\"8\">他没说什么，站起身，往柳树林那边去。<\/p>\n<p data-p=\"9\">工棚就搭在柳树林里，棚顶铺着茅草，漏着细雨，细雨顺着草缝一线一线地滴，落在地上那层半干的干草上，洇出一个个深色的圆点。灶里还有火。屋里一股霉味，混着河水的腥气，闷闷地压在鼻端，散不开。<\/p>\n<p data-p=\"10\"><b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>守着夜，正蹲在灶边编竹筐，裤腿卷到膝盖，腿上满是泥点，一根根篾条在他手里翻来覆去，编得极快。见沈默进来，他手上一顿，赶紧站起身，拍了拍身上沾着的碎草，转身从灶上端过一碗热姜汤，笑着递过来：<\/p>\n<p data-p=\"11\">“沈书办怎么来了？这深更半夜的，也不差人传个话，我好过去伺候。”<\/p>\n<p data-p=\"12\">沈默没接碗，目光先扫过工棚土墙。<\/p>\n<p data-p=\"13\">墙角处，用白粉笔写着一串歪歪扭扭的数字，层层叠叠，有的地方划了又划，涂改了好几道，最底下压着的那几个数，几乎被涂成一团白糊糊的印子，认不出原来写的是什么。<\/p>\n<p data-p=\"14\">见他望过去，王老实下意识侧身挪了半步，刚好挡住那片墙面，搓着手笑：“瞎画的，记着出工的人头，乱得很。”<\/p>\n<p data-p=\"15\">“我来核实一下去年的用料和人夫。”沈默从怀里取出抄本，直接翻到那一页。<\/p>\n<p data-p=\"16\">“人夫，账上写多少，大差不差。”王老实蹲回去，篾条绕得飞快，“只是有几日雨大，停了工，账上还是照发的工钱。”<\/p>\n<p data-p=\"17\">“折下来，工钱差多少？”<\/p>\n<p data-p=\"18\">篾条顿了一下。“官家的账，小人算不清，得问账房。”<\/p>\n<p data-p=\"19\">“这笔账不问账房，问你。”沈默的声音很平，“你是领工的，工钱怎么发，你该知道。”<\/p>\n<p data-p=\"20\">王老实没接话，低头拆篾条。<\/p>\n<p data-p=\"21\">沈默又念了一句：<\/p>\n<p data-p=\"22\">“石料七百二十方。你去年腊月，跟<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>说的，是四百出头。这三百多方，往哪儿去了？”<\/p>\n<p data-p=\"23\">棚顶那处漏檐，正一滴一滴往干草上砸，嗒，嗒，很有间隔。<\/p>\n<p data-p=\"24\">王老实手里的篾条编错了一道，他低头拆开重编，没有抬头。<\/p>\n<p data-p=\"25\">“这话，小人去年腊月也跟孙书办说过一遍。”他顿了顿，“孙书办后来，病得急，走得也急。”<\/p>\n<p data-p=\"26\">他没再往下说。<\/p>\n<p data-p=\"27\">沈默在心里又算了一遍。停工五六日的工钱，再多也补不上三百方石头。这个窟窿，王老实一个领工的，填不进去。<\/p>\n<p data-p=\"28\">他没再接话，转身走出工棚。眼角余光扫过棚子最里头的干草堆，底下露着三四把铁锹的木柄，木纹簇新，还带着刨子刮过的毛刺，跟棚边堆着的那些磨得发亮的旧锹格格不入。<\/p>\n<p data-p=\"29\">堤那头传来一阵吆喝。几支火把亮起来，七八个夯夫扛着家伙什，深一脚浅一脚往堤下走。为首一个穿号衣的差役，扯着嗓子催：“快些！县里点的人，误了时辰，谁也担待不起！”<\/p>\n<p data-p=\"30\">“往哪儿调？”沈默问。<\/p>\n<p data-p=\"31\">那差役瞥了他一眼，见是户房的号色，随口应了句：“书办自便，差事是上头点的。”说罢领着人走了，火把一点一点拐过桑林，看不见了。<\/p>\n<p data-p=\"32\">王老实站在工棚门口，望着那几点火光，手里还捏着那根篾条。<\/p>\n<p data-p=\"33\">“守堤的，说撤就撤？”沈默问。<\/p>\n<p data-p=\"34\">“县里调的。”王老实的声音低下去，“说是别处急用。”<\/p>\n<p data-p=\"35\">“别处哪儿？”<\/p>\n<p data-p=\"36\">“这个……小人不知道。”<\/p>\n<p data-p=\"37\">“这雨要是再涨呢？”<\/p>\n<p data-p=\"38\">王老实不吭声了，低头看着自己那双沾满泥的赤脚，脚趾在泥地上蜷了蜷。半晌，他才挤出一句：<\/p>\n<p data-p=\"39\">“沈书办，这不是小人能做主的事。”<\/p>\n<p data-p=\"40\">堤上方才还有七八支火把，此刻只剩两三点，是几个老弱，披着蓑衣，缩在堤脚下一处稍高的土墩上，谁也不说话，望着黑里的河面。<\/p>\n<p data-p=\"41\">河水的声音比来时又大了些。浪头一层压一层，打在堤脚的青石上，退下去时，带着一声很沉的响，像是从堤身底下传出来的。<\/p>\n<p data-p=\"42\">沈默转身要走。王老实在他身后说：<\/p>\n<p data-p=\"43\">“沈书办，这雨，往年也没这么大过。”<\/p>\n<p data-p=\"44\">沈默脚步顿了一下，没回头，往前走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"45\">回城的路上，只有他一盏灯笼。<\/p>\n<p data-p=\"46\">快到西门的时候，远处田埂上有一点火光，几个人挑着担子往高处走，担头上露出一捆一捆的桑苗。<\/p>\n<p data-p=\"47\">他看了一眼，没有停。<\/p>\n<p data-p=\"48\">回到户房，城里刚打过四更。他吹了灯笼，就着炭盆里那点没烧透的余火，取过一张竹纸，写下一句：<\/p>\n<p class=\"chao\" data-p=\"49\">六月十二日夜。人夫工钱，可核减。料石之差，尚待查实。<\/p>\n<p data-p=\"50\">笔尖在纸上顿了顿，像是还要往下添一句，终究没有。<\/p>\n<p data-p=\"51\">墨迹未干，他把纸折起来，正要往褡裢里塞，手忽然停住。<\/p>\n<p data-p=\"52\">窗外，廊下传来脚步声，很轻，一下一下，踩着水，正往户房这边过来。<\/p>\n<p data-p=\"53\">这个时辰，不该有人来。<\/p>", "paras": ["雨没停，只是从密雨换成了那种下不透、也停不住的毛雨，落在脸上像是有人在吹一层湿气。", "沈默出城时，已是二更。", "西门早闭了。门军提着灯笼照了照他的腰牌，嘟囔了一句：“你们衙门里的人，白日里不见出城，专挑半夜。今夜出城的，你是第二拨了。”", "他只带了褡裢、一把伞、一盏灯笼。褡裢里塞着一本连夜誊抄的工料簿。料石、人夫这两项，他刚才在灯下又算了一遍：这两笔账，经手的是堤夫，若差额能落在这上头，后日巳时那本册子，便能干净些。", "出了西门，路便是烂泥。挑担的脚印一个压一个，深深浅浅，积着浑水。灯笼只照得见脚前三尺，他走得慢，鞋底陷进泥里，拔出来时带起一声闷响。", "西堤到了，他没进工棚，提着灯笼顺着堤身走。", "堤面被雨水冲出一道道细沟，浅浅的，像是老人脸上的皱纹。他蹲下身，伸手按了按一处堤脚，指尖陷进去，泥是软的，捻开来，掺着水，比别处稀。", "再往前走了十几步，又按了一处。这里干得多，按下去回弹得很快。", "他没说什么，站起身，往柳树林那边去。", "工棚就搭在柳树林里，棚顶铺着茅草，漏着细雨，细雨顺着草缝一线一线地滴，落在地上那层半干的干草上，洇出一个个深色的圆点。灶里还有火。屋里一股霉味，混着河水的腥气，闷闷地压在鼻端，散不开。", "王老实守着夜，正蹲在灶边编竹筐，裤腿卷到膝盖，腿上满是泥点，一根根篾条在他手里翻来覆去，编得极快。见沈默进来，他手上一顿，赶紧站起身，拍了拍身上沾着的碎草，转身从灶上端过一碗热姜汤，笑着递过来：", "“沈书办怎么来了？这深更半夜的，也不差人传个话，我好过去伺候。”", "沈默没接碗，目光先扫过工棚土墙。", "墙角处，用白粉笔写着一串歪歪扭扭的数字，层层叠叠，有的地方划了又划，涂改了好几道，最底下压着的那几个数，几乎被涂成一团白糊糊的印子，认不出原来写的是什么。", "见他望过去，王老实下意识侧身挪了半步，刚好挡住那片墙面，搓着手笑：“瞎画的，记着出工的人头，乱得很。”", "“我来核实一下去年的用料和人夫。”沈默从怀里取出抄本，直接翻到那一页。", "“人夫，账上写多少，大差不差。”王老实蹲回去，篾条绕得飞快，“只是有几日雨大，停了工，账上还是照发的工钱。”", "“折下来，工钱差多少？”", "篾条顿了一下。“官家的账，小人算不清，得问账房。”", "“这笔账不问账房，问你。”沈默的声音很平，“你是领工的，工钱怎么发，你该知道。”", "王老实没接话，低头拆篾条。", "沈默又念了一句：", "“石料七百二十方。你去年腊月，跟孙书办说的，是四百出头。这三百多方，往哪儿去了？”", "棚顶那处漏檐，正一滴一滴往干草上砸，嗒，嗒，很有间隔。", "王老实手里的篾条编错了一道，他低头拆开重编，没有抬头。", "“这话，小人去年腊月也跟孙书办说过一遍。”他顿了顿，“孙书办后来，病得急，走得也急。”", "他没再往下说。", "沈默在心里又算了一遍。停工五六日的工钱，再多也补不上三百方石头。这个窟窿，王老实一个领工的，填不进去。", "他没再接话，转身走出工棚。眼角余光扫过棚子最里头的干草堆，底下露着三四把铁锹的木柄，木纹簇新，还带着刨子刮过的毛刺，跟棚边堆着的那些磨得发亮的旧锹格格不入。", "堤那头传来一阵吆喝。几支火把亮起来，七八个夯夫扛着家伙什，深一脚浅一脚往堤下走。为首一个穿号衣的差役，扯着嗓子催：“快些！县里点的人，误了时辰，谁也担待不起！”", "“往哪儿调？”沈默问。", "那差役瞥了他一眼，见是户房的号色，随口应了句：“书办自便，差事是上头点的。”说罢领着人走了，火把一点一点拐过桑林，看不见了。", "王老实站在工棚门口，望着那几点火光，手里还捏着那根篾条。", "“守堤的，说撤就撤？”沈默问。", "“县里调的。”王老实的声音低下去，“说是别处急用。”", "“别处哪儿？”", "“这个……小人不知道。”", "“这雨要是再涨呢？”", "王老实不吭声了，低头看着自己那双沾满泥的赤脚，脚趾在泥地上蜷了蜷。半晌，他才挤出一句：", "“沈书办，这不是小人能做主的事。”", "堤上方才还有七八支火把，此刻只剩两三点，是几个老弱，披着蓑衣，缩在堤脚下一处稍高的土墩上，谁也不说话，望着黑里的河面。", "河水的声音比来时又大了些。浪头一层压一层，打在堤脚的青石上，退下去时，带着一声很沉的响，像是从堤身底下传出来的。", "沈默转身要走。王老实在他身后说：", "“沈书办，这雨，往年也没这么大过。”", "沈默脚步顿了一下，没回头，往前走了。", "回城的路上，只有他一盏灯笼。", "快到西门的时候，远处田埂上有一点火光，几个人挑着担子往高处走，担头上露出一捆一捆的桑苗。", "他看了一眼，没有停。", "回到户房，城里刚打过四更。他吹了灯笼，就着炭盆里那点没烧透的余火，取过一张竹纸，写下一句：", "六月十二日夜。人夫工钱，可核减。料石之差，尚待查实。", "笔尖在纸上顿了顿，像是还要往下添一句，终究没有。", "墨迹未干，他把纸折起来，正要往褡裢里塞，手忽然停住。", "窗外，廊下传来脚步声，很轻，一下一下，踩着水，正往户房这边过来。", "这个时辰，不该有人来。"], "recap": "嘉靖四十年六月，黄梅雨下了一个多月。户房书办沈默接手西堤的核销册：册载工银一千三百八十两，旧额只有七百两。批语栏里，他写了“照册转录”。西乡的老宋带着女儿阿芸来递禀帖，说堤脚塌了，他盖了“户房收讫”，夹进册子，没往上报。库房里，余司吏说：不落笔，也有人替你落。夜里他挑开末页，银数是贴上去的，底下原是“柒佰两”。后日巳时，册首要写他的名字。"}, {"n": 3, "cn": "三", "title": "旧册", "era": "", "chars": 2498, "mins": 7, "html": "<p data-p=\"0\">脚步声没有在户房门口停。<\/p>\n<p data-p=\"1\">它从窗下过去，一下，一下，往里走。<\/p>\n<p data-p=\"2\">再往里，只有库房。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>把折好的纸塞进褡裢，坐着没动。<\/p>\n<p data-p=\"4\">人夫那一笔，能推给<b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>，停工照发的工钱，是他报的。料石那一笔推不动。料石进场，要工房的人验收，验完了签押，另立一本验收簿。验收簿上若有工房的押，三百多方的差，就是工房认过的数，不全是户房的事。<\/p>\n<p data-p=\"5\">他想找的就是这本簿子。<\/p>\n<p data-p=\"6\">明日巳时，册子要递到<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>案上。<\/p>\n<p data-p=\"7\">等那脚步声听不见了，他起身，没拿灯。<\/p>\n<p data-p=\"8\">库房的门开着一道缝，缝里有光。<\/p>\n<p data-p=\"9\">他推开门。<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>蹲在最底下一排架子前，脚边搁一盏油灯，灯罩熏得半黑。他正把底层的册子一摞一摞往上搬，搬一摞，喘一口气。<\/p>\n<p data-p=\"10\">“余先生。”<\/p>\n<p data-p=\"11\">余司吏没回头。“水要进来了。”<\/p>\n<p data-p=\"12\">青砖缝里渗出一层水，薄薄的，映着灯，像铺了一层油。<\/p>\n<p data-p=\"13\">“天亮前还要涨。”余司吏说，“底下三层，泡一夜就烂。”<\/p>\n<p data-p=\"14\">沈默挽起袖子，蹲下去帮着搬。<\/p>\n<p data-p=\"15\">最底下一层是鱼鳞册。他抽出一本，封皮写着“西乡三都”。翻开一角，一页页小方格，格里画着田形，田形旁边是户主的名字。水已经洇到页脚，墨晕开了，有几个名字糊成一团，认不出是谁家。<\/p>\n<p data-p=\"16\">他把这本先搁上了最上层。<\/p>\n<p data-p=\"17\">然后才回来搬账册。<\/p>\n<p data-p=\"18\">余司吏看了他一眼，把手里那摞册子往上推了推。等底层清出一半，他扶着架子站起来，咳了一阵，咳完了，才看沈默的鞋。<\/p>\n<p data-p=\"19\">鞋帮上的泥还没干，是城外的黄泥，跟衙里的黑泥不一样。<\/p>\n<p data-p=\"20\">“去西堤了。”<\/p>\n<p data-p=\"21\">“去核料石。”<\/p>\n<p data-p=\"22\">“核出来了？”<\/p>\n<p data-p=\"23\">“人夫工钱，可核减一些。”<\/p>\n<p data-p=\"24\">“料石呢？”<\/p>\n<p data-p=\"25\">沈默把手里那摞推上架，没答。<\/p>\n<p data-p=\"26\">余司吏也没再问。<\/p>\n<p data-p=\"27\">“既在这儿，”沈默说，“想顺手找一本册子。”<\/p>\n<p data-p=\"28\">“什么册子。”<\/p>\n<p data-p=\"29\">“去年西堤的核销底册。”<\/p>\n<p data-p=\"30\">“辛字三格。”<\/p>\n<p data-p=\"31\">余司吏说得很快。<\/p>\n<p data-p=\"32\">沈默抽出来，就着油灯翻。翻到二月，手指停了。<\/p>\n<p data-p=\"33\">西堤中段，补修一段。银三百六十两。修竣。<\/p>\n<p data-p=\"34\">下面一行小字：验收另存，戌字七号。<\/p>\n<p data-p=\"35\">他把这一行看了两遍。<\/p>\n<p data-p=\"36\">去年二月，中段修好了，修竣二字写得明明白白。到了腊月，同一段，又要七百二十方石料去补。<\/p>\n<p data-p=\"37\">一段堤，一年修两回。<\/p>\n<p data-p=\"38\">“去年二月，中段修竣过一回。”他抬起头。<\/p>\n<p data-p=\"39\">“嗯。”<\/p>\n<p data-p=\"40\">“腊月又修。”<\/p>\n<p data-p=\"41\">“堤哪年不修。”<\/p>\n<p data-p=\"42\">“修竣的堤，十个月又要修。”<\/p>\n<p data-p=\"43\">“雨大。”<\/p>\n<p data-p=\"44\">沈默没接话。<\/p>\n<p data-p=\"45\">“戌字七号在哪儿？”<\/p>\n<p data-p=\"46\">“那是工房的东西。”<\/p>\n<p data-p=\"47\">“户房这边，该存一份。”<\/p>\n<p data-p=\"48\">余司吏提起灯，往最里头走。沈默跟在后面。越往里，地上的水越深，没过了鞋底。<\/p>\n<p data-p=\"49\">戌字那一排在最底下。最底下一格，已经整个泡在水里。余司吏把灯放低，照着水面。一本薄册子斜靠在格板上，下半截吸饱了水，颜色深了一截。<\/p>\n<p data-p=\"50\">沈默蹲下，把它捞出来。<\/p>\n<p data-p=\"51\">封皮上写着：西堤中段验收簿。<\/p>\n<p data-p=\"52\">他没看别处，先翻到第一页，找验收人那一栏。<\/p>\n<p data-p=\"53\">只要这一栏有个工房的名字，这笔账，就有一半不是他的。<\/p>\n<p data-p=\"54\">那一栏，空着。<\/p>\n<p data-p=\"55\">他往后翻。第二页没有了。订线还在，线是白的，比封皮新。线边上一排旧针眼，一排新针眼，挨着，错开半分。<\/p>\n<p data-p=\"56\">有人把里头的页子拆了，又照原样订了回去。<\/p>\n<p data-p=\"57\">他合上册子，再看封皮。封皮上贴着一张窄纸条，台阁体，一笔一画端端正正：<\/p>\n<p class=\"chao\" data-p=\"58\">另册核销。<\/p>\n<p data-p=\"59\">这路字，他十几岁时临过，临了三年。<\/p>\n<p data-p=\"60\">他把拇指按在纸条边上，比了比。一指半宽。纸边裁得笔直，像是比着尺下的刀。<\/p>\n<p data-p=\"61\">核销册上的数，若跟旧额对不上，就得有另册写明来由。一千三百八十两比七百两多出来的那些，来由就该在这本里。<\/p>\n<p data-p=\"62\">纸条底下，紧挨着，又是一行，不是贴的，直接写在封皮上，笔画潦草，墨色新：<\/p>\n<p class=\"chao\" data-p=\"63\">册已缴销。四十年五月廿八日。<\/p>\n<p data-p=\"64\">“五月廿八。”他说。<\/p>\n<p data-p=\"65\">“上个月销了一批。”余司吏说，“验收簿留三年，满了就销。”<\/p>\n<p data-p=\"66\">“这是去年的。”<\/p>\n<p data-p=\"67\">余司吏把灯放低了些，照着那一行新墨。<\/p>\n<p data-p=\"68\">“那就是销错了。”<\/p>\n<p data-p=\"69\">水又漫上来一点。余司吏又说：<\/p>\n<p data-p=\"70\">“销错了的，也是销了。”<\/p>\n<p data-p=\"71\">沈默蹲在水里，没起来。<\/p>\n<p data-p=\"72\"><b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>去年腊月就走了。他是初十才接的案子。五月廿八，离他接手，不到半个月。<\/p>\n<p data-p=\"73\">“孙书办，问过这本没有？”<\/p>\n<p data-p=\"74\">“问过。”<\/p>\n<p data-p=\"75\">“什么时候？”<\/p>\n<p data-p=\"76\">“腊月。”<\/p>\n<p data-p=\"77\">“后来呢？”<\/p>\n<p data-p=\"78\">“告病了。”<\/p>\n<p data-p=\"79\">“什么病？”<\/p>\n<p data-p=\"80\">“咳。”<\/p>\n<p data-p=\"81\">余司吏说完这个字，自己也咳起来，咳得弯下腰去，一只手撑在架子上，灯在另一只手里晃，晃得满架子的木签都在墙上摇。<\/p>\n<p data-p=\"82\">沈默伸手去扶。余司吏摆了摆手。<\/p>\n<p data-p=\"83\">咳够了，他直起身，喘匀了气，忽然问：<\/p>\n<p data-p=\"84\">“这个月的册费，收着了？”<\/p>\n<p data-p=\"85\">“收着了。”<\/p>\n<p data-p=\"86\">“二两一钱。”<\/p>\n<p data-p=\"87\">“是。”<\/p>\n<p data-p=\"88\">“孙书办那时候，是一两八钱。”<\/p>\n<p data-p=\"89\">沈默的手还停在半空。他慢慢收了回来。<\/p>\n<p data-p=\"90\">“多出来那三钱，你没问。”<\/p>\n<p data-p=\"91\">袖袋里那个红纸包，忽然有点沉。<\/p>\n<p data-p=\"92\">水从砖缝里一点一点往上冒，冒出来的时候没有声音，漫过鞋帮，才有一点很轻的响。<\/p>\n<p data-p=\"93\">“我也没问。”余司吏说。<\/p>\n<p data-p=\"94\">他提着灯往门口走，走了两步，又停下。<\/p>\n<p data-p=\"95\">“沈相公。”<\/p>\n<p data-p=\"96\">沈默顿了一下，才应：“余先生。”<\/p>\n<p data-p=\"97\">“那本东西，搁回去。”<\/p>\n<p data-p=\"98\">“原处在水里。”<\/p>\n<p data-p=\"99\">余司吏回过头看他。灯从下往上照，照不清他的脸，只照见他袖口往下滴的水。<\/p>\n<p data-p=\"100\">“搁回去。走的时候，把门带上。”<\/p>\n<p data-p=\"101\">他吹灭了灯，走了。<\/p>\n<p data-p=\"102\">沈默在黑里站了一会儿。册子在他手里，湿透了，往下滴水。<\/p>\n<p data-p=\"103\">搁回水里，天亮就是一团烂纸。带出库房，是私取官册。<\/p>\n<p data-p=\"104\">他摸着架子，一层一层往上，摸到最上一层，摸到那本鱼鳞册的封皮。他把验收簿放在了它旁边。<\/p>\n<p data-p=\"105\">出门时，他把门带上了。门环上挂着那把铜锁，他没有钥匙，锁不上，只让它虚挂着。<\/p>\n<p data-p=\"106\">他回了户房，坐到天亮。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"107\">卯时，他又去了库房。<\/p>\n<p data-p=\"108\">库房的门关着。铜锁扣上了。<\/p>\n<p data-p=\"109\">他在廊下站了一阵，余司吏才披着蓑衣过来，从腰里摸出钥匙，开了锁，一句话没问。<\/p>\n<p data-p=\"110\">水已经漫过了门槛。沈默趟进去，抬头看最上一层。<\/p>\n<p data-p=\"111\">西乡三都的鱼鳞册，还在。<\/p>\n<p data-p=\"112\">旁边空着。格板上留着一块方方正正的湿印，还没干透。<\/p>\n<p data-p=\"113\">余司吏站在门口，也往那儿看了一眼。<\/p>\n<p data-p=\"114\">“水退了些。”他说。<\/p>\n<p data-p=\"115\">沈默没接话，回了户房。<\/p>\n<p data-p=\"116\">天还没亮透。他点上灯，开了抽屉，把核销册取出来，翻到末页。<\/p>\n<p data-p=\"117\">银数那一行，贴着一条纸。<\/p>\n<p data-p=\"118\">他把拇指按上去。<\/p>\n<p data-p=\"119\">一指半宽。<\/p>\n<p data-p=\"120\">纸边裁得笔直。浆糊的边，摸上去还是软的。<\/p>\n<p data-p=\"121\">他的拇指在那条纸上按着，按到指腹上沾了一层潮，才挪开。<\/p>\n<p data-p=\"122\">一千三百八十两，凭的是“另册核销”。那本另册，五月廿八就销了，昨夜连封皮也没了。<\/p>\n<p data-p=\"123\">数还在。凭据没了。<\/p>\n<p data-p=\"124\">廊下有脚步声，踩着水，啪，啪。<\/p>\n<p data-p=\"125\">差役在门外站住。<\/p>\n<p data-p=\"126\">“沈书办，县丞老爷昨夜去了府里，说明日巳时前赶回来，西堤的册子，照旧。”<\/p>\n<p data-p=\"127\">“去府里？这么大的雨。”<\/p>\n<p data-p=\"128\">“船都不走了，老爷是骑马去的。”差役抖了抖斗笠上的水，“昨日天没黑就走了，说是府里急召。”<\/p>\n<p data-p=\"129\">脚步声又远了。<\/p>\n<p data-p=\"130\">窗外，雨又密了。<\/p>\n<p data-p=\"131\">明日巳时。册首“经手书办”那一行，还空着。<\/p>\n<p data-p=\"132\">他写上去，这个数，就是他核过的。<\/p>", "paras": ["脚步声没有在户房门口停。", "它从窗下过去，一下，一下，往里走。", "再往里，只有库房。", "沈默把折好的纸塞进褡裢，坐着没动。", "人夫那一笔，能推给王老实，停工照发的工钱，是他报的。料石那一笔推不动。料石进场，要工房的人验收，验完了签押，另立一本验收簿。验收簿上若有工房的押，三百多方的差，就是工房认过的数，不全是户房的事。", "他想找的就是这本簿子。", "明日巳时，册子要递到吴县丞案上。", "等那脚步声听不见了，他起身，没拿灯。", "库房的门开着一道缝，缝里有光。", "他推开门。余司吏蹲在最底下一排架子前，脚边搁一盏油灯，灯罩熏得半黑。他正把底层的册子一摞一摞往上搬，搬一摞，喘一口气。", "“余先生。”", "余司吏没回头。“水要进来了。”", "青砖缝里渗出一层水，薄薄的，映着灯，像铺了一层油。", "“天亮前还要涨。”余司吏说，“底下三层，泡一夜就烂。”", "沈默挽起袖子，蹲下去帮着搬。", "最底下一层是鱼鳞册。他抽出一本，封皮写着“西乡三都”。翻开一角，一页页小方格，格里画着田形，田形旁边是户主的名字。水已经洇到页脚，墨晕开了，有几个名字糊成一团，认不出是谁家。", "他把这本先搁上了最上层。", "然后才回来搬账册。", "余司吏看了他一眼，把手里那摞册子往上推了推。等底层清出一半，他扶着架子站起来，咳了一阵，咳完了，才看沈默的鞋。", "鞋帮上的泥还没干，是城外的黄泥，跟衙里的黑泥不一样。", "“去西堤了。”", "“去核料石。”", "“核出来了？”", "“人夫工钱，可核减一些。”", "“料石呢？”", "沈默把手里那摞推上架，没答。", "余司吏也没再问。", "“既在这儿，”沈默说，“想顺手找一本册子。”", "“什么册子。”", "“去年西堤的核销底册。”", "“辛字三格。”", "余司吏说得很快。", "沈默抽出来，就着油灯翻。翻到二月，手指停了。", "西堤中段，补修一段。银三百六十两。修竣。", "下面一行小字：验收另存，戌字七号。", "他把这一行看了两遍。", "去年二月，中段修好了，修竣二字写得明明白白。到了腊月，同一段，又要七百二十方石料去补。", "一段堤，一年修两回。", "“去年二月，中段修竣过一回。”他抬起头。", "“嗯。”", "“腊月又修。”", "“堤哪年不修。”", "“修竣的堤，十个月又要修。”", "“雨大。”", "沈默没接话。", "“戌字七号在哪儿？”", "“那是工房的东西。”", "“户房这边，该存一份。”", "余司吏提起灯，往最里头走。沈默跟在后面。越往里，地上的水越深，没过了鞋底。", "戌字那一排在最底下。最底下一格，已经整个泡在水里。余司吏把灯放低，照着水面。一本薄册子斜靠在格板上，下半截吸饱了水，颜色深了一截。", "沈默蹲下，把它捞出来。", "封皮上写着：西堤中段验收簿。", "他没看别处，先翻到第一页，找验收人那一栏。", "只要这一栏有个工房的名字，这笔账，就有一半不是他的。", "那一栏，空着。", "他往后翻。第二页没有了。订线还在，线是白的，比封皮新。线边上一排旧针眼，一排新针眼，挨着，错开半分。", "有人把里头的页子拆了，又照原样订了回去。", "他合上册子，再看封皮。封皮上贴着一张窄纸条，台阁体，一笔一画端端正正：", "另册核销。", "这路字，他十几岁时临过，临了三年。", "他把拇指按在纸条边上，比了比。一指半宽。纸边裁得笔直，像是比着尺下的刀。", "核销册上的数，若跟旧额对不上，就得有另册写明来由。一千三百八十两比七百两多出来的那些，来由就该在这本里。", "纸条底下，紧挨着，又是一行，不是贴的，直接写在封皮上，笔画潦草，墨色新：", "册已缴销。四十年五月廿八日。", "“五月廿八。”他说。", "“上个月销了一批。”余司吏说，“验收簿留三年，满了就销。”", "“这是去年的。”", "余司吏把灯放低了些，照着那一行新墨。", "“那就是销错了。”", "水又漫上来一点。余司吏又说：", "“销错了的，也是销了。”", "沈默蹲在水里，没起来。", "孙书办去年腊月就走了。他是初十才接的案子。五月廿八，离他接手，不到半个月。", "“孙书办，问过这本没有？”", "“问过。”", "“什么时候？”", "“腊月。”", "“后来呢？”", "“告病了。”", "“什么病？”", "“咳。”", "余司吏说完这个字，自己也咳起来，咳得弯下腰去，一只手撑在架子上，灯在另一只手里晃，晃得满架子的木签都在墙上摇。", "沈默伸手去扶。余司吏摆了摆手。", "咳够了，他直起身，喘匀了气，忽然问：", "“这个月的册费，收着了？”", "“收着了。”", "“二两一钱。”", "“是。”", "“孙书办那时候，是一两八钱。”", "沈默的手还停在半空。他慢慢收了回来。", "“多出来那三钱，你没问。”", "袖袋里那个红纸包，忽然有点沉。", "水从砖缝里一点一点往上冒，冒出来的时候没有声音，漫过鞋帮，才有一点很轻的响。", "“我也没问。”余司吏说。", "他提着灯往门口走，走了两步，又停下。", "“沈相公。”", "沈默顿了一下，才应：“余先生。”", "“那本东西，搁回去。”", "“原处在水里。”", "余司吏回过头看他。灯从下往上照，照不清他的脸，只照见他袖口往下滴的水。", "“搁回去。走的时候，把门带上。”", "他吹灭了灯，走了。", "沈默在黑里站了一会儿。册子在他手里，湿透了，往下滴水。", "搁回水里，天亮就是一团烂纸。带出库房，是私取官册。", "他摸着架子，一层一层往上，摸到最上一层，摸到那本鱼鳞册的封皮。他把验收簿放在了它旁边。", "出门时，他把门带上了。门环上挂着那把铜锁，他没有钥匙，锁不上，只让它虚挂着。", "他回了户房，坐到天亮。", "卯时，他又去了库房。", "库房的门关着。铜锁扣上了。", "他在廊下站了一阵，余司吏才披着蓑衣过来，从腰里摸出钥匙，开了锁，一句话没问。", "水已经漫过了门槛。沈默趟进去，抬头看最上一层。", "西乡三都的鱼鳞册，还在。", "旁边空着。格板上留着一块方方正正的湿印，还没干透。", "余司吏站在门口，也往那儿看了一眼。", "“水退了些。”他说。", "沈默没接话，回了户房。", "天还没亮透。他点上灯，开了抽屉，把核销册取出来，翻到末页。", "银数那一行，贴着一条纸。", "他把拇指按上去。", "一指半宽。", "纸边裁得笔直。浆糊的边，摸上去还是软的。", "他的拇指在那条纸上按着，按到指腹上沾了一层潮，才挪开。", "一千三百八十两，凭的是“另册核销”。那本另册，五月廿八就销了，昨夜连封皮也没了。", "数还在。凭据没了。", "廊下有脚步声，踩着水，啪，啪。", "差役在门外站住。", "“沈书办，县丞老爷昨夜去了府里，说明日巳时前赶回来，西堤的册子，照旧。”", "“去府里？这么大的雨。”", "“船都不走了，老爷是骑马去的。”差役抖了抖斗笠上的水，“昨日天没黑就走了，说是府里急召。”", "脚步声又远了。", "窗外，雨又密了。", "明日巳时。册首“经手书办”那一行，还空着。", "他写上去，这个数，就是他核过的。"], "recap": "二更，沈默出城上堤。中段的堤脚是软的。领工王老实说，去年腊月到堤上的石料只有四百出头，账上是七百二十方；他也跟孙书办说过，孙书办后来病得急，走得也急。几支火把把守堤的人调走了，说是县里点的。回到户房，他写下：人夫工钱，可核减；料石之差，尚待查实。窗外有脚步声，往库房去了。"}, {"n": 4, "cn": "四", "title": "夜汛", "era": "", "chars": 3004, "mins": 8, "html": "<p data-p=\"0\">雨又换了下法。不再是毛雨，是一根一根往下砸的，砸在院里的积水上，起一层白烟。<\/p>\n<p data-p=\"1\">天刚亮透，<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>把核销册从抽屉里取出来，摊开，还没翻到册首，典史那边的差役就到了门口：<\/p>\n<p data-p=\"2\">“郑老爷让户房出一个人，上西堤点夫。各村派来的民夫，按村按户点名，记个实数。”<\/p>\n<p data-p=\"3\">户房里只有他一个。他把核销册锁回抽屉，拿上西乡各村的人丁册，出了门。<\/p>\n<p data-p=\"4\">西堤上一整天都是人。各村的民夫一队一队上来，扛着土袋往堤顶送。<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>站在草棚口，蓑衣滴着水，手里没拿伞。他冲堤下喊：“老的别往上扛了，去棚后头歇着！累倒了还得抬你们！”<\/p>\n<p data-p=\"5\">几个白头发的民夫放下土袋，挪到棚后头去了。<\/p>\n<p data-p=\"6\">沈默坐在棚里，一个一个念名字，一个一个点。<\/p>\n<p data-p=\"7\">“西乡三都，东村，宋——”<\/p>\n<p data-p=\"8\">“到。”<\/p>\n<p data-p=\"9\"><b class=\"rn\" data-c=\"laozhou\">老宋<\/b>站在雨里，肩上的土袋还没放下。他看见是沈默，等沈默在名字旁边点了一笔，才开口：<\/p>\n<p data-p=\"10\">“沈书办，昨日那张帖子，县里看了没有？”<\/p>\n<p data-p=\"11\">沈默把笔搁在册沿上。<\/p>\n<p data-p=\"12\">“县丞老爷去府里了。”<\/p>\n<p data-p=\"13\">“哦。”<\/p>\n<p data-p=\"14\">老宋把土袋往肩上颠了颠，跟着队伍走了。<\/p>\n<p data-p=\"15\">午时，县里抬上来两桶糙米饭。郑典史让人在棚口摆开，自己站在桶边。<\/p>\n<p data-p=\"16\">“点过名的，挨个来打饭。没点上名的，没有。县里就拨了这些米。”<\/p>\n<p data-p=\"17\">队伍里有个半大孩子，跟着他爹来的，册上没有他。打饭的差役把他从队里拉了出来。<\/p>\n<p data-p=\"18\">孩子没哭，站在雨里，看着桶。<\/p>\n<p data-p=\"19\">郑典史看了他一眼，把蓑衣领子往上拉了拉。等饭打完了，他从自己那一碗里拨出一半，倒进孩子手里，转身走了。<\/p>\n<p data-p=\"20\">沈默低头看了看自己膝上的人丁册。<\/p>\n<p data-p=\"21\">午后，<b class=\"rn\" data-c=\"ayun\">阿芸<\/b>冒雨跑上堤来，裤腿湿到膝盖。她没往棚里看，径直找到她爹，凑近说了几句什么。<\/p>\n<p data-p=\"22\">老宋放下土袋，走到棚口。<\/p>\n<p data-p=\"23\">“郑老爷，西乡屋后头进水了，家里的粮还堆在地上。小人回去搬一趟，天黑前就回来。”<\/p>\n<p data-p=\"24\">“点了名的，一个都不许下堤。”<\/p>\n<p data-p=\"25\">“就一趟——”<\/p>\n<p data-p=\"26\">“堤要是在你走的那一趟开了，”郑典史说，“你担得起？”<\/p>\n<p data-p=\"27\">老宋没再说话，回去扛他的土袋。<\/p>\n<p data-p=\"28\">阿芸站在雨里，回头往棚里看了一眼。沈默低着头记数。<\/p>\n<p data-p=\"29\">到天擦黑，一共点了一百四十二名。<\/p>\n<p data-p=\"30\">郑典史叫他去中段再点一回：“那儿水最急，看看还剩几个人。”<\/p>\n<p data-p=\"31\">中段在下游拐弯的地方。浪头一层压一层撞上来，退下去的时候，带走一层泥。堤脚插着一根量水的竹竿，竿上一道一道刻着印子，竿头涂了一圈红。水到了红，就要漫堤。<\/p>\n<p data-p=\"32\"><b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>带着两个人，正往堤缝里塞草袋。<\/p>\n<p data-p=\"33\">“水到哪儿了？”<\/p>\n<p data-p=\"34\">王老实看了一眼竹竿：“早上离红还有三道，这会儿只差一道了。”<\/p>\n<p data-p=\"35\">浪头退下去，红圈底下露出一道刻痕；浪头扑上来，那道刻痕就没了。<\/p>\n<p data-p=\"36\">竹竿旁边，有一截土是新翻的。颜色比旁边深，松松的，雨落上去一下就渗没了。泥上留着锹印，一道一道，口子齐整。<\/p>\n<p data-p=\"37\">“这一截，是你的人补的？”<\/p>\n<p data-p=\"38\">“不是我的人动的。”<\/p>\n<p data-p=\"39\">“那是谁？”<\/p>\n<p data-p=\"40\">王老实没答。他把草袋踩实了，在裤腿上蹭了蹭手，走近两步，压低了声音：<\/p>\n<p data-p=\"41\">“沈书办，小人斗胆，求书办给记一笔：这截土，不是小人的人动的。”<\/p>\n<p data-p=\"42\">沈默没有掏纸。他数了数中段的人：连王老实在内，九个。<\/p>\n<p data-p=\"43\">回到草棚，郑典史已经在收拾。沈默把九这个数报上去，又说：“中段堤脚有一截新土，松的。水离竿头的红，只差一道。”<\/p>\n<p data-p=\"44\">“我叫人添了草袋。”<\/p>\n<p data-p=\"45\">“中段只有九个人。”<\/p>\n<p data-p=\"46\">“中段去年才修竣，石头都是新的，”郑典史说，“人得放在塌了的地方。”<\/p>\n<p data-p=\"47\">他朝上游努了努嘴。老宋帖子里说的那两处塌口，一处压着四十多个人，土袋垒得比人还高。<\/p>\n<p data-p=\"48\">沈默想起那三百方没到堤上的料石。<\/p>\n<p data-p=\"49\">他没说出口。<\/p>\n<p data-p=\"50\">“昨夜堤上撤过一回人。”<\/p>\n<p data-p=\"51\">“撤夫是县里点的，”郑典史说，“我这儿有底。”<\/p>\n<p data-p=\"52\">他把一张纸折起来，装进封套，封了口，递给沈默：“险情急报，报府里的。你回城，顺路送驿站，叫他们连夜走。”<\/p>\n<p data-p=\"53\">又转头对几个甲长说：“夜里各村轮班，守到天亮，一个都不许下堤。”<\/p>\n<p data-p=\"54\">他顿了顿。<\/p>\n<p data-p=\"55\">“堤上的人要动，先进城来问我。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"56\">天黑透的时候，沈默到了驿站。<\/p>\n<p data-p=\"57\">马棚里点着一盏风灯，灯罩上全是水。<b class=\"rn\" data-c=\"linyicheng\">祝驿丞<\/b>蹲在马槽边，正往一匹马的前蹄上缠布，见他进来，起身在衣裳上擦了擦手。<\/p>\n<p data-p=\"58\">“沈书办。”<\/p>\n<p data-p=\"59\">“郑老爷的险报，报府里，要连夜走。”<\/p>\n<p data-p=\"60\">祝驿丞接过封套，回头看了看马棚。两匹马，一匹前腿缠着布，站不稳；另一匹已经备好了鞍。<\/p>\n<p data-p=\"61\">桌上压着一块红漆木牌，牌上的字被雨洇开了一半。<\/p>\n<p data-p=\"62\">“府里的催粮牌，催各县交夏粮的，午后到的，今夜要递到下一县。”祝驿丞说，“就这一匹能跑。”<\/p>\n<p data-p=\"63\">祝驿丞拿起险报，翻过来看了看封皮。<\/p>\n<p data-p=\"64\">“有县里的印没有？”<\/p>\n<p data-p=\"65\">“县丞老爷去了府里。”<\/p>\n<p data-p=\"66\">祝驿丞把险报放下了，他把险报和催粮牌并排放在桌上，边角对齐。<\/p>\n<p data-p=\"67\">“催粮牌上填着限，误一个时辰，挨板子的是我。”他说，“这一封没有印，没有限，算寻常申文。晚走半夜，谁也挑不出错。”<\/p>\n<p data-p=\"68\">“堤上的水等不得。”<\/p>\n<p data-p=\"69\">“沈书办，水也不等马。马跑到府里，是明日的事；府里看了，再派人下来，是后日的事。”<\/p>\n<p data-p=\"70\">他把催粮牌塞进马夫怀里。马夫牵着马出了棚，蹄子踩在水里，啪，啪，很快没了声。<\/p>\n<p data-p=\"71\">“那匹马回来，”祝驿丞说，“五更就走这一封。”<\/p>\n<p data-p=\"72\">险报留在桌上。<\/p>\n<p data-p=\"73\">沈默看着那个封套。<\/p>\n<p data-p=\"74\">“劳驾，”他说，“记一笔。”<\/p>\n<p data-p=\"75\">祝驿丞翻开驿簿，蘸了墨：“什么时辰？”<\/p>\n<p data-p=\"76\">“一更二点。户房沈默，交郑典史险报一封。”<\/p>\n<p data-p=\"77\">祝驿丞写了，把簿子转过来。沈默等那一行墨干了，才走。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"78\">回到户房，他取过一张竹纸，写：<\/p>\n<p class=\"chao\" data-p=\"79\">六月十三日。西堤点夫一百四十二名。险报交驿，驿簿有记。<\/p>\n<p data-p=\"80\">吹干，折两折，夹进褡裢。<\/p>\n<p data-p=\"81\">他开了抽屉，把核销册翻到册首。<\/p>\n<p data-p=\"82\">明日巳时，县丞老爷要看这一页。经手书办，那一行还空着。<\/p>\n<p data-p=\"83\">他蘸了墨，提起笔。<\/p>\n<p data-p=\"84\">笔尖悬在那一行上头。灯芯噼地响了一声。窗外的雨一阵紧一阵慢，打在窗纸上。<\/p>\n<p data-p=\"85\">墨在笔尖上聚着，越聚越重，落下来一滴，正落在那一行空白里，洇开，圆圆的一个黑点。<\/p>\n<p data-p=\"86\">他把笔搁回笔山上。<\/p>\n<p data-p=\"87\">窗外，雨声底下压着另一种声音，从城西来，闷闷的，一阵一阵，比往夜都大。<\/p>\n<p data-p=\"88\">他坐不住了。<\/p>\n<p data-p=\"89\">西门的门军还是昨夜那个，见他上来，把灯笼往他脸上照了照。<\/p>\n<p data-p=\"90\">“沈书办，今夜可别再出城了。”<\/p>\n<p data-p=\"91\">“不出城，上去看看。”<\/p>\n<p data-p=\"92\">城楼上风大，雨横着扫过来。往西望，一片黑。黑里有几点火光，排成一线，是堤上守夜的人举着的火把。<\/p>\n<p data-p=\"93\">他数了数，九点。是中段那九个人。<\/p>\n<p data-p=\"94\">远一点，堤顶草棚那边，还有两三点，很暗，挤在一处。<\/p>\n<p data-p=\"95\">他站在垛口后头，看着那九点火。火在风里晃，一会儿暗下去，一会儿又亮起来。<\/p>\n<p data-p=\"96\">二更的梆子从城里传过来。<\/p>\n<p data-p=\"97\">那九点火，动了。<\/p>\n<p data-p=\"98\">一点跟着一点，离了堤，顺着河往东去，往埠头那边去，越走越小。<\/p>\n<p data-p=\"99\">换班了。他想。夜里各村轮班，郑典史是这么交代的。<\/p>\n<p data-p=\"100\">他等着新的火上来。<\/p>\n<p data-p=\"101\">梆子声远了。雨一阵紧一阵。中段那里，黑着。<\/p>\n<p data-p=\"102\">三更的梆子，也从城里传过来了。<\/p>\n<p data-p=\"103\">新的火一直没有来。<\/p>\n<p data-p=\"104\">先到的是一声闷响。很长，很低，不像雷。城楼的木板在他脚底下抖了一下。<\/p>\n<p data-p=\"105\">接着是水声。不再是一阵一阵的了，连成一片，像有什么东西被一把扯开。<\/p>\n<p data-p=\"106\">远处那两三点火，灭了。<\/p>\n<p data-p=\"107\">不知过了多久，城门底下有人拍门。门军提着灯笼跑下去，沈默跟在后头。<\/p>\n<p data-p=\"108\">门开了半扇，挤进来一个人，浑身是泥，泥糊到胸口，头发贴在脸上。是个老头。<\/p>\n<p data-p=\"109\">沈默认出了他。白日里被郑典史赶到棚后头歇着的那几个老的，有他一个。<\/p>\n<p data-p=\"110\">“西堤……中段……开了口子……”<\/p>\n<p data-p=\"111\">“守堤的人呢？”<\/p>\n<p data-p=\"112\">“走了。”<\/p>\n<p data-p=\"113\">“不是换班？”<\/p>\n<p data-p=\"114\">“没人来换。”老头喘着气，“二更来了个差爷，说埠头的官仓进了水，县里要人去扛粮。年轻的都跟着去了，王领工也去了。”<\/p>\n<p data-p=\"115\">“堤上不留人？”<\/p>\n<p data-p=\"116\">“差爷说，堤上留了人。”<\/p>\n<p data-p=\"117\">“郑老爷交代过，堤上的人要动，先进城问他。”<\/p>\n<p data-p=\"118\">“问过了。”老头喘着气，“差爷说，郑老爷那里点过头的。”<\/p>\n<p data-p=\"119\">他抬起头，脸上的水往下淌。<\/p>\n<p data-p=\"120\">“留的就是我们几个老的。在棚后头歇着，没人跟我们说。”<\/p>\n<p data-p=\"121\">沈默站在城门洞里。雨从门楼上一挂一挂地垂下来。<\/p>\n<p data-p=\"122\">那封险报，这会儿还压在驿站的桌上。<\/p>\n<p data-p=\"123\">老宋的禀帖，盖着户房收讫，还夹在他的册子里。驿簿上那一行，写的是户房沈默。<\/p>\n<p data-p=\"124\">这已经不是一本账的事了。<\/p>", "paras": ["雨又换了下法。不再是毛雨，是一根一根往下砸的，砸在院里的积水上，起一层白烟。", "天刚亮透，沈默把核销册从抽屉里取出来，摊开，还没翻到册首，典史那边的差役就到了门口：", "“郑老爷让户房出一个人，上西堤点夫。各村派来的民夫，按村按户点名，记个实数。”", "户房里只有他一个。他把核销册锁回抽屉，拿上西乡各村的人丁册，出了门。", "西堤上一整天都是人。各村的民夫一队一队上来，扛着土袋往堤顶送。郑典史站在草棚口，蓑衣滴着水，手里没拿伞。他冲堤下喊：“老的别往上扛了，去棚后头歇着！累倒了还得抬你们！”", "几个白头发的民夫放下土袋，挪到棚后头去了。", "沈默坐在棚里，一个一个念名字，一个一个点。", "“西乡三都，东村，宋——”", "“到。”", "老宋站在雨里，肩上的土袋还没放下。他看见是沈默，等沈默在名字旁边点了一笔，才开口：", "“沈书办，昨日那张帖子，县里看了没有？”", "沈默把笔搁在册沿上。", "“县丞老爷去府里了。”", "“哦。”", "老宋把土袋往肩上颠了颠，跟着队伍走了。", "午时，县里抬上来两桶糙米饭。郑典史让人在棚口摆开，自己站在桶边。", "“点过名的，挨个来打饭。没点上名的，没有。县里就拨了这些米。”", "队伍里有个半大孩子，跟着他爹来的，册上没有他。打饭的差役把他从队里拉了出来。", "孩子没哭，站在雨里，看着桶。", "郑典史看了他一眼，把蓑衣领子往上拉了拉。等饭打完了，他从自己那一碗里拨出一半，倒进孩子手里，转身走了。", "沈默低头看了看自己膝上的人丁册。", "午后，阿芸冒雨跑上堤来，裤腿湿到膝盖。她没往棚里看，径直找到她爹，凑近说了几句什么。", "老宋放下土袋，走到棚口。", "“郑老爷，西乡屋后头进水了，家里的粮还堆在地上。小人回去搬一趟，天黑前就回来。”", "“点了名的，一个都不许下堤。”", "“就一趟——”", "“堤要是在你走的那一趟开了，”郑典史说，“你担得起？”", "老宋没再说话，回去扛他的土袋。", "阿芸站在雨里，回头往棚里看了一眼。沈默低着头记数。", "到天擦黑，一共点了一百四十二名。", "郑典史叫他去中段再点一回：“那儿水最急，看看还剩几个人。”", "中段在下游拐弯的地方。浪头一层压一层撞上来，退下去的时候，带走一层泥。堤脚插着一根量水的竹竿，竿上一道一道刻着印子，竿头涂了一圈红。水到了红，就要漫堤。", "王老实带着两个人，正往堤缝里塞草袋。", "“水到哪儿了？”", "王老实看了一眼竹竿：“早上离红还有三道，这会儿只差一道了。”", "浪头退下去，红圈底下露出一道刻痕；浪头扑上来，那道刻痕就没了。", "竹竿旁边，有一截土是新翻的。颜色比旁边深，松松的，雨落上去一下就渗没了。泥上留着锹印，一道一道，口子齐整。", "“这一截，是你的人补的？”", "“不是我的人动的。”", "“那是谁？”", "王老实没答。他把草袋踩实了，在裤腿上蹭了蹭手，走近两步，压低了声音：", "“沈书办，小人斗胆，求书办给记一笔：这截土，不是小人的人动的。”", "沈默没有掏纸。他数了数中段的人：连王老实在内，九个。", "回到草棚，郑典史已经在收拾。沈默把九这个数报上去，又说：“中段堤脚有一截新土，松的。水离竿头的红，只差一道。”", "“我叫人添了草袋。”", "“中段只有九个人。”", "“中段去年才修竣，石头都是新的，”郑典史说，“人得放在塌了的地方。”", "他朝上游努了努嘴。老宋帖子里说的那两处塌口，一处压着四十多个人，土袋垒得比人还高。", "沈默想起那三百方没到堤上的料石。", "他没说出口。", "“昨夜堤上撤过一回人。”", "“撤夫是县里点的，”郑典史说，“我这儿有底。”", "他把一张纸折起来，装进封套，封了口，递给沈默：“险情急报，报府里的。你回城，顺路送驿站，叫他们连夜走。”", "又转头对几个甲长说：“夜里各村轮班，守到天亮，一个都不许下堤。”", "他顿了顿。", "“堤上的人要动，先进城来问我。”", "天黑透的时候，沈默到了驿站。", "马棚里点着一盏风灯，灯罩上全是水。祝驿丞蹲在马槽边，正往一匹马的前蹄上缠布，见他进来，起身在衣裳上擦了擦手。", "“沈书办。”", "“郑老爷的险报，报府里，要连夜走。”", "祝驿丞接过封套，回头看了看马棚。两匹马，一匹前腿缠着布，站不稳；另一匹已经备好了鞍。", "桌上压着一块红漆木牌，牌上的字被雨洇开了一半。", "“府里的催粮牌，催各县交夏粮的，午后到的，今夜要递到下一县。”祝驿丞说，“就这一匹能跑。”", "祝驿丞拿起险报，翻过来看了看封皮。", "“有县里的印没有？”", "“县丞老爷去了府里。”", "祝驿丞把险报放下了，他把险报和催粮牌并排放在桌上，边角对齐。", "“催粮牌上填着限，误一个时辰，挨板子的是我。”他说，“这一封没有印，没有限，算寻常申文。晚走半夜，谁也挑不出错。”", "“堤上的水等不得。”", "“沈书办，水也不等马。马跑到府里，是明日的事；府里看了，再派人下来，是后日的事。”", "他把催粮牌塞进马夫怀里。马夫牵着马出了棚，蹄子踩在水里，啪，啪，很快没了声。", "“那匹马回来，”祝驿丞说，“五更就走这一封。”", "险报留在桌上。", "沈默看着那个封套。", "“劳驾，”他说，“记一笔。”", "祝驿丞翻开驿簿，蘸了墨：“什么时辰？”", "“一更二点。户房沈默，交郑典史险报一封。”", "祝驿丞写了，把簿子转过来。沈默等那一行墨干了，才走。", "回到户房，他取过一张竹纸，写：", "六月十三日。西堤点夫一百四十二名。险报交驿，驿簿有记。", "吹干，折两折，夹进褡裢。", "他开了抽屉，把核销册翻到册首。", "明日巳时，县丞老爷要看这一页。经手书办，那一行还空着。", "他蘸了墨，提起笔。", "笔尖悬在那一行上头。灯芯噼地响了一声。窗外的雨一阵紧一阵慢，打在窗纸上。", "墨在笔尖上聚着，越聚越重，落下来一滴，正落在那一行空白里，洇开，圆圆的一个黑点。", "他把笔搁回笔山上。", "窗外，雨声底下压着另一种声音，从城西来，闷闷的，一阵一阵，比往夜都大。", "他坐不住了。", "西门的门军还是昨夜那个，见他上来，把灯笼往他脸上照了照。", "“沈书办，今夜可别再出城了。”", "“不出城，上去看看。”", "城楼上风大，雨横着扫过来。往西望，一片黑。黑里有几点火光，排成一线，是堤上守夜的人举着的火把。", "他数了数，九点。是中段那九个人。", "远一点，堤顶草棚那边，还有两三点，很暗，挤在一处。", "他站在垛口后头，看着那九点火。火在风里晃，一会儿暗下去，一会儿又亮起来。", "二更的梆子从城里传过来。", "那九点火，动了。", "一点跟着一点，离了堤，顺着河往东去，往埠头那边去，越走越小。", "换班了。他想。夜里各村轮班，郑典史是这么交代的。", "他等着新的火上来。", "梆子声远了。雨一阵紧一阵。中段那里，黑着。", "三更的梆子，也从城里传过来了。", "新的火一直没有来。", "先到的是一声闷响。很长，很低，不像雷。城楼的木板在他脚底下抖了一下。", "接着是水声。不再是一阵一阵的了，连成一片，像有什么东西被一把扯开。", "远处那两三点火，灭了。", "不知过了多久，城门底下有人拍门。门军提着灯笼跑下去，沈默跟在后头。", "门开了半扇，挤进来一个人，浑身是泥，泥糊到胸口，头发贴在脸上。是个老头。", "沈默认出了他。白日里被郑典史赶到棚后头歇着的那几个老的，有他一个。", "“西堤……中段……开了口子……”", "“守堤的人呢？”", "“走了。”", "“不是换班？”", "“没人来换。”老头喘着气，“二更来了个差爷，说埠头的官仓进了水，县里要人去扛粮。年轻的都跟着去了，王领工也去了。”", "“堤上不留人？”", "“差爷说，堤上留了人。”", "“郑老爷交代过，堤上的人要动，先进城问他。”", "“问过了。”老头喘着气，“差爷说，郑老爷那里点过头的。”", "他抬起头，脸上的水往下淌。", "“留的就是我们几个老的。在棚后头歇着，没人跟我们说。”", "沈默站在城门洞里。雨从门楼上一挂一挂地垂下来。", "那封险报，这会儿还压在驿站的桌上。", "老宋的禀帖，盖着户房收讫，还夹在他的册子里。驿簿上那一行，写的是户房沈默。", "这已经不是一本账的事了。"], "recap": "库房漫水，余司吏连夜搬册子。沈默先把西乡三都的鱼鳞册搬上最高一层，又从水里捞出西堤中段的验收簿：验收人一栏空着，第二页被人拆了，封皮上写着“册已缴销”。余司吏问他册费多出来的三钱，叫他把东西搁回去。他把验收簿放在了最上一层；天亮时，那里空了。吴县丞昨夜去了府里。"}, {"n": 5, "cn": "五", "title": "水过", "era": "", "chars": 2640, "mins": 7, "html": "<p data-p=\"0\">天亮的时候，雨小了。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>在西门城楼上，一直站到天亮。天一点一点白起来，他才看清城外。<\/p>\n<p data-p=\"2\">西乡那一片，平平的，全是黄水。露在水面上的，是桑树梢、屋脊，和一截一截断开的田埂。水面上漂着稻秧，绿的，连根带泥，一片一片往下游去。<\/p>\n<p data-p=\"3\">再远些，三都那边，有一棵老槐树，只剩一个树冠浮在水上。<\/p>\n<p data-p=\"4\">他知道那棵槐树底下原来有一口井，井沿上的石头，被人坐得发亮。<\/p>\n<p data-p=\"5\">他把眼睛挪开了。<\/p>\n<p data-p=\"6\">水面上有几条船，在屋脊之间穿来穿去，往船上拉人。船头插着一面小旗，旗上一个“张”字。<\/p>\n<p data-p=\"7\">他低头看城墙根。水贴着墙脚，到第三块砖，就不往上走了。<\/p>\n<p data-p=\"8\">城里，一滴水也没进。<\/p>\n<p data-p=\"9\">城外高处的土坡上，挤满了人。有人背着锅，有人抱着孩子，有人牵着一头湿透的牛，站在雨里，望着城门。<\/p>\n<p data-p=\"10\">城门没开。<\/p>\n<p data-p=\"11\"><b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>站在门楼底下，嗓子已经哑了：“城门不开。粥抬出去，老的小的先吃。”<\/p>\n<p data-p=\"12\">一个妇人挤到门缝跟前，怀里的孩子脸烧得通红：“老爷，孩子发热，让我进城找个郎中——”<\/p>\n<p data-p=\"13\">“城门不开。”<\/p>\n<p data-p=\"14\">“就我一个，就一个——”<\/p>\n<p data-p=\"15\">“你一个进来，后头就是一坡人。”郑典史说，“开了，就关不上了。”<\/p>\n<p data-p=\"16\">妇人跪在泥里，不动。<\/p>\n<p data-p=\"17\">郑典史转头对差役说：“去后街把刘郎中叫来，从小门出去，给她看。”<\/p>\n<p data-p=\"18\">他自己扛起第一桶粥，也从小门出去了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"19\">巳时，<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>回来了。<\/p>\n<p data-p=\"20\">他是从东门进的城，马浑身是泥，人也是。郑典史迎上去，沈默跟在后头，怀里揣着那本核销册。<\/p>\n<p data-p=\"21\">吴县丞没下马，先问：“城里进水没有？”<\/p>\n<p data-p=\"22\">“没有。”<\/p>\n<p data-p=\"23\">“仓呢？”<\/p>\n<p data-p=\"24\">“粮扛出来了，泡了一角。”<\/p>\n<p data-p=\"25\">吴县丞点点头，这才下马。他上了西门城楼，站在垛口后头，往西看。<\/p>\n<p data-p=\"26\">郑典史站在他身后，蓑衣上的水一滴一滴，在城砖上积了一小摊。<\/p>\n<p data-p=\"27\">“报府的灾状，”他转过身，“今夜就写。”<\/p>\n<p data-p=\"28\">他从沈默身边走过去，看了他一眼，没停。<\/p>\n<p data-p=\"29\">巳时过了。那本册子，没有人提。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">第二日，沈默被派去西乡清点灾户。<\/p>\n<p data-p=\"31\">水退了一些，田埂露出来了，泥能没到小腿。里长撑着一条小船，船头搁着一本草册，用油布包着。<\/p>\n<p data-p=\"32\">“上头要个实数，”里长说，“哪家淹了，淹了几亩，倒了几间屋，一户一户核。”<\/p>\n<p data-p=\"33\">西乡三都东村，十七户。沈默一家一家数过去。露着屋脊的，十一户；只剩半截墙的，四户；还有两户，连屋带地基，看不出在哪儿了。<\/p>\n<p data-p=\"34\">船从一片桑树梢中间穿过去。树梢上挂着一只斗笠，被水泡得发黑。<\/p>\n<p data-p=\"35\">“堤上棚后头那几个老的，”里长说，“回来两个。还有一个，没找着。”<\/p>\n<p data-p=\"36\">沈默没接话。他低头在纸上又添了一笔。<\/p>\n<p data-p=\"37\"><b class=\"rn\" data-c=\"laozhou\">老宋<\/b>家在村口，地势最低。屋顶塌了一半，泥墙泡得发白，门口那棵桑树歪在水里，树根翻出来一大块。<\/p>\n<p data-p=\"38\">老宋和<b class=\"rn\" data-c=\"ayun\">阿芸<\/b>坐在屋后的土堆上。土堆上生着一小堆火，烟是湿的，贴着地爬。火边搁着一片瓦，瓦上摊着一张纸，纸角卷着，老宋用两根指头按着，翻过来，又翻过去。<\/p>\n<p data-p=\"39\">沈默看了一眼。是田契。<\/p>\n<p data-p=\"40\">契尾那枚红印泡得发了晕。他把眼睛挪开了。<\/p>\n<p data-p=\"41\">阿芸怀里抱着一只竹匾，匾里的蚕，一条都不动了。<\/p>\n<p data-p=\"42\">里长解开油布，翻开草册，用指头往下划，划到一处，停了。<\/p>\n<p data-p=\"43\">沈默凑过去看。<\/p>\n<p data-p=\"44\">东村，宋，那一行后头，写着三个字：未受灾。<\/p>\n<p data-p=\"45\">同一页上，还有四户，后头也写着这三个字。<\/p>\n<p data-p=\"46\">“这是怎么回事？”<\/p>\n<p data-p=\"47\">“没勘过的，先写未受灾。”里长说，“上头交代的，免得多报。等县里来人看过，再改。”<\/p>\n<p data-p=\"48\">“什么时候来人看？”<\/p>\n<p data-p=\"49\">里长没答。<\/p>\n<p data-p=\"50\">老宋从土堆上站起来，走过来，看了看草册，又看了看自己的屋。<\/p>\n<p data-p=\"51\">“里长，我家算淹了没有？”<\/p>\n<p data-p=\"52\">“上了这本册，衙门才认你家淹了。”里长说，“没勘过，就先算没淹。”<\/p>\n<p data-p=\"53\">“没淹，”老宋说，“夏粮还交不交？”<\/p>\n<p data-p=\"54\">“催粮牌前几日就下来了。”里长看着草册，“没淹，就得交。”<\/p>\n<p data-p=\"55\">老宋把手在衣襟上擦了擦，回头看着火边那张田契。<\/p>\n<p data-p=\"56\">“我前几日递过帖子的，”他说，“说堤脚塌了。”<\/p>\n<p data-p=\"57\">“递给谁了？”<\/p>\n<p data-p=\"58\">老宋看了沈默一眼。<\/p>\n<p data-p=\"59\">里长也看了沈默一眼。<\/p>\n<p data-p=\"60\">沈默的手按在褡裢上。那张禀帖，还夹在户房的册子里，盖着户房收讫，日子是六月十二。<\/p>\n<p data-p=\"61\">“户房收了。”他说。<\/p>\n<p data-p=\"62\">里长“哦”了一声，在草册边上，用指甲划了一道。<\/p>\n<p data-p=\"63\">阿芸抱着那只竹匾，一直看着他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"64\">那天夜里，他在户房取过一张竹纸，写：<\/p>\n<p class=\"chao\" data-p=\"65\">六月十五日。西乡三都东村十七户，屋塌十五，无存二。<\/p>\n<p data-p=\"66\">他看着这一行，笔停在纸上。<\/p>\n<p data-p=\"67\">终究没有往下添。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"68\">第三日，<b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>被带到衙门问话。<\/p>\n<p data-p=\"69\">郑典史坐在案后，沈默站在一边，手里捧着去年腊月的料石账。<\/p>\n<p data-p=\"70\">“石料七百二十方，到堤上的有多少？”<\/p>\n<p data-p=\"71\">王老实跪在地上，裤腿上的泥还没干。<\/p>\n<p data-p=\"72\">“四百……四百出头。”<\/p>\n<p data-p=\"73\">“其余的呢？”<\/p>\n<p data-p=\"74\">“小人……小人卖过一些。”王老实磕了个头，“乡里有人砌猪圈、修坟，来讨几块石头，小人收了几个钱。统共二三十方，小人认。”<\/p>\n<p data-p=\"75\">沈默在心里算了一遍。二三十方。差的是三百方。<\/p>\n<p data-p=\"76\">郑典史搁下笔。他转过头来看沈默：“账上记的多少？”<\/p>\n<p data-p=\"77\">“七百二十方。”<\/p>\n<p data-p=\"78\">郑典史没往下算。<\/p>\n<p data-p=\"79\">“差的那些，是户房的账，”他说，“户房自己核清楚。”<\/p>\n<p data-p=\"80\">他转回去，接着问王老实：“堤身动过没有？”<\/p>\n<p data-p=\"81\">“没有！”王老实抬起头，“堤身小人一锹没动过。那截新土，不是小人的人动的。”<\/p>\n<p data-p=\"82\">“二更你去了哪儿？”<\/p>\n<p data-p=\"83\">“去埠头扛粮。”<\/p>\n<p data-p=\"84\">“谁叫你去的？”<\/p>\n<p data-p=\"85\">“差爷说，是县里。”<\/p>\n<p data-p=\"86\">郑典史“嗯”了一声，提笔记了几个字，没再往下问。<\/p>\n<p data-p=\"87\">“带下去。”<\/p>\n<p data-p=\"88\">两个差役架起王老实。走到门口，他扭过头来：<\/p>\n<p data-p=\"89\">“沈书办，那日小人求书办记一笔的——”<\/p>\n<p data-p=\"90\">话没说完，人已经被拖出去了。<\/p>\n<p data-p=\"91\">沈默低头看着手里的料石账。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"92\">傍晚，吴县丞叫沈默去二堂。<\/p>\n<p data-p=\"93\">吴县丞坐在灯下，面前摊着一张纸，是里长递上来的呈文。他没让沈默坐。<\/p>\n<p data-p=\"94\">“西乡宋某，说六月十二日递过禀帖，报堤脚塌陷，交在户房。”他抬起头，“有这回事？”<\/p>\n<p data-p=\"95\">“有。”<\/p>\n<p data-p=\"96\">“拿来。”<\/p>\n<p data-p=\"97\">沈默回到户房，开了抽屉，取出核销册。<\/p>\n<p data-p=\"98\">册首经手书办那一行，那滴墨已经干了，硬硬的一个黑点。<\/p>\n<p data-p=\"99\">那张禀帖还夹在册子中间，纸边烂了，一捏就是一层浆。右下角那枚印，朱红的，一点没褪：户房收讫。<\/p>\n<p data-p=\"100\">旁边是他自己的字：六月十二日，西乡民宋某具。<\/p>\n<p data-p=\"101\">他把禀帖拿回二堂，放在吴县丞面前。<\/p>\n<p data-p=\"102\">吴县丞用两根指头捏起来，把那枚红印凑到灯下。<\/p>\n<p data-p=\"103\">“收了，”他说，“为何不报？”<\/p>\n<p data-p=\"104\">“回老爷，十三日夜里，郑典史的险报是户房亲手送的驿站，一更二点，驿簿有记。”<\/p>\n<p data-p=\"105\">“那是典史的报，不是你的。”吴县丞说，“十二日收的帖子，十三日夜里才有人往上报。中间这一整日，户房做什么了？”<\/p>\n<p data-p=\"106\">沈默站在灯影里。<\/p>\n<p data-p=\"107\">“核账。”<\/p>\n<p data-p=\"108\">“核什么账？”<\/p>\n<p data-p=\"109\">“西堤的核销册。”<\/p>\n<p data-p=\"110\">吴县丞看着他，把禀帖放回案上，用手掌压平。<\/p>\n<p data-p=\"111\">“西堤都没了，”他说，“还核西堤的账？那本册子，先放着。”<\/p>\n<p data-p=\"112\">他拿起禀帖，指着右下角那枚红印旁边的一行小字。<\/p>\n<p data-p=\"113\">“这是谁的字？”<\/p>\n<p data-p=\"114\">“是小的。”<\/p>\n<p data-p=\"115\">“灾前收了险情不报，府里要是问下来，”吴县丞说，“经手的担。”<\/p>\n<p data-p=\"116\">他把禀帖折起来，收进了自己的抽屉。<\/p>\n<p data-p=\"117\">“府里不问，这张帖子就先在我这儿放着。灾册还要你造，明日照常上差。”<\/p>\n<p data-p=\"118\">沈默退出二堂。廊下的雨，又密了。<\/p>\n<p data-p=\"119\">当初留这张纸，是怕将来有人问起。<\/p>\n<p data-p=\"120\">如今有人问了。纸，在别人的抽屉里。<\/p>", "paras": ["天亮的时候，雨小了。", "沈默在西门城楼上，一直站到天亮。天一点一点白起来，他才看清城外。", "西乡那一片，平平的，全是黄水。露在水面上的，是桑树梢、屋脊，和一截一截断开的田埂。水面上漂着稻秧，绿的，连根带泥，一片一片往下游去。", "再远些，三都那边，有一棵老槐树，只剩一个树冠浮在水上。", "他知道那棵槐树底下原来有一口井，井沿上的石头，被人坐得发亮。", "他把眼睛挪开了。", "水面上有几条船，在屋脊之间穿来穿去，往船上拉人。船头插着一面小旗，旗上一个“张”字。", "他低头看城墙根。水贴着墙脚，到第三块砖，就不往上走了。", "城里，一滴水也没进。", "城外高处的土坡上，挤满了人。有人背着锅，有人抱着孩子，有人牵着一头湿透的牛，站在雨里，望着城门。", "城门没开。", "郑典史站在门楼底下，嗓子已经哑了：“城门不开。粥抬出去，老的小的先吃。”", "一个妇人挤到门缝跟前，怀里的孩子脸烧得通红：“老爷，孩子发热，让我进城找个郎中——”", "“城门不开。”", "“就我一个，就一个——”", "“你一个进来，后头就是一坡人。”郑典史说，“开了，就关不上了。”", "妇人跪在泥里，不动。", "郑典史转头对差役说：“去后街把刘郎中叫来，从小门出去，给她看。”", "他自己扛起第一桶粥，也从小门出去了。", "巳时，吴县丞回来了。", "他是从东门进的城，马浑身是泥，人也是。郑典史迎上去，沈默跟在后头，怀里揣着那本核销册。", "吴县丞没下马，先问：“城里进水没有？”", "“没有。”", "“仓呢？”", "“粮扛出来了，泡了一角。”", "吴县丞点点头，这才下马。他上了西门城楼，站在垛口后头，往西看。", "郑典史站在他身后，蓑衣上的水一滴一滴，在城砖上积了一小摊。", "“报府的灾状，”他转过身，“今夜就写。”", "他从沈默身边走过去，看了他一眼，没停。", "巳时过了。那本册子，没有人提。", "第二日，沈默被派去西乡清点灾户。", "水退了一些，田埂露出来了，泥能没到小腿。里长撑着一条小船，船头搁着一本草册，用油布包着。", "“上头要个实数，”里长说，“哪家淹了，淹了几亩，倒了几间屋，一户一户核。”", "西乡三都东村，十七户。沈默一家一家数过去。露着屋脊的，十一户；只剩半截墙的，四户；还有两户，连屋带地基，看不出在哪儿了。", "船从一片桑树梢中间穿过去。树梢上挂着一只斗笠，被水泡得发黑。", "“堤上棚后头那几个老的，”里长说，“回来两个。还有一个，没找着。”", "沈默没接话。他低头在纸上又添了一笔。", "老宋家在村口，地势最低。屋顶塌了一半，泥墙泡得发白，门口那棵桑树歪在水里，树根翻出来一大块。", "老宋和阿芸坐在屋后的土堆上。土堆上生着一小堆火，烟是湿的，贴着地爬。火边搁着一片瓦，瓦上摊着一张纸，纸角卷着，老宋用两根指头按着，翻过来，又翻过去。", "沈默看了一眼。是田契。", "契尾那枚红印泡得发了晕。他把眼睛挪开了。", "阿芸怀里抱着一只竹匾，匾里的蚕，一条都不动了。", "里长解开油布，翻开草册，用指头往下划，划到一处，停了。", "沈默凑过去看。", "东村，宋，那一行后头，写着三个字：未受灾。", "同一页上，还有四户，后头也写着这三个字。", "“这是怎么回事？”", "“没勘过的，先写未受灾。”里长说，“上头交代的，免得多报。等县里来人看过，再改。”", "“什么时候来人看？”", "里长没答。", "老宋从土堆上站起来，走过来，看了看草册，又看了看自己的屋。", "“里长，我家算淹了没有？”", "“上了这本册，衙门才认你家淹了。”里长说，“没勘过，就先算没淹。”", "“没淹，”老宋说，“夏粮还交不交？”", "“催粮牌前几日就下来了。”里长看着草册，“没淹，就得交。”", "老宋把手在衣襟上擦了擦，回头看着火边那张田契。", "“我前几日递过帖子的，”他说，“说堤脚塌了。”", "“递给谁了？”", "老宋看了沈默一眼。", "里长也看了沈默一眼。", "沈默的手按在褡裢上。那张禀帖，还夹在户房的册子里，盖着户房收讫，日子是六月十二。", "“户房收了。”他说。", "里长“哦”了一声，在草册边上，用指甲划了一道。", "阿芸抱着那只竹匾，一直看着他。", "那天夜里，他在户房取过一张竹纸，写：", "六月十五日。西乡三都东村十七户，屋塌十五，无存二。", "他看着这一行，笔停在纸上。", "终究没有往下添。", "第三日，王老实被带到衙门问话。", "郑典史坐在案后，沈默站在一边，手里捧着去年腊月的料石账。", "“石料七百二十方，到堤上的有多少？”", "王老实跪在地上，裤腿上的泥还没干。", "“四百……四百出头。”", "“其余的呢？”", "“小人……小人卖过一些。”王老实磕了个头，“乡里有人砌猪圈、修坟，来讨几块石头，小人收了几个钱。统共二三十方，小人认。”", "沈默在心里算了一遍。二三十方。差的是三百方。", "郑典史搁下笔。他转过头来看沈默：“账上记的多少？”", "“七百二十方。”", "郑典史没往下算。", "“差的那些，是户房的账，”他说，“户房自己核清楚。”", "他转回去，接着问王老实：“堤身动过没有？”", "“没有！”王老实抬起头，“堤身小人一锹没动过。那截新土，不是小人的人动的。”", "“二更你去了哪儿？”", "“去埠头扛粮。”", "“谁叫你去的？”", "“差爷说，是县里。”", "郑典史“嗯”了一声，提笔记了几个字，没再往下问。", "“带下去。”", "两个差役架起王老实。走到门口，他扭过头来：", "“沈书办，那日小人求书办记一笔的——”", "话没说完，人已经被拖出去了。", "沈默低头看着手里的料石账。", "傍晚，吴县丞叫沈默去二堂。", "吴县丞坐在灯下，面前摊着一张纸，是里长递上来的呈文。他没让沈默坐。", "“西乡宋某，说六月十二日递过禀帖，报堤脚塌陷，交在户房。”他抬起头，“有这回事？”", "“有。”", "“拿来。”", "沈默回到户房，开了抽屉，取出核销册。", "册首经手书办那一行，那滴墨已经干了，硬硬的一个黑点。", "那张禀帖还夹在册子中间，纸边烂了，一捏就是一层浆。右下角那枚印，朱红的，一点没褪：户房收讫。", "旁边是他自己的字：六月十二日，西乡民宋某具。", "他把禀帖拿回二堂，放在吴县丞面前。", "吴县丞用两根指头捏起来，把那枚红印凑到灯下。", "“收了，”他说，“为何不报？”", "“回老爷，十三日夜里，郑典史的险报是户房亲手送的驿站，一更二点，驿簿有记。”", "“那是典史的报，不是你的。”吴县丞说，“十二日收的帖子，十三日夜里才有人往上报。中间这一整日，户房做什么了？”", "沈默站在灯影里。", "“核账。”", "“核什么账？”", "“西堤的核销册。”", "吴县丞看着他，把禀帖放回案上，用手掌压平。", "“西堤都没了，”他说，“还核西堤的账？那本册子，先放着。”", "他拿起禀帖，指着右下角那枚红印旁边的一行小字。", "“这是谁的字？”", "“是小的。”", "“灾前收了险情不报，府里要是问下来，”吴县丞说，“经手的担。”", "他把禀帖折起来，收进了自己的抽屉。", "“府里不问，这张帖子就先在我这儿放着。灾册还要你造，明日照常上差。”", "沈默退出二堂。廊下的雨，又密了。", "当初留这张纸，是怕将来有人问起。", "如今有人问了。纸，在别人的抽屉里。"], "recap": "沈默上堤点夫，一百四十二名。中段只剩九个人，竿头的红只差一道，堤脚有一截新翻的土。郑典史写了险报，交他送驿站；驿丞先走了府里的催粮牌，险报压在桌上，驿簿上记下一更二点。夜里在城楼上，他看见中段那九点火离了堤，往东埠头去，新的火一直没来。三更，中段决口。"}, {"n": 6, "cn": "六", "title": "漏名", "era": "", "chars": 2389, "mins": 6, "html": "<p data-p=\"0\">决口后第七日，水退到了田埂底下。<\/p>\n<p data-p=\"1\">西乡露出来了。田是平的，一层黄泥，泥上趴着倒伏的稻子，一片一片，都朝一个方向，像被一只手捋过。<\/p>\n<p data-p=\"2\">城外的粥厂搭在西门外的土坡上，三口大锅，一排草棚。头几日不论谁来，舀一碗就走。到了第七日，<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>在锅前立了一块木牌：<\/p>\n<p class=\"chao\" data-p=\"3\">凭册领米。<\/p>\n<p data-p=\"4\">“外县的也往这儿跑，有人一日领三回。”郑典史对<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>说，“米就这些。从今日起，册上有名的，按口发；册上没有的，不发。户房出个人，对册。”<\/p>\n<p data-p=\"5\">户房出的还是他。<\/p>\n<p data-p=\"6\">沈默坐在锅边一张矮桌后头，面前摊着里长们的草册。差役站在他身边，他念一个名字，差役舀一勺。<\/p>\n<p data-p=\"7\">人排成一条长队，从锅边一直排到坡底下。<\/p>\n<p data-p=\"8\">“西乡二都，南村，陈——”<\/p>\n<p data-p=\"9\">“在。”<\/p>\n<p data-p=\"10\">“口四。”<\/p>\n<p data-p=\"11\">一勺，两勺，三勺，四勺。<\/p>\n<p data-p=\"12\">“西乡三都，东村，宋——”<\/p>\n<p data-p=\"13\">队里有人往前挪了一步。<\/p>\n<p data-p=\"14\">沈默的指头在草册上往下划，划到那一行，停了。<\/p>\n<p data-p=\"15\">宋，未受灾。<\/p>\n<p data-p=\"16\">差役探过头来看了一眼：“未受灾的，不发。”<\/p>\n<p data-p=\"17\"><b class=\"rn\" data-c=\"laozhou\">老宋<\/b>站在锅前，手里捧着一只豁了口的陶碗。<b class=\"rn\" data-c=\"ayun\">阿芸<\/b>站在他身后。<\/p>\n<p data-p=\"18\">“差爷，我家屋塌了。”<\/p>\n<p data-p=\"19\">“册上写着呢。”<\/p>\n<p data-p=\"20\">“屋塌了，”老宋转过脸来，“沈书办是看见的。”<\/p>\n<p data-p=\"21\">沈默没有抬头。<\/p>\n<p data-p=\"22\">“册上……还没勘。”<\/p>\n<p data-p=\"23\">“什么时候勘？”<\/p>\n<p data-p=\"24\">他答不上来。七天前，里长也是这么答不上来的。<\/p>\n<p data-p=\"25\">“沈书办。”<\/p>\n<p data-p=\"26\">是阿芸。她从她爹身后走出来，站在桌前，不高，声音也不大。<\/p>\n<p data-p=\"27\">“我家淹没淹，你是看见的。”<\/p>\n<p data-p=\"28\">这是她头一回跟他说话。<\/p>\n<p data-p=\"29\">沈默的笔在草册上停着。差役在旁边等着，后头的队伍也在等着。<\/p>\n<p data-p=\"30\">“下一个。”郑典史在锅那头说。<\/p>\n<p data-p=\"31\">老宋把碗收回去，拉了拉阿芸的袖子。阿芸没动，看着沈默，直到后头的人挤上来，才转身。<\/p>\n<p data-p=\"32\">走出去几步，郑典史叫住老宋：“三都的土地庙，<b class=\"rn\" data-c=\"zhangyuanwai\">张员外<\/b>家施了一口锅，那边不看册。”<\/p>\n<p data-p=\"33\">老宋点了点头，带着阿芸往坡下走了。<\/p>\n<p data-p=\"34\">沈默低下头，念下一个名字。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"35\">午后他回到户房。<\/p>\n<p data-p=\"36\">草册对完了，要誊成一本正式的赈册，明日一早送粥厂，往后就照这一本发米。他一本一本誊。<\/p>\n<p data-p=\"37\">誊到西乡三都，东村那一页，他的笔停了。<\/p>\n<p data-p=\"38\">宋，未受灾。下面四户，也是未受灾。<\/p>\n<p data-p=\"39\">五户人家，十九口人。他在船上数过他们的屋顶。<\/p>\n<p data-p=\"40\">他另取一张纸，把五户的名字、口数、屋塌几间、田没几亩，一行一行写清楚，题了四个字：补录待勘。<\/p>\n<p data-p=\"41\"><b class=\"rn\" data-c=\"yusili\">余司吏<\/b>在库房门口晒册子。雨停了两日，册子摊了一院子，一页一页翻过来，晒背面。<\/p>\n<p data-p=\"42\">沈默把那张纸递给他。<\/p>\n<p data-p=\"43\">余司吏看了一遍，没接，让他自己拿着。<\/p>\n<p data-p=\"44\">“勘过没有？”<\/p>\n<p data-p=\"45\">“没有。我在船上数过。”<\/p>\n<p data-p=\"46\">“你数过不算。”余司吏说，“县里得有老爷亲自去看过，画了押，才算。没画押的名字，不得入册。”<\/p>\n<p data-p=\"47\">“那就请老爷去勘。”<\/p>\n<p data-p=\"48\">“西乡三都，报未受灾的，不止这五户。”余司吏蹲下去，把一页册子翻了个面，“你要补，就得整本重勘。重勘一回，十天半月。已经核定的那几百户，赈册送不出去，米也领不着，得跟着你这五户一起等。”<\/p>\n<p data-p=\"49\">沈默拿着那张纸，站在太阳底下。<\/p>\n<p data-p=\"50\">“你补这五户，”余司吏抬头看他，“图什么？”<\/p>\n<p data-p=\"51\">“府里要是查下来，册上淹了的人家写着未受灾，”沈默说，“经手的是我。”<\/p>\n<p data-p=\"52\">余司吏看了他一会儿。<\/p>\n<p data-p=\"53\">“那你就更不该补。”他说，“补了，就是你承认你知道。”<\/p>\n<p data-p=\"54\">他又低下头去翻册子。<\/p>\n<p data-p=\"55\">“没画押的名字，你自己写上去，就叫越例。越例的东西，谁看见，谁划。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"56\">傍晚，余司吏让他把报府的灾状送到二堂。<\/p>\n<p data-p=\"57\">灾状是户房拟的，数是从草册上汇的：西乡受灾三百一十二户，淹田若干亩，倒屋若干间。那五户不在里头。<\/p>\n<p data-p=\"58\"><b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>看得很慢。看到三百一十二那一行，他停住了。<\/p>\n<p data-p=\"59\">“这三百一十二户，都勘过？”<\/p>\n<p data-p=\"60\">“回老爷，是里长报的。”<\/p>\n<p data-p=\"61\">“府里要的是勘过的数。”吴县丞说，“报多了，府里要派人下来核，核出一户不实，整张灾状都不作数。”<\/p>\n<p data-p=\"62\">他提起笔，把三百一十二划了，在旁边写：勘实二百四十户，余俟续勘。<\/p>\n<p data-p=\"63\">续勘，就是往后再勘。<\/p>\n<p data-p=\"64\">沈默站在案边，眼睛落在吴县丞手边那只抽屉上。<\/p>\n<p data-p=\"65\">吴县丞把笔在砚边舔了两回。窗外有人在喊，粥厂收锅了。<\/p>\n<p data-p=\"66\">他落了款，盖了印，把灾状推过来。<\/p>\n<p data-p=\"67\">“送驿站。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"68\">那天夜里，户房只点了一盏灯。<\/p>\n<p data-p=\"69\">赈册誊好了。沈默翻到西乡三都那一页，看着那五个“未受灾”。<\/p>\n<p data-p=\"70\">册子明日一早送出去。送出去，就照它发米了。<\/p>\n<p data-p=\"71\">他把灯挪近了些，蘸了墨。<\/p>\n<p data-p=\"72\">在那一页末尾的空白处，他用最小的楷字写下第一户：东村宋，口二。<\/p>\n<p data-p=\"73\">写完这一行，他停了笔。<\/p>\n<p data-p=\"74\">吴县丞抽屉里，那张禀帖上，也是他的字。<\/p>\n<p data-p=\"75\">廊下有风，吹得窗纸响了一下。他等了一会儿，没有脚步声。<\/p>\n<p data-p=\"76\">他接着往下写。第二户，口五。第三户，口四。第四户，第五户。<\/p>\n<p data-p=\"77\">五户，十九口。没有画押。<\/p>\n<p data-p=\"78\">写完，他把赈册合上，压在案头。<\/p>\n<p data-p=\"79\">然后他取过一张竹纸，写：<\/p>\n<p class=\"chao\" data-p=\"80\">六月二十日。西乡三都东村宋某等五户，屋塌田没，册载未受灾。<\/p>\n<p data-p=\"81\">他把“宋某”两个字，又描了一遍。<\/p>\n<p data-p=\"82\">吹干，折两折，夹进褡裢。<\/p>\n<p data-p=\"83\">他把笔洗了，吹熄了灯。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"84\">决口以后，他头一回回家。到家的时候，二更已经过了。<\/p>\n<p data-p=\"85\">家在城东一条窄巷里，两间屋。母亲还没睡，坐在灶边，听见他进门，问：<\/p>\n<p data-p=\"86\">“三都那边，淹得厉害不厉害？”<\/p>\n<p data-p=\"87\">“厉害。”<\/p>\n<p data-p=\"88\">母亲没再问。灶上的水开了，她把壶提下来，又说：“村口那棵槐树，还在不在？”<\/p>\n<p data-p=\"89\">“在。只剩个树冠。”<\/p>\n<p data-p=\"90\">母亲“嗯”了一声，把灶膛里的火拨了拨。<\/p>\n<p data-p=\"91\">“你爹在的时候，夏天就在那树底下吃饭。”<\/p>\n<p data-p=\"92\">妻子<b class=\"rn\" data-c=\"heshi\">何氏<\/b>正在里屋的灯下纳鞋底，针穿过去，线拉得很紧。这是替巷口布店做的活，一双二十文。她从里屋出来，接过他的湿衣裳。七岁的<b class=\"rn\" data-c=\"ahe\">阿禾<\/b>趴在床沿上睡着了，手边压着一张描红纸，描到一半。<\/p>\n<p data-p=\"93\">她没有问他今日去了哪里。她嫁过来那年就说过：衙门里的事，回家不要讲。<\/p>\n<p data-p=\"94\">沈默从袖袋里摸出那个红纸包，递给何氏。<\/p>\n<p data-p=\"95\">何氏打开，就着灶火数了一遍。<\/p>\n<p data-p=\"96\">“二两一钱。”她说，“比往月多了三钱。”<\/p>\n<p data-p=\"97\">沈默“嗯”了一声。<\/p>\n<p data-p=\"98\">何氏没再问，把银子包好，收进柜里。<\/p>\n<p data-p=\"99\">“城里的米，三天涨了两回。”她关上柜门，“塾里的先生今日也来过，说下月起，阿禾的束脩要加。”<\/p>\n<p data-p=\"100\">沈默在床沿坐下，看着阿禾手边那张描红纸。描的是一个“人”字。<\/p>\n<p data-p=\"101\">纸是户房写坏的竹纸，背面还有半行账。他常把写坏的纸带回来，给阿禾描字。<\/p>\n<p data-p=\"102\">那天夜里，他睡得很沉。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"103\">第二日一早，他去户房取赈册。<\/p>\n<p data-p=\"104\">赈册还压在案头，原样没动。<\/p>\n<p data-p=\"105\">他翻到西乡三都那一页。<\/p>\n<p data-p=\"106\">页末那五行小字，被一道笔从头到尾划掉了。一笔下来，没有停顿。<\/p>\n<p data-p=\"107\">旁边两个小字：越例。是台阁体。<\/p>", "paras": ["决口后第七日，水退到了田埂底下。", "西乡露出来了。田是平的，一层黄泥，泥上趴着倒伏的稻子，一片一片，都朝一个方向，像被一只手捋过。", "城外的粥厂搭在西门外的土坡上，三口大锅，一排草棚。头几日不论谁来，舀一碗就走。到了第七日，郑典史在锅前立了一块木牌：", "凭册领米。", "“外县的也往这儿跑，有人一日领三回。”郑典史对沈默说，“米就这些。从今日起，册上有名的，按口发；册上没有的，不发。户房出个人，对册。”", "户房出的还是他。", "沈默坐在锅边一张矮桌后头，面前摊着里长们的草册。差役站在他身边，他念一个名字，差役舀一勺。", "人排成一条长队，从锅边一直排到坡底下。", "“西乡二都，南村，陈——”", "“在。”", "“口四。”", "一勺，两勺，三勺，四勺。", "“西乡三都，东村，宋——”", "队里有人往前挪了一步。", "沈默的指头在草册上往下划，划到那一行，停了。", "宋，未受灾。", "差役探过头来看了一眼：“未受灾的，不发。”", "老宋站在锅前，手里捧着一只豁了口的陶碗。阿芸站在他身后。", "“差爷，我家屋塌了。”", "“册上写着呢。”", "“屋塌了，”老宋转过脸来，“沈书办是看见的。”", "沈默没有抬头。", "“册上……还没勘。”", "“什么时候勘？”", "他答不上来。七天前，里长也是这么答不上来的。", "“沈书办。”", "是阿芸。她从她爹身后走出来，站在桌前，不高，声音也不大。", "“我家淹没淹，你是看见的。”", "这是她头一回跟他说话。", "沈默的笔在草册上停着。差役在旁边等着，后头的队伍也在等着。", "“下一个。”郑典史在锅那头说。", "老宋把碗收回去，拉了拉阿芸的袖子。阿芸没动，看着沈默，直到后头的人挤上来，才转身。", "走出去几步，郑典史叫住老宋：“三都的土地庙，张员外家施了一口锅，那边不看册。”", "老宋点了点头，带着阿芸往坡下走了。", "沈默低下头，念下一个名字。", "午后他回到户房。", "草册对完了，要誊成一本正式的赈册，明日一早送粥厂，往后就照这一本发米。他一本一本誊。", "誊到西乡三都，东村那一页，他的笔停了。", "宋，未受灾。下面四户，也是未受灾。", "五户人家，十九口人。他在船上数过他们的屋顶。", "他另取一张纸，把五户的名字、口数、屋塌几间、田没几亩，一行一行写清楚，题了四个字：补录待勘。", "余司吏在库房门口晒册子。雨停了两日，册子摊了一院子，一页一页翻过来，晒背面。", "沈默把那张纸递给他。", "余司吏看了一遍，没接，让他自己拿着。", "“勘过没有？”", "“没有。我在船上数过。”", "“你数过不算。”余司吏说，“县里得有老爷亲自去看过，画了押，才算。没画押的名字，不得入册。”", "“那就请老爷去勘。”", "“西乡三都，报未受灾的，不止这五户。”余司吏蹲下去，把一页册子翻了个面，“你要补，就得整本重勘。重勘一回，十天半月。已经核定的那几百户，赈册送不出去，米也领不着，得跟着你这五户一起等。”", "沈默拿着那张纸，站在太阳底下。", "“你补这五户，”余司吏抬头看他，“图什么？”", "“府里要是查下来，册上淹了的人家写着未受灾，”沈默说，“经手的是我。”", "余司吏看了他一会儿。", "“那你就更不该补。”他说，“补了，就是你承认你知道。”", "他又低下头去翻册子。", "“没画押的名字，你自己写上去，就叫越例。越例的东西，谁看见，谁划。”", "傍晚，余司吏让他把报府的灾状送到二堂。", "灾状是户房拟的，数是从草册上汇的：西乡受灾三百一十二户，淹田若干亩，倒屋若干间。那五户不在里头。", "吴县丞看得很慢。看到三百一十二那一行，他停住了。", "“这三百一十二户，都勘过？”", "“回老爷，是里长报的。”", "“府里要的是勘过的数。”吴县丞说，“报多了，府里要派人下来核，核出一户不实，整张灾状都不作数。”", "他提起笔，把三百一十二划了，在旁边写：勘实二百四十户，余俟续勘。", "续勘，就是往后再勘。", "沈默站在案边，眼睛落在吴县丞手边那只抽屉上。", "吴县丞把笔在砚边舔了两回。窗外有人在喊，粥厂收锅了。", "他落了款，盖了印，把灾状推过来。", "“送驿站。”", "那天夜里，户房只点了一盏灯。", "赈册誊好了。沈默翻到西乡三都那一页，看着那五个“未受灾”。", "册子明日一早送出去。送出去，就照它发米了。", "他把灯挪近了些，蘸了墨。", "在那一页末尾的空白处，他用最小的楷字写下第一户：东村宋，口二。", "写完这一行，他停了笔。", "吴县丞抽屉里，那张禀帖上，也是他的字。", "廊下有风，吹得窗纸响了一下。他等了一会儿，没有脚步声。", "他接着往下写。第二户，口五。第三户，口四。第四户，第五户。", "五户，十九口。没有画押。", "写完，他把赈册合上，压在案头。", "然后他取过一张竹纸，写：", "六月二十日。西乡三都东村宋某等五户，屋塌田没，册载未受灾。", "他把“宋某”两个字，又描了一遍。", "吹干，折两折，夹进褡裢。", "他把笔洗了，吹熄了灯。", "决口以后，他头一回回家。到家的时候，二更已经过了。", "家在城东一条窄巷里，两间屋。母亲还没睡，坐在灶边，听见他进门，问：", "“三都那边，淹得厉害不厉害？”", "“厉害。”", "母亲没再问。灶上的水开了，她把壶提下来，又说：“村口那棵槐树，还在不在？”", "“在。只剩个树冠。”", "母亲“嗯”了一声，把灶膛里的火拨了拨。", "“你爹在的时候，夏天就在那树底下吃饭。”", "妻子何氏正在里屋的灯下纳鞋底，针穿过去，线拉得很紧。这是替巷口布店做的活，一双二十文。她从里屋出来，接过他的湿衣裳。七岁的阿禾趴在床沿上睡着了，手边压着一张描红纸，描到一半。", "她没有问他今日去了哪里。她嫁过来那年就说过：衙门里的事，回家不要讲。", "沈默从袖袋里摸出那个红纸包，递给何氏。", "何氏打开，就着灶火数了一遍。", "“二两一钱。”她说，“比往月多了三钱。”", "沈默“嗯”了一声。", "何氏没再问，把银子包好，收进柜里。", "“城里的米，三天涨了两回。”她关上柜门，“塾里的先生今日也来过，说下月起，阿禾的束脩要加。”", "沈默在床沿坐下，看着阿禾手边那张描红纸。描的是一个“人”字。", "纸是户房写坏的竹纸，背面还有半行账。他常把写坏的纸带回来，给阿禾描字。", "那天夜里，他睡得很沉。", "第二日一早，他去户房取赈册。", "赈册还压在案头，原样没动。", "他翻到西乡三都那一页。", "页末那五行小字，被一道笔从头到尾划掉了。一笔下来，没有停顿。", "旁边两个小字：越例。是台阁体。"], "recap": "天亮，西乡全是黄水，城里一滴水也没进，城门不开。吴县丞回城，先问城里进水没有。沈默去东村清点：十七户，屋塌十五，草册上宋家写着“未受灾”。王老实被带去问话，只认了卖过二三十方石头。傍晚，吴县丞问那张禀帖：收了，为何不报？他把禀帖收进了自己的抽屉。"}, {"n": 7, "cn": "七", "title": "土地庙", "era": "", "chars": 1454, "mins": 4, "html": "<p data-p=\"0\">又过了三日，<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>把一本鱼鳞册放在<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>案上。<\/p>\n<p data-p=\"1\">封皮上写着：西乡三都。<\/p>\n<p data-p=\"2\">是库房漫水那一夜，他头一个搬上最高一层的那本。<\/p>\n<p data-p=\"3\">“府里的催粮牌又来了。”余司吏说，“西乡没报灾的人家，夏粮照征。三都那几户，你去把他们的田一块一块核清楚，开个单子上来。”<\/p>\n<p data-p=\"4\">沈默看着那本册子，没有伸手。<\/p>\n<p data-p=\"5\">余司吏转身要走，走到门口，扶着门框回过头。<\/p>\n<p data-p=\"6\">“你认得路。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">水退了，三都的田埂露出来，一道一道，被泥糊得发白。<\/p>\n<p data-p=\"8\">沈默一手拿着鱼鳞册，一手拿着核田单。册上一个小方格，就是地上一块田；方格里画着田的形状，旁边写着户主的名字。他每核一块，就在单子上记一笔。<\/p>\n<p data-p=\"9\">东村那五户的田，都在低处。泥里还汪着水，稻子烂在泥里，一股酸臭。<\/p>\n<p data-p=\"10\">他在单子上一块一块写：田没。<\/p>\n<p data-p=\"11\">过了东村，往北半里，是井头村。<\/p>\n<p data-p=\"12\">村口那棵老槐树还站着，叶子黄了一半。槐树底下是那口井，井沿上的石头糊了一层泥。<\/p>\n<p data-p=\"13\">井边那块田，在册上是一个歪歪的方格，一头宽一头窄。户主那一栏，写着一个“张”字。<\/p>\n<p data-p=\"14\">这一块不在他的单子上。<\/p>\n<p data-p=\"15\">他的指头在那一格上按了按，翻过去了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"16\">土地庙在三都北边的高坡上，墙塌了一角，供桌上的土地爷少了半边脸。三都逃水的人家，都挤在这块高坡上，草席搭在墙根下，锅灶垒在门口。<\/p>\n<p data-p=\"17\">庙后头支着一口大锅，锅边插着一面小旗，旗上一个“张”字。张家的管事一人一碗地舀，旁边一个账房，舀一碗就在簿子上记一笔：哪村，哪户，几口。<\/p>\n<p data-p=\"18\">“施粥还要记名？”沈默问。<\/p>\n<p data-p=\"19\">“员外说，记个数，好知道施了多少。”账房头也没抬。<\/p>\n<p data-p=\"20\">沈默往那本簿子上看了一眼。东村那一页，宋家也在上面，口二。<\/p>\n<p data-p=\"21\">这本簿子上的名字，比他那本赈册全。<\/p>\n<p data-p=\"22\">庙门口，一个穿破长衫的老头摆了张缺腿的桌子，桌上一方砚，一叠糙纸。是个考了一辈子也没考中秀才的<b class=\"rn\" data-c=\"laotongsheng\">老童生<\/b>，也是逃水来的。<\/p>\n<p data-p=\"23\">替人写呈子，三文钱一张。<\/p>\n<p data-p=\"24\">老童生把桌角上几个铜钱拢进袖子，捋了捋胡子：“老夫写的呈子，递到县里，没有不准的。”<\/p>\n<p data-p=\"25\">旁边一个蹲着烤衣裳的汉子说：“那你自家怎么也蹲在这儿？”<\/p>\n<p data-p=\"26\">老童生不理他，铺开下一张纸。<\/p>\n<p data-p=\"27\">一个妇人蹲在桌边，说一句，他写一句。写完了，他把呈子举起来，照着念给她听：<\/p>\n<p data-p=\"28\">“具呈人西乡三都东村刘氏，为田庐尽没、一家无食，恳请勘验、赐予赈济事——”<\/p>\n<p data-p=\"29\">一个字一个字，拖着读书人念文章的那种腔调。<\/p>\n<p data-p=\"30\">妇人听不懂，只是点头，从怀里摸出三个铜钱，放在桌角上。<\/p>\n<p data-p=\"31\">沈默站在一旁，听他念完。<\/p>\n<p data-p=\"32\">那种腔调，他认得。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"33\">那一年，他十六岁。雨也是这样，下了一个多月，西乡的低田泡烂了，那一年的粮，还得照交。<\/p>\n<p data-p=\"34\">父亲要去县里递呈子，求减一年。他在镇上的塾里读了几年书，呈子是他写的。<\/p>\n<p data-p=\"35\">他写了一整夜，誊了三遍，末尾那一句“伏乞垂怜”，写得最工整。<\/p>\n<p data-p=\"36\">他想，写得好些，衙门里的老爷看了，总会准的。<\/p>\n<p data-p=\"37\">父亲天没亮走的，天黑了才回来。<\/p>\n<p data-p=\"38\">正本递进了衙门，底稿揣在怀里，淋湿了。<\/p>\n<p data-p=\"39\">父亲把它摊在灶边烘，翻过来，又翻过去。<\/p>\n<p data-p=\"40\">母亲问：“怎么样了？”<\/p>\n<p data-p=\"41\">“状递进去了。先回去等。”<\/p>\n<p data-p=\"42\">他等了一个冬天。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"43\">那年冬天，家里卖了牛。第二年，卖了井边那块田。<\/p>\n<p data-p=\"44\">“沈书办。”<\/p>\n<p data-p=\"45\"><b class=\"rn\" data-c=\"laozhou\">老宋<\/b>站在庙门口。<b class=\"rn\" data-c=\"ayun\">阿芸<\/b>站在他身后。<\/p>\n<p data-p=\"46\">“我家那几块田，你核了？”<\/p>\n<p data-p=\"47\">沈默把鱼鳞册合上。<\/p>\n<p data-p=\"48\">“核了。”<\/p>\n<p data-p=\"49\">“淹了吧？”<\/p>\n<p data-p=\"50\">“淹了。我写在单子上了。”<\/p>\n<p data-p=\"51\">“那夏粮还交不交？”<\/p>\n<p data-p=\"52\">“单子只是核田。”沈默说，“册上写着未受灾，就照册征。续勘之后，再行核减。”<\/p>\n<p data-p=\"53\">他的目光没有离开册页。<\/p>\n<p data-p=\"54\">老宋看着他，把斗笠摘下来，在手里转了半圈。阿芸也看着他。<\/p>\n<p data-p=\"55\">庙门口，老童生又在念一张新写的呈子，具呈人，为什么什么事，恳请什么什么。<\/p>\n<p data-p=\"56\">老宋开口了，说得很慢。<\/p>\n<p data-p=\"57\">“你中秀才那年，井头村摆酒，东村也去了人。我也在。”<\/p>\n<p data-p=\"58\">他把斗笠戴了回去。<\/p>\n<p data-p=\"59\">“你站在井沿上说，往后西乡有你。”<\/p>\n<p data-p=\"60\">沈默没有说话。<\/p>\n<p data-p=\"61\">“你那时候，”老宋说，“不是这样说话的。”<\/p>", "paras": ["又过了三日，余司吏把一本鱼鳞册放在沈默案上。", "封皮上写着：西乡三都。", "是库房漫水那一夜，他头一个搬上最高一层的那本。", "“府里的催粮牌又来了。”余司吏说，“西乡没报灾的人家，夏粮照征。三都那几户，你去把他们的田一块一块核清楚，开个单子上来。”", "沈默看着那本册子，没有伸手。", "余司吏转身要走，走到门口，扶着门框回过头。", "“你认得路。”", "水退了，三都的田埂露出来，一道一道，被泥糊得发白。", "沈默一手拿着鱼鳞册，一手拿着核田单。册上一个小方格，就是地上一块田；方格里画着田的形状，旁边写着户主的名字。他每核一块，就在单子上记一笔。", "东村那五户的田，都在低处。泥里还汪着水，稻子烂在泥里，一股酸臭。", "他在单子上一块一块写：田没。", "过了东村，往北半里，是井头村。", "村口那棵老槐树还站着，叶子黄了一半。槐树底下是那口井，井沿上的石头糊了一层泥。", "井边那块田，在册上是一个歪歪的方格，一头宽一头窄。户主那一栏，写着一个“张”字。", "这一块不在他的单子上。", "他的指头在那一格上按了按，翻过去了。", "土地庙在三都北边的高坡上，墙塌了一角，供桌上的土地爷少了半边脸。三都逃水的人家，都挤在这块高坡上，草席搭在墙根下，锅灶垒在门口。", "庙后头支着一口大锅，锅边插着一面小旗，旗上一个“张”字。张家的管事一人一碗地舀，旁边一个账房，舀一碗就在簿子上记一笔：哪村，哪户，几口。", "“施粥还要记名？”沈默问。", "“员外说，记个数，好知道施了多少。”账房头也没抬。", "沈默往那本簿子上看了一眼。东村那一页，宋家也在上面，口二。", "这本簿子上的名字，比他那本赈册全。", "庙门口，一个穿破长衫的老头摆了张缺腿的桌子，桌上一方砚，一叠糙纸。是个考了一辈子也没考中秀才的老童生，也是逃水来的。", "替人写呈子，三文钱一张。", "老童生把桌角上几个铜钱拢进袖子，捋了捋胡子：“老夫写的呈子，递到县里，没有不准的。”", "旁边一个蹲着烤衣裳的汉子说：“那你自家怎么也蹲在这儿？”", "老童生不理他，铺开下一张纸。", "一个妇人蹲在桌边，说一句，他写一句。写完了，他把呈子举起来，照着念给她听：", "“具呈人西乡三都东村刘氏，为田庐尽没、一家无食，恳请勘验、赐予赈济事——”", "一个字一个字，拖着读书人念文章的那种腔调。", "妇人听不懂，只是点头，从怀里摸出三个铜钱，放在桌角上。", "沈默站在一旁，听他念完。", "那种腔调，他认得。", "那一年，他十六岁。雨也是这样，下了一个多月，西乡的低田泡烂了，那一年的粮，还得照交。", "父亲要去县里递呈子，求减一年。他在镇上的塾里读了几年书，呈子是他写的。", "他写了一整夜，誊了三遍，末尾那一句“伏乞垂怜”，写得最工整。", "他想，写得好些，衙门里的老爷看了，总会准的。", "父亲天没亮走的，天黑了才回来。", "正本递进了衙门，底稿揣在怀里，淋湿了。", "父亲把它摊在灶边烘，翻过来，又翻过去。", "母亲问：“怎么样了？”", "“状递进去了。先回去等。”", "他等了一个冬天。", "那年冬天，家里卖了牛。第二年，卖了井边那块田。", "“沈书办。”", "老宋站在庙门口。阿芸站在他身后。", "“我家那几块田，你核了？”", "沈默把鱼鳞册合上。", "“核了。”", "“淹了吧？”", "“淹了。我写在单子上了。”", "“那夏粮还交不交？”", "“单子只是核田。”沈默说，“册上写着未受灾，就照册征。续勘之后，再行核减。”", "他的目光没有离开册页。", "老宋看着他，把斗笠摘下来，在手里转了半圈。阿芸也看着他。", "庙门口，老童生又在念一张新写的呈子，具呈人，为什么什么事，恳请什么什么。", "老宋开口了，说得很慢。", "“你中秀才那年，井头村摆酒，东村也去了人。我也在。”", "他把斗笠戴了回去。", "“你站在井沿上说，往后西乡有你。”", "沈默没有说话。", "“你那时候，”老宋说，“不是这样说话的。”"], "recap": "粥厂立牌：凭册领米。宋家册上写着未受灾，领不到米。阿芸头一回跟沈默说话：我家淹没淹，你是看见的。灾状上的三百一十二户，被吴县丞改成“勘实二百四十户，余俟续勘”。夜里，沈默在赈册末尾补写了东村五户，十九口。决口后他头一回回家，睡得很沉。第二日，那五行被一笔划掉，旁边两个台阁体小字：越例。"}, {"n": 8, "cn": "八", "title": "一碗粥", "era": "", "chars": 1969, "mins": 5, "html": "<p data-p=\"0\">张家的粥，施到第十二日。<\/p>\n<p data-p=\"1\">那天一早，土地庙后头那口大锅没有生火。锅边摆了一张方桌，桌上一杆秤、一本簿子、一盒印泥。<\/p>\n<p data-p=\"2\"><b class=\"rn\" data-c=\"zhangyuanwai\">张员外<\/b>是坐轿子来的。四十多岁，脸很白，穿一件半旧的绸衫。下了轿，他先朝庙里的土地爷拱了拱手，才转过身来。<\/p>\n<p data-p=\"3\">“诸位乡亲。”他说话很慢，“张家的粥，施了十二日，尽了心了。锅能一直烧，米烧不起。”<\/p>\n<p data-p=\"4\">人群里没人出声。<\/p>\n<p data-p=\"5\">“往后，张家不施粥，借米。”他指了指桌上那杆秤，“借一斗，秋后还一斗二。没现钱的，拿田契作保，秋后还上，契原样奉还。”<\/p>\n<p data-p=\"6\">账房把簿子翻开。那本簿子<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>见过，十几天来，谁家吃了几碗，记得清清楚楚。<\/p>\n<p data-p=\"7\">“先过眼前这一关。”张员外说，“田，还是诸位的田。”<\/p>\n<p data-p=\"8\">人群里有人小声说话。<\/p>\n<p data-p=\"9\">“……堤是上面叫决的……”<\/p>\n<p data-p=\"10\">“……淹了田，好叫咱们押出去，改种桑……”<\/p>\n<p data-p=\"11\">“胡说什么！”一个差役回头喝了一声。<\/p>\n<p data-p=\"12\">那几个人不说话了。<\/p>\n<p data-p=\"13\"><b class=\"rn\" data-c=\"laozhou\">老宋<\/b>站在人堆里，摇了摇头：“种桑能吃？”<\/p>\n<p data-p=\"14\">张员外像是没听见。他转过身，朝沈默拱了拱手。<\/p>\n<p data-p=\"15\">“沈书办。”<\/p>\n<p data-p=\"16\">沈默是来办补登的。<\/p>\n<p data-p=\"17\">前一日，<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>出了一道告示，贴在西门外：续勘未到之前，凡未入赈册之户，取里长保结、邻佑画押，先给半赈。<\/p>\n<p data-p=\"18\">半赈，就是册上人家一半的米。<\/p>\n<p data-p=\"19\">保结，就是里长拿自己作保：这户人家确实淹了，确实没入册。日后查出冒领，里长连坐。<\/p>\n<p data-p=\"20\">所以没有里长肯出。<\/p>\n<p data-p=\"21\">“沈书办，”东村的里长把告示看了三遍，“保结一出，日后哪一户查出点不对，小人跟着吃板子。”<\/p>\n<p data-p=\"22\">“东村那五户，你在船上也看见了。”<\/p>\n<p data-p=\"23\">“看是看见了……”<\/p>\n<p data-p=\"24\">沈默没再说话。他从袖子里抽出一本薄册，是东村今年的夏税底册，翻到里长自家那一行，用指头点了点。<\/p>\n<p data-p=\"25\">那一行的尾数，去年秋天，是他替里长抹掉的。<\/p>\n<p data-p=\"26\">里长盯着那一行，喉结动了两下，叹了口气，接过笔。<\/p>\n<p data-p=\"27\">东村五户，一户一户，出了保结。<\/p>\n<p data-p=\"28\">还剩一户。<\/p>\n<p data-p=\"29\"><b class=\"rn\" data-c=\"qiulaohan\">邱老汉<\/b>，六十多岁，带着一个十来岁的孙子。是外县来的，在三都租张家的田种了七八年，户籍还在原籍，不在三都的册上。<\/p>\n<p data-p=\"30\">里长摇头：“他不是我们东村的户，小人保不着。”<\/p>\n<p data-p=\"31\">邻佑也摇头：“他家从哪儿来的，谁也说不清。”<\/p>\n<p data-p=\"32\">沈默去找张员外。<\/p>\n<p data-p=\"33\">张员外正站在桌边，看账房一张一张地收田契，听他说完，点了点头。<\/p>\n<p data-p=\"34\">“邱老汉，是我家的佃户。”<\/p>\n<p data-p=\"35\">“那张员外——”<\/p>\n<p data-p=\"36\">“沈书办是三都人，该知道佃户的规矩。”张员外说得很和气，“我家在三都一带的佃户，三十多户，一家一家都来找我，我管不过来。他今年的租还没算，借米，他拿什么作保？”<\/p>\n<p data-p=\"37\">他想了想，又说：<\/p>\n<p data-p=\"38\">“沈书办若能在官册上给他补个名，官米，总比我家的米便宜。”<\/p>\n<p data-p=\"39\">账房在旁边又收了一张田契，按了个手印，压在秤砣底下。<\/p>\n<p data-p=\"40\">沈默站在那里，没有再说什么。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"41\">午后，沈默坐在西门外粥厂的桌子后头，把五户的保结一户一户登进赈册。登一户，差役发一根竹签，凭签领半赈。<\/p>\n<p data-p=\"42\">老宋拿到签的时候，冲他点了点头。<\/p>\n<p data-p=\"43\"><b class=\"rn\" data-c=\"ayun\">阿芸<\/b>站在她爹身边。<\/p>\n<p data-p=\"44\">队伍快完的时候，一个十来岁的男孩挤到桌前，手里攥着一张折了好几折的纸，纸角已经被汗浸软了，另一只手拿着一只豁了口的碗。<\/p>\n<p data-p=\"45\">“书办老爷，我阿公叫我送来的。”<\/p>\n<p data-p=\"46\">沈默打开。是庙门口那个<b class=\"rn\" data-c=\"laotongsheng\">老童生<\/b>的字，三文钱一张的那种：<\/p>\n<p class=\"chao\" data-p=\"47\">具呈人西乡三都佃户邱某，为田庐尽没、祖孙无食，老汉病卧在床，孙儿年幼，恳请勘验、赐予赈济事……伏乞垂怜。<\/p>\n<p data-p=\"48\">读到“伏乞垂怜”，他停住了。<\/p>\n<p data-p=\"49\">没有保结，没有画押。<\/p>\n<p data-p=\"50\">赈册上五户新登的名字，墨还没干。这一批要是夹进一个没保结的名字，粥厂一对，就是冒领；一户冒领，这一批的保结，就全要重查。<\/p>\n<p data-p=\"51\">他把那张呈子折好，压在了赈册底下。<\/p>\n<p data-p=\"52\">“回去跟你阿公说，”他说，“等核过籍贯，再登。”<\/p>\n<p data-p=\"53\">男孩站了一会儿，看着那本赈册。他不认字，看不出底下压着什么。<\/p>\n<p data-p=\"54\">他走了。<\/p>\n<p data-p=\"55\">手里那只碗，还是空的。<\/p>\n<p data-p=\"56\">沈默收拾桌子的时候，阿芸还没走。她手里攥着她家那根竹签，另一只手提着刚领的那一小袋米。<\/p>\n<p data-p=\"57\">“沈书办。”<\/p>\n<p data-p=\"58\">他抬起头。<\/p>\n<p data-p=\"59\">“我家的保结，是你去求来的。”<\/p>\n<p data-p=\"60\">她低头看了看手里的竹签，用拇指把签头上的毛刺抹平了。<\/p>\n<p data-p=\"61\">“邱家阿公那张，你压在底下了。”<\/p>\n<p data-p=\"62\">他的手按在赈册上。<\/p>\n<p data-p=\"63\">阿芸也没等他说话。她转身往坡下走。<\/p>\n<p data-p=\"64\"><b class=\"rn\" data-c=\"qiusunzi\">邱家那孩子<\/b>蹲在半坡的路边，把空碗搁在膝盖上。<\/p>\n<p data-p=\"65\">阿芸走到他跟前，站住了。她解开袋口，抓了一把米，倒进他的碗里，又抓了一把。<\/p>\n<p data-p=\"66\">老宋在前头回过头，看了一眼，没说什么。<\/p>\n<p data-p=\"67\">阿芸把袋口扎紧，追上她爹，走了。她没有回头。<\/p>\n<p data-p=\"68\">隔着十几步，沈默看着那只碗。两把米倒进去，碗底才刚盖住。<\/p>\n<p data-p=\"69\">他的手还按在赈册上。底下压着那张呈子。<\/p>\n<p data-p=\"70\">他没有抽出来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"71\">第三日一早，<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>那边送来一张报单：三都土地庙，有一老汉夜里殁了，外县人，交户房除名，入殓埋册。<\/p>\n<p data-p=\"72\">殓埋册是另一本，薄薄的，户房很少翻。死了的人，从户口册上勾掉，名字挪到这一本里，县里出一口薄棺。<\/p>\n<p data-p=\"73\">邱老汉不在三都的户口册上，没有可勾的。<\/p>\n<p data-p=\"74\">沈默翻开殓埋册，蘸了墨。<\/p>\n<p data-p=\"75\">邱某，年六十有三，籍外县，六月二十九日殁于三都土地庙。<\/p>\n<p data-p=\"76\">他写完，看着这一行。<\/p>\n<p data-p=\"77\">这是邱老汉的名字，头一回上了这个县的册子。<\/p>\n<p data-p=\"78\">他把手伸进赈册底下，抽出那张呈子。纸已经压平了。最后一行，是老童生拖着腔调写下的四个字：<\/p>\n<p class=\"chao\" data-p=\"79\">伏乞垂怜。<\/p>\n<p data-p=\"80\">他把呈子折好，夹进了褡裢，跟那几张竹纸放在一起。<\/p>", "paras": ["张家的粥，施到第十二日。", "那天一早，土地庙后头那口大锅没有生火。锅边摆了一张方桌，桌上一杆秤、一本簿子、一盒印泥。", "张员外是坐轿子来的。四十多岁，脸很白，穿一件半旧的绸衫。下了轿，他先朝庙里的土地爷拱了拱手，才转过身来。", "“诸位乡亲。”他说话很慢，“张家的粥，施了十二日，尽了心了。锅能一直烧，米烧不起。”", "人群里没人出声。", "“往后，张家不施粥，借米。”他指了指桌上那杆秤，“借一斗，秋后还一斗二。没现钱的，拿田契作保，秋后还上，契原样奉还。”", "账房把簿子翻开。那本簿子沈默见过，十几天来，谁家吃了几碗，记得清清楚楚。", "“先过眼前这一关。”张员外说，“田，还是诸位的田。”", "人群里有人小声说话。", "“……堤是上面叫决的……”", "“……淹了田，好叫咱们押出去，改种桑……”", "“胡说什么！”一个差役回头喝了一声。", "那几个人不说话了。", "老宋站在人堆里，摇了摇头：“种桑能吃？”", "张员外像是没听见。他转过身，朝沈默拱了拱手。", "“沈书办。”", "沈默是来办补登的。", "前一日，吴县丞出了一道告示，贴在西门外：续勘未到之前，凡未入赈册之户，取里长保结、邻佑画押，先给半赈。", "半赈，就是册上人家一半的米。", "保结，就是里长拿自己作保：这户人家确实淹了，确实没入册。日后查出冒领，里长连坐。", "所以没有里长肯出。", "“沈书办，”东村的里长把告示看了三遍，“保结一出，日后哪一户查出点不对，小人跟着吃板子。”", "“东村那五户，你在船上也看见了。”", "“看是看见了……”", "沈默没再说话。他从袖子里抽出一本薄册，是东村今年的夏税底册，翻到里长自家那一行，用指头点了点。", "那一行的尾数，去年秋天，是他替里长抹掉的。", "里长盯着那一行，喉结动了两下，叹了口气，接过笔。", "东村五户，一户一户，出了保结。", "还剩一户。", "邱老汉，六十多岁，带着一个十来岁的孙子。是外县来的，在三都租张家的田种了七八年，户籍还在原籍，不在三都的册上。", "里长摇头：“他不是我们东村的户，小人保不着。”", "邻佑也摇头：“他家从哪儿来的，谁也说不清。”", "沈默去找张员外。", "张员外正站在桌边，看账房一张一张地收田契，听他说完，点了点头。", "“邱老汉，是我家的佃户。”", "“那张员外——”", "“沈书办是三都人，该知道佃户的规矩。”张员外说得很和气，“我家在三都一带的佃户，三十多户，一家一家都来找我，我管不过来。他今年的租还没算，借米，他拿什么作保？”", "他想了想，又说：", "“沈书办若能在官册上给他补个名，官米，总比我家的米便宜。”", "账房在旁边又收了一张田契，按了个手印，压在秤砣底下。", "沈默站在那里，没有再说什么。", "午后，沈默坐在西门外粥厂的桌子后头，把五户的保结一户一户登进赈册。登一户，差役发一根竹签，凭签领半赈。", "老宋拿到签的时候，冲他点了点头。", "阿芸站在她爹身边。", "队伍快完的时候，一个十来岁的男孩挤到桌前，手里攥着一张折了好几折的纸，纸角已经被汗浸软了，另一只手拿着一只豁了口的碗。", "“书办老爷，我阿公叫我送来的。”", "沈默打开。是庙门口那个老童生的字，三文钱一张的那种：", "具呈人西乡三都佃户邱某，为田庐尽没、祖孙无食，老汉病卧在床，孙儿年幼，恳请勘验、赐予赈济事……伏乞垂怜。", "读到“伏乞垂怜”，他停住了。", "没有保结，没有画押。", "赈册上五户新登的名字，墨还没干。这一批要是夹进一个没保结的名字，粥厂一对，就是冒领；一户冒领，这一批的保结，就全要重查。", "他把那张呈子折好，压在了赈册底下。", "“回去跟你阿公说，”他说，“等核过籍贯，再登。”", "男孩站了一会儿，看着那本赈册。他不认字，看不出底下压着什么。", "他走了。", "手里那只碗，还是空的。", "沈默收拾桌子的时候，阿芸还没走。她手里攥着她家那根竹签，另一只手提着刚领的那一小袋米。", "“沈书办。”", "他抬起头。", "“我家的保结，是你去求来的。”", "她低头看了看手里的竹签，用拇指把签头上的毛刺抹平了。", "“邱家阿公那张，你压在底下了。”", "他的手按在赈册上。", "阿芸也没等他说话。她转身往坡下走。", "邱家那孩子蹲在半坡的路边，把空碗搁在膝盖上。", "阿芸走到他跟前，站住了。她解开袋口，抓了一把米，倒进他的碗里，又抓了一把。", "老宋在前头回过头，看了一眼，没说什么。", "阿芸把袋口扎紧，追上她爹，走了。她没有回头。", "隔着十几步，沈默看着那只碗。两把米倒进去，碗底才刚盖住。", "他的手还按在赈册上。底下压着那张呈子。", "他没有抽出来。", "第三日一早，郑典史那边送来一张报单：三都土地庙，有一老汉夜里殁了，外县人，交户房除名，入殓埋册。", "殓埋册是另一本，薄薄的，户房很少翻。死了的人，从户口册上勾掉，名字挪到这一本里，县里出一口薄棺。", "邱老汉不在三都的户口册上，没有可勾的。", "沈默翻开殓埋册，蘸了墨。", "邱某，年六十有三，籍外县，六月二十九日殁于三都土地庙。", "他写完，看着这一行。", "这是邱老汉的名字，头一回上了这个县的册子。", "他把手伸进赈册底下，抽出那张呈子。纸已经压平了。最后一行，是老童生拖着腔调写下的四个字：", "伏乞垂怜。", "他把呈子折好，夹进了褡裢，跟那几张竹纸放在一起。"], "recap": "余司吏让他去三都核田，夏粮照征。张家在土地庙施粥，账房的簿子比官府的赈册全。庙门口，老童生替人写呈子，三文钱一张，拖着读书人的腔调念。沈默想起十六岁那年替父亲写的“伏乞垂怜”，等了一个冬天，家里卖了牛，又卖了井边那块田。老宋说：你中秀才那年，站在井沿上说，往后西乡有你。"}, {"n": 9, "cn": "九", "title": "旧同年", "era": "", "chars": 1314, "mins": 4, "html": "<p data-p=\"0\">七月初，雨停了。<\/p>\n<p data-p=\"1\">太阳一出来，衙门里到处是霉味。库房的门大开着，<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>让人把泡过水的册子一摞一摞抬到院子里晒，纸页晒干了，卷成一个一个的筒。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><
