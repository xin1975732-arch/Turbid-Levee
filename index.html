i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"2\">七月初三，一个十二三岁的半大孩子到户房来，站在门口，不敢进。<\/p>\n<p data-p=\"3\">“小人姓孙，是<b class=\"rn\" data-c=\"sunjiahaizi\">孙书办的儿子<\/b>。”他说，“我爹叫我来，把他的铺盖和书箱取回去。”<\/p>\n<p data-p=\"4\">户房靠里那张案子，原是<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>的。铺盖早卷了，塞在案底下；书箱搁在墙角，落了一层灰。<\/p>\n<p data-p=\"5\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>帮他把东西搬到门口。<\/p>\n<p data-p=\"6\">“你爹……”<\/p>\n<p data-p=\"7\">“在二都我舅家。”孩子说，“屋淹了，寄住着。咳得厉害，夜里咳血。”<\/p>\n<p data-p=\"8\">他背起书箱，走到门口，回头看了看案上的笔筒。<\/p>\n<p data-p=\"9\">“我爹说，那支笔，不要了。”<\/p>\n<p data-p=\"10\">笔筒里，那支没洗的笔还插在那里，笔头的墨干成了硬壳。<\/p>\n<p data-p=\"11\">孩子走了。<\/p>\n<p data-p=\"12\">告病半年不回，按例要除役。除役，户房要在吏役册上勾一笔。<\/p>\n<p data-p=\"13\">吏役册在库房最里头，是衙门里所有吏员的底：谁哪年进的衙门，谁升了，谁犯过什么事，都记在上面。<\/p>\n<p data-p=\"14\">沈默翻到孙书办那一页。<\/p>\n<p data-p=\"15\">嘉靖二十二年三月，生员孙某，充户房书手。<\/p>\n<p data-p=\"16\">上面紧挨着一行：嘉靖二十二年三月，生员余某，充户房书手。<\/p>\n<p data-p=\"17\">同一天进的衙门。都是进过学的。<\/p>\n<p data-p=\"18\">他往下翻。<\/p>\n<p data-p=\"19\">余某那一页：嘉靖二十七年，升司吏。<\/p>\n<p data-p=\"20\">孙某那一页，二十六年那一栏，有一行小字：<\/p>\n<p class=\"chao\" data-p=\"21\">七月，擅改西乡灾户税册，杖二十，永不升补。<\/p>\n<p data-p=\"22\">嘉靖二十六年。<\/p>\n<p data-p=\"23\">那一年西乡也涝过。那一年，他十六岁。<\/p>\n<p data-p=\"24\">他偶然翻到自己那一页。<\/p>\n<p data-p=\"25\">嘉靖三十五年三月，生员沈默，字子鸣，充户房书手。<\/p>\n<p data-p=\"26\">他看了一眼自己的字，翻过去了。<\/p>\n<p data-p=\"27\">税册是不销的。他在库房最里头一排架子上，找到了嘉靖二十六年西乡那一本，纸黄得发脆，一翻就掉渣。<\/p>\n<p data-p=\"28\">翻到二都，有一户的税数被人划掉了：折银三两二钱。旁边另写了一个小些的数：一两六钱。<\/p>\n<p data-p=\"29\">字是台阁体，一笔一画，端端正正。<\/p>\n<p data-p=\"30\">他把那一页凑到窗下，对着光又看了一遍。然后他把册子揣在怀里，回到户房，开了抽屉，取出核销册，翻到末页。<\/p>\n<p data-p=\"31\">那条贴补的纸上：一千三百八十两。<\/p>\n<p data-p=\"32\">他把两样东西并排摆在案上。<\/p>\n<p data-p=\"33\">一个数改小了，一个数改大了，隔了十四年。<\/p>\n<p data-p=\"34\">两个“两”字，最后那一横，收笔时都往上挑了一下，挑得比寻常高半分。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"35\">那天夜里，余司吏来户房取一本册子。<\/p>\n<p data-p=\"36\">沈默没有起身，只把灯往前推了推，把两样东西推到他面前。<\/p>\n<p data-p=\"37\">余司吏低头看了一眼，没有坐。<\/p>\n<p data-p=\"38\">“孙书办的儿子今日来了，”沈默说，“取铺盖。”<\/p>\n<p data-p=\"39\">“嗯。”<\/p>\n<p data-p=\"40\">“要除役，我翻了吏役册。”<\/p>\n<p data-p=\"41\">余司吏两手笼在袖子里。<\/p>\n<p data-p=\"42\">“你们是同一天进的衙门。”<\/p>\n<p data-p=\"43\">“同一天。”<\/p>\n<p data-p=\"44\">“都是进过学的。”<\/p>\n<p data-p=\"45\">“都是。”<\/p>\n<p data-p=\"46\">沈默把那本旧税册往前推了推。<\/p>\n<p data-p=\"47\">“二十六年七月，这一笔，册上说是孙书办改的。”<\/p>\n<p data-p=\"48\">余司吏看着那一页。<\/p>\n<p data-p=\"49\">“他认了。”<\/p>\n<p data-p=\"50\">“他为什么认？”<\/p>\n<p data-p=\"51\">余司吏咳了一阵。咳完了，他说：<\/p>\n<p data-p=\"52\">“那年他还没成家。他说，他家里没人等他吃饭。”<\/p>\n<p data-p=\"53\">沈默没有接话。他把核销册往前推了推，指着末页那条贴补。<\/p>\n<p data-p=\"54\">“这一笔呢？”<\/p>\n<p data-p=\"55\">余司吏看了一眼，把眼睛挪开了。<\/p>\n<p data-p=\"56\">“台阁体，”他说，“进过学的人，谁没临过。你也临过。”<\/p>\n<p data-p=\"57\">沈默没有再追。<\/p>\n<p data-p=\"58\">他又问：“赈册上那两个字，也是你？”<\/p>\n<p data-p=\"59\">“划在户房里，是错。”余司吏说，“出了户房的门，就是罪。”<\/p>\n<p data-p=\"60\">他拿起要取的那本册子，转身要走。<\/p>\n<p data-p=\"61\">“余先生。”<\/p>\n<p data-p=\"62\">余司吏停住了。<\/p>\n<p data-p=\"63\">“孙书办腊月来问过你。他问的什么？”<\/p>\n<p data-p=\"64\">余司吏站在门口，背对着灯。手扶着门框，咳了两声，才开口。<\/p>\n<p data-p=\"65\">“他从堤上回来，问我，若账册和堤都不对，该先信哪一个。”<\/p>\n<p data-p=\"66\">“你怎么答的？”<\/p>\n<p data-p=\"67\">余司吏没有回头。<\/p>\n<p data-p=\"68\">“我没答。”<\/p>", "paras": ["七月初，雨停了。", "太阳一出来，衙门里到处是霉味。库房的门大开着，余司吏让人把泡过水的册子一摞一摞抬到院子里晒，纸页晒干了，卷成一个一个的筒。", "七月初三，一个十二三岁的半大孩子到户房来，站在门口，不敢进。", "“小人姓孙，是孙书办的儿子。”他说，“我爹叫我来，把他的铺盖和书箱取回去。”", "户房靠里那张案子，原是孙书办的。铺盖早卷了，塞在案底下；书箱搁在墙角，落了一层灰。", "沈默帮他把东西搬到门口。", "“你爹……”", "“在二都我舅家。”孩子说，“屋淹了，寄住着。咳得厉害，夜里咳血。”", "他背起书箱，走到门口，回头看了看案上的笔筒。", "“我爹说，那支笔，不要了。”", "笔筒里，那支没洗的笔还插在那里，笔头的墨干成了硬壳。", "孩子走了。", "告病半年不回，按例要除役。除役，户房要在吏役册上勾一笔。", "吏役册在库房最里头，是衙门里所有吏员的底：谁哪年进的衙门，谁升了，谁犯过什么事，都记在上面。", "沈默翻到孙书办那一页。", "嘉靖二十二年三月，生员孙某，充户房书手。", "上面紧挨着一行：嘉靖二十二年三月，生员余某，充户房书手。", "同一天进的衙门。都是进过学的。", "他往下翻。", "余某那一页：嘉靖二十七年，升司吏。", "孙某那一页，二十六年那一栏，有一行小字：", "七月，擅改西乡灾户税册，杖二十，永不升补。", "嘉靖二十六年。", "那一年西乡也涝过。那一年，他十六岁。", "他偶然翻到自己那一页。", "嘉靖三十五年三月，生员沈默，字子鸣，充户房书手。", "他看了一眼自己的字，翻过去了。", "税册是不销的。他在库房最里头一排架子上，找到了嘉靖二十六年西乡那一本，纸黄得发脆，一翻就掉渣。", "翻到二都，有一户的税数被人划掉了：折银三两二钱。旁边另写了一个小些的数：一两六钱。", "字是台阁体，一笔一画，端端正正。", "他把那一页凑到窗下，对着光又看了一遍。然后他把册子揣在怀里，回到户房，开了抽屉，取出核销册，翻到末页。", "那条贴补的纸上：一千三百八十两。", "他把两样东西并排摆在案上。", "一个数改小了，一个数改大了，隔了十四年。", "两个“两”字，最后那一横，收笔时都往上挑了一下，挑得比寻常高半分。", "那天夜里，余司吏来户房取一本册子。", "沈默没有起身，只把灯往前推了推，把两样东西推到他面前。", "余司吏低头看了一眼，没有坐。", "“孙书办的儿子今日来了，”沈默说，“取铺盖。”", "“嗯。”", "“要除役，我翻了吏役册。”", "余司吏两手笼在袖子里。", "“你们是同一天进的衙门。”", "“同一天。”", "“都是进过学的。”", "“都是。”", "沈默把那本旧税册往前推了推。", "“二十六年七月，这一笔，册上说是孙书办改的。”", "余司吏看着那一页。", "“他认了。”", "“他为什么认？”", "余司吏咳了一阵。咳完了，他说：", "“那年他还没成家。他说，他家里没人等他吃饭。”", "沈默没有接话。他把核销册往前推了推，指着末页那条贴补。", "“这一笔呢？”", "余司吏看了一眼，把眼睛挪开了。", "“台阁体，”他说，“进过学的人，谁没临过。你也临过。”", "沈默没有再追。", "他又问：“赈册上那两个字，也是你？”", "“划在户房里，是错。”余司吏说，“出了户房的门，就是罪。”", "他拿起要取的那本册子，转身要走。", "“余先生。”", "余司吏停住了。", "“孙书办腊月来问过你。他问的什么？”", "余司吏站在门口，背对着灯。手扶着门框，咳了两声，才开口。", "“他从堤上回来，问我，若账册和堤都不对，该先信哪一个。”", "“你怎么答的？”", "余司吏没有回头。", "“我没答。”"], "recap": "张家的粥停了，改成借米，借一斗还一斗二，田契作保。沈默拿里长自家的税底，替东村五户换来保结，领了半赈。外县来的佃户邱老汉没有保结，孙子送来一张呈子，他压在了赈册底下。阿芸说：你压在底下了。她给那孩子抓了两把米。第三日，邱老汉死在土地庙，名字头一回上了这个县的册子，是殓埋册。"}, {"n": 10, "cn": "十", "title": "撤夫令", "era": "", "chars": 1730, "mins": 5, "html": "<p data-p=\"0\">七月初五，承发房送来一张工食单。<\/p>\n<p data-p=\"1\">承发房是<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>管的，衙门里的差役派往哪里、文书往来，都打这里过。单子上写着：<\/p>\n<p class=\"chao\" data-p=\"2\">六月十三日二更，奉县丞口谕，调西堤夜班夫役四十二名，往东埠头官仓抢运仓粮一夜，每名给工食米一升。<\/p>\n<p data-p=\"3\">底下是郑典史的押。<\/p>\n<p data-p=\"4\">户房照单发米，经手的是<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>。<\/p>\n<p data-p=\"5\">他把单子看了两遍，看到“奉县丞口谕”那五个字，停住了。<\/p>\n<p data-p=\"6\">六月十二日天还没黑，县丞老爷就骑马去了府里，十四日巳时才回来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">西门的门军还是那个。见沈默来，他把门洞里那本油乎乎的簿子递过来。<\/p>\n<p data-p=\"8\">“夜里出城的，都得记。”门军说，“记谁、几更、去干什么。”<\/p>\n<p data-p=\"9\">“户房要核工食，看看那两夜出城的人。”<\/p>\n<p data-p=\"10\">沈默翻到六月十二日。一更那一栏，一行字：<\/p>\n<p class=\"chao\" data-p=\"11\">承发房差役<b class=\"rn\" data-c=\"fengsi\">冯四<\/b>，奉县丞口谕，往西堤调夫。<\/p>\n<p data-p=\"12\">再往后翻一页，六月十三日，一更：<\/p>\n<p class=\"chao\" data-p=\"13\">承发房差役冯四，奉县丞口谕，往西堤调夫。<\/p>\n<p data-p=\"14\">两夜，一个人，一样的话。<\/p>\n<p data-p=\"15\">“冯四那小子，两夜都是他。”门军说，“头一夜他出去，你是后头那一拨。第二夜，二更多天，他带着一串火把往东埠头去了，我在城楼上看见的。”<\/p>\n<p data-p=\"16\">沈默把那两行抄在一张纸上，把簿子还给他。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\"><b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>还押在衙门后头的班房里，等着结案。人瘦了一圈，见沈默进来，从草堆上爬起来。<\/p>\n<p data-p=\"18\">“沈书办。”<\/p>\n<p data-p=\"19\">“开春到如今，你放走过人没有？”<\/p>\n<p data-p=\"20\">王老实愣了一下，低下头。<\/p>\n<p data-p=\"21\">“放过。”他说，“开春割麦，有几个人家里等着收麦，来求小人，小人收了几个钱，让他们回去了几日。账上照点名的数报的。这是小人的错，小人认。”<\/p>\n<p data-p=\"22\">“十三日夜里，末队那几个人呢？”<\/p>\n<p data-p=\"23\">“那不是小人。”王老实抬起头，“二更，冯四来了，说埠头的仓进了水，县里叫扛粮。小人说，郑老爷交代过，堤上要动人，先进城问他。冯四说，他就是从郑老爷那里来的，郑老爷点过头。”<\/p>\n<p data-p=\"24\">“你就带人走了？”<\/p>\n<p data-p=\"25\">“差爷拿着县里的话，郑老爷又点过头，”王老实说，“小人一个领工的，还能怎么着？”<\/p>\n<p data-p=\"26\">他在草堆上挪了挪，又说：<\/p>\n<p data-p=\"27\">“开春那几个人，是小人放的。那一夜，不是。”<\/p>\n<p data-p=\"28\">沈默在那张纸上，记下了“开春”两个字，又在下头记了“十三日二更，冯四”。<\/p>\n<p data-p=\"29\">一个是王老实的错。一个不是他能定的。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">郑典史在承发房，案上摞着一叠报单，他一张一张地批。<\/p>\n<p data-p=\"31\">沈默把工食单放在他面前。<\/p>\n<p data-p=\"32\">“十三日夜里调夫，是郑老爷点的头？”<\/p>\n<p data-p=\"33\">“是我。”郑典史头也没抬。<\/p>\n<p data-p=\"34\">“县丞老爷那时在府里。”<\/p>\n<p data-p=\"35\">“冯四说，县丞老爷走之前留了话：堤上若急，先保仓。”郑典史放下笔，“官仓里是全县一冬的口粮。中段九个人，那样的水，九个人挡得住？去扛粮，能保住一仓。”<\/p>\n<p data-p=\"36\">“县丞老爷留这句话，郑老爷亲耳听见了？”<\/p>\n<p data-p=\"37\">“没有。是冯四传的。”<\/p>\n<p data-p=\"38\">郑典史抬起头来看他。<\/p>\n<p data-p=\"39\">“沈书办，你问这个，是替谁问？”<\/p>\n<p data-p=\"40\">沈默没答。<\/p>\n<p data-p=\"41\">郑典史看了他一会儿，把工食单推回来。<\/p>\n<p data-p=\"42\">“那夜我在城里。”他说，“后半夜，我在城楼上，看着水贴着城墙往上涨，一块砖一块砖地涨。涨到第三块，停了。”<\/p>\n<p data-p=\"43\">他顿了顿。<\/p>\n<p data-p=\"44\">“那夜西堤要是不决，水就进城了。”<\/p>\n<p data-p=\"45\">他重新拿起笔。<\/p>\n<p data-p=\"46\">“冯四告了假，前日回乡去了。你要问他，等他回来。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"47\">傍晚，沈默把工食单送到二堂。照例，户房发米，要县丞落款。<\/p>\n<p data-p=\"48\"><b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>看得很慢。看到“奉县丞口谕”，他的眼睛停在那五个字上。<\/p>\n<p data-p=\"49\">“我没有交代过。”<\/p>\n<p data-p=\"50\">他说得很平，没有一点犹豫。<\/p>\n<p data-p=\"51\">沈默站在案边，等他往下说。<\/p>\n<p data-p=\"52\">吴县丞没有往下说。他看着那张单子，翻过来看了看背面，又翻回来，问的却是别的：<\/p>\n<p data-p=\"53\">“这单子是你誊的？”<\/p>\n<p data-p=\"54\">“是。”<\/p>\n<p data-p=\"55\">“你这手字，是进过学的。”<\/p>\n<p data-p=\"56\">“进过。”<\/p>\n<p data-p=\"57\">“考到哪一步？”<\/p>\n<p data-p=\"58\">“生员。”<\/p>\n<p data-p=\"59\">吴县丞“嗯”了一声，把单子放下。<\/p>\n<p data-p=\"60\">“我做知县那年，也遇过一回这样的灾。”他说，“我报了实数。”<\/p>\n<p data-p=\"61\">“后来降调到这里做县丞。”<\/p>\n<p data-p=\"62\">窗外，有人在院子里收晒了一天的册子，一摞一摞往库房里搬。<\/p>\n<p data-p=\"63\">吴县丞提起笔，在单子底下落了款。“奉县丞口谕”那五个字，他没有动。<\/p>\n<p data-p=\"64\">“照这个发。”他说，“回去吧。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"65\">那天夜里，沈默取过一张竹纸，写：<\/p>\n<p class=\"chao\" data-p=\"66\">七月初五。西门门簿：六月十二日、十三日一更，承发房差役冯四，奉县丞口谕，往西堤调夫。<\/p>\n<p data-p=\"67\">他只抄了门簿上那一行。<\/p>\n<p data-p=\"68\">县丞老爷那句“我没有交代过”，他没写。<\/p>\n<p data-p=\"69\">吹干，折两折，夹进褡裢。那张“伏乞垂怜”的呈子，还在里头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"70\">第三日一早，他到承发房去找郑典史，要问冯四回来没有。<\/p>\n<p data-p=\"71\">郑典史不在。案上压着一张报单，墨迹还新：<\/p>\n<p class=\"chao\" data-p=\"72\">承发房差役冯四，告假回乡，行至二都溪口，溪水暴涨，失足溺毙。尸身今晨捞起。<\/p>\n<p data-p=\"73\">报单旁边，摊着一张纸，是从冯四怀里掏出来的，泡得发软，边上烂了，字洇开了大半。<\/p>\n<p data-p=\"74\">剩下几个，还认得出来：<\/p>\n<p class=\"chao\" data-p=\"75\">……西堤……<\/p>", "paras": ["七月初五，承发房送来一张工食单。", "承发房是郑典史管的，衙门里的差役派往哪里、文书往来，都打这里过。单子上写着：", "六月十三日二更，奉县丞口谕，调西堤夜班夫役四十二名，往东埠头官仓抢运仓粮一夜，每名给工食米一升。", "底下是郑典史的押。", "户房照单发米，经手的是沈默。", "他把单子看了两遍，看到“奉县丞口谕”那五个字，停住了。", "六月十二日天还没黑，县丞老爷就骑马去了府里，十四日巳时才回来。", "西门的门军还是那个。见沈默来，他把门洞里那本油乎乎的簿子递过来。", "“夜里出城的，都得记。”门军说，“记谁、几更、去干什么。”", "“户房要核工食，看看那两夜出城的人。”", "沈默翻到六月十二日。一更那一栏，一行字：", "承发房差役冯四，奉县丞口谕，往西堤调夫。", "再往后翻一页，六月十三日，一更：", "承发房差役冯四，奉县丞口谕，往西堤调夫。", "两夜，一个人，一样的话。", "“冯四那小子，两夜都是他。”门军说，“头一夜他出去，你是后头那一拨。第二夜，二更多天，他带着一串火把往东埠头去了，我在城楼上看见的。”", "沈默把那两行抄在一张纸上，把簿子还给他。", "王老实还押在衙门后头的班房里，等着结案。人瘦了一圈，见沈默进来，从草堆上爬起来。", "“沈书办。”", "“开春到如今，你放走过人没有？”", "王老实愣了一下，低下头。", "“放过。”他说，“开春割麦，有几个人家里等着收麦，来求小人，小人收了几个钱，让他们回去了几日。账上照点名的数报的。这是小人的错，小人认。”", "“十三日夜里，末队那几个人呢？”", "“那不是小人。”王老实抬起头，“二更，冯四来了，说埠头的仓进了水，县里叫扛粮。小人说，郑老爷交代过，堤上要动人，先进城问他。冯四说，他就是从郑老爷那里来的，郑老爷点过头。”", "“你就带人走了？”", "“差爷拿着县里的话，郑老爷又点过头，”王老实说，“小人一个领工的，还能怎么着？”", "他在草堆上挪了挪，又说：", "“开春那几个人，是小人放的。那一夜，不是。”", "沈默在那张纸上，记下了“开春”两个字，又在下头记了“十三日二更，冯四”。", "一个是王老实的错。一个不是他能定的。", "郑典史在承发房，案上摞着一叠报单，他一张一张地批。", "沈默把工食单放在他面前。", "“十三日夜里调夫，是郑老爷点的头？”", "“是我。”郑典史头也没抬。", "“县丞老爷那时在府里。”", "“冯四说，县丞老爷走之前留了话：堤上若急，先保仓。”郑典史放下笔，“官仓里是全县一冬的口粮。中段九个人，那样的水，九个人挡得住？去扛粮，能保住一仓。”", "“县丞老爷留这句话，郑老爷亲耳听见了？”", "“没有。是冯四传的。”", "郑典史抬起头来看他。", "“沈书办，你问这个，是替谁问？”", "沈默没答。", "郑典史看了他一会儿，把工食单推回来。", "“那夜我在城里。”他说，“后半夜，我在城楼上，看着水贴着城墙往上涨，一块砖一块砖地涨。涨到第三块，停了。”", "他顿了顿。", "“那夜西堤要是不决，水就进城了。”", "他重新拿起笔。", "“冯四告了假，前日回乡去了。你要问他，等他回来。”", "傍晚，沈默把工食单送到二堂。照例，户房发米，要县丞落款。", "吴县丞看得很慢。看到“奉县丞口谕”，他的眼睛停在那五个字上。", "“我没有交代过。”", "他说得很平，没有一点犹豫。", "沈默站在案边，等他往下说。", "吴县丞没有往下说。他看着那张单子，翻过来看了看背面，又翻回来，问的却是别的：", "“这单子是你誊的？”", "“是。”", "“你这手字，是进过学的。”", "“进过。”", "“考到哪一步？”", "“生员。”", "吴县丞“嗯”了一声，把单子放下。", "“我做知县那年，也遇过一回这样的灾。”他说，“我报了实数。”", "“后来降调到这里做县丞。”", "窗外，有人在院子里收晒了一天的册子，一摞一摞往库房里搬。", "吴县丞提起笔，在单子底下落了款。“奉县丞口谕”那五个字，他没有动。", "“照这个发。”他说，“回去吧。”", "那天夜里，沈默取过一张竹纸，写：", "七月初五。西门门簿：六月十二日、十三日一更，承发房差役冯四，奉县丞口谕，往西堤调夫。", "他只抄了门簿上那一行。", "县丞老爷那句“我没有交代过”，他没写。", "吹干，折两折，夹进褡裢。那张“伏乞垂怜”的呈子，还在里头。", "第三日一早，他到承发房去找郑典史，要问冯四回来没有。", "郑典史不在。案上压着一张报单，墨迹还新：", "承发房差役冯四，告假回乡，行至二都溪口，溪水暴涨，失足溺毙。尸身今晨捞起。", "报单旁边，摊着一张纸，是从冯四怀里掏出来的，泡得发软，边上烂了，字洇开了大半。", "剩下几个，还认得出来：", "……西堤……"], "recap": "孙书办的儿子来取铺盖，说父亲在二都咳血。吏役册上，余某、孙某同一天进的衙门；嘉靖二十六年，孙书办认下擅改税册，杖二十，永不升补。那一页上改数的台阁体，和核销册上贴补的字，收笔一样。余司吏说，那年孙书办说，他家里没人等他吃饭。孙书办腊月问过他：账册和堤，先信哪一个。他没答。"}, {"n": 11, "cn": "十一", "title": "纸上人", "era": "", "chars": 1366, "mins": 4, "html": "<p data-p=\"0\"><b class=\"rn\" data-c=\"fengsi\">冯四<\/b>的东西，是<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>那边的差役送到户房来的。<\/p>\n<p data-p=\"1\">一个布包：一块腰牌，一双泡烂了底的布鞋，一串铜钱，四十七文。还有那张纸，单独夹在一块油布里。<\/p>\n<p data-p=\"2\">差役说：“郑老爷交代，冯四的工食算到六月底，交他婆娘来领。这张纸泡烂了，没用，一并交来，户房看着办。”<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>接过油布，没有打开。<\/p>\n<p data-p=\"4\">“郑老爷看过这张纸？”<\/p>\n<p data-p=\"5\">“看过一眼。”差役说，“郑老爷说，今年淹死的，不止他一个。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"6\">冯四的婆娘是第二日来的，三十来岁，眼睛肿着，手里拉着一个四五岁的孩子。<\/p>\n<p data-p=\"7\">沈默把工食算给她，一共一钱八分银子，又把那串铜钱和腰牌交到她手里。<\/p>\n<p data-p=\"8\">她把东西一样一样收进怀里，收到腰牌，攥了一会儿。<\/p>\n<p data-p=\"9\">“书办老爷，”她说，“他身上，是不是还有一张纸？”<\/p>\n<p data-p=\"10\">“有。”<\/p>\n<p data-p=\"11\">“他不识字。”她说，“那张纸，他揣了好些日子，睡觉都压在枕头底下。我问他是什么，他说是要紧的，叫我别动。”<\/p>\n<p data-p=\"12\">“他说过是谁给他的？”<\/p>\n<p data-p=\"13\">“没说。”她摇摇头，“他就说，上头的话，空口说的不作数，得有张纸。”<\/p>\n<p data-p=\"14\">她拉着孩子走了。走到门口，孩子回头看了一眼案上那块油布。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">那天夜里，沈默把油布打开。<\/p>\n<p data-p=\"16\">纸是衙门里常用的竹纸，跟户房案上那一叠一样，跟他夹在褡裢里的那几张也一样。泡过水，又在冯四怀里捂干了，皱成一团，边上烂了一圈。<\/p>\n<p data-p=\"17\">他没敢硬展，把纸铺在一块湿布上，等它慢慢软下来，再用指头一点一点推平。<\/p>\n<p data-p=\"18\">字洇开了大半，墨晕成一片一片灰影。<\/p>\n<p data-p=\"19\">他把纸举起来，凑到灯前，让灯光从纸背透过来。洇开的地方，墨重的笔画还留着一道深痕。<\/p>\n<p data-p=\"20\">他一个字一个字地认。<\/p>\n<p data-p=\"21\">第一行，只剩中间两个字，墨最重，看得清：西堤。<\/p>\n<p data-p=\"22\">第二行，开头一个字只剩半边，像是“二”，又像是“三”。后头一个“更”字，倒还完整。<\/p>\n<p data-p=\"23\">第三行全糊了。<\/p>\n<p data-p=\"24\">最后一行，靠左边，四个字挤在一起，墨又重又匀，像是写的人落笔前特意蘸足了：<\/p>\n<p class=\"chao\" data-p=\"25\">……不必入册。<\/p>\n<p data-p=\"26\">“不必”前头，还有一点残墨，是半个字，只剩中间一个“口”，和底下拖出来的一竖，像是一个“事”字。<\/p>\n<p data-p=\"27\">他把纸放下，又举起来，又放下。<\/p>\n<p data-p=\"28\">字是寻常的楷书，不是台阁体，看不出是谁的手。<\/p>\n<p data-p=\"29\">他取过一张竹纸，在上面写了四样东西：<\/p>\n<p class=\"chao\" data-p=\"30\">谁写的。何时写的。从何处来。有无印押。<\/p>\n<p data-p=\"31\">这是户房收一份文书，要先看的四样。一样不全，就不作数。<\/p>\n<p data-p=\"32\">他对着那张泡烂的纸，一样一样地看。<\/p>\n<p data-p=\"33\">谁写的，看不出来。冯四不识字，不是他写的；写的人没落款。<\/p>\n<p data-p=\"34\">何时写的，没有日子。<\/p>\n<p data-p=\"35\">从何处来，冯四死了，他婆娘不知道。<\/p>\n<p data-p=\"36\">有无印押，没有。<\/p>\n<p data-p=\"37\">他把四样都划掉了。<\/p>\n<p data-p=\"38\">他知道这张纸说的是什么：十三日二更，西堤的人要动，这件事，不必记进册子。<\/p>\n<p data-p=\"39\">可他知道，不等于这张纸能替他说出来。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"40\">第二日，<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>来户房翻一本旧账，沈默把那张纸推过去。<\/p>\n<p data-p=\"41\">余司吏低头看着，手揣在袖子里，没有伸出来碰它。<\/p>\n<p data-p=\"42\">“冯四身上的？”<\/p>\n<p data-p=\"43\">“是。”<\/p>\n<p data-p=\"44\">“没有日子，没有落款，没有印。”余司吏说，“一张纸要作证，得有人认它。没人认的纸，就是废纸。”<\/p>\n<p data-p=\"45\">“冯四认它。他揣在枕头底下。”<\/p>\n<p data-p=\"46\">“冯四死了。”<\/p>\n<p data-p=\"47\">余司吏的眼睛还落在纸上，落在最后那四个字上。他的指头在案沿上叩了一下，又缩回了袖子里。<\/p>\n<p data-p=\"48\">“这种话，衙门里常写。”他说完，拿起旧账，走了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">那天夜里，户房又只点了一盏灯。<\/p>\n<p data-p=\"50\">沈默看着那四个字，和“不必”前头那半个“事”字。<\/p>\n<p class=\"chao\" data-p=\"51\">此事不必入册。<\/p>\n<p data-p=\"52\">他在哪里见过这句话。<\/p>\n<p data-p=\"53\">不是听人说的，是写过的。一笔一画，照着别人的批，誊过一遍。<\/p>\n<p data-p=\"54\">那是他进衙门的头一年。余司吏把一张临时核销单放在他面前，说，照着誊，一个字不要错。<\/p>\n<p data-p=\"55\">单子末尾一行批语，他誊的时候还觉得奇怪，多看了一眼：<\/p>\n<p class=\"chao\" data-p=\"56\">此事不必入册。<\/p>\n<p data-p=\"57\">一字不差。<\/p>", "paras": ["冯四的东西，是郑典史那边的差役送到户房来的。", "一个布包：一块腰牌，一双泡烂了底的布鞋，一串铜钱，四十七文。还有那张纸，单独夹在一块油布里。", "差役说：“郑老爷交代，冯四的工食算到六月底，交他婆娘来领。这张纸泡烂了，没用，一并交来，户房看着办。”", "沈默接过油布，没有打开。", "“郑老爷看过这张纸？”", "“看过一眼。”差役说，“郑老爷说，今年淹死的，不止他一个。”", "冯四的婆娘是第二日来的，三十来岁，眼睛肿着，手里拉着一个四五岁的孩子。", "沈默把工食算给她，一共一钱八分银子，又把那串铜钱和腰牌交到她手里。", "她把东西一样一样收进怀里，收到腰牌，攥了一会儿。", "“书办老爷，”她说，“他身上，是不是还有一张纸？”", "“有。”", "“他不识字。”她说，“那张纸，他揣了好些日子，睡觉都压在枕头底下。我问他是什么，他说是要紧的，叫我别动。”", "“他说过是谁给他的？”", "“没说。”她摇摇头，“他就说，上头的话，空口说的不作数，得有张纸。”", "她拉着孩子走了。走到门口，孩子回头看了一眼案上那块油布。", "那天夜里，沈默把油布打开。", "纸是衙门里常用的竹纸，跟户房案上那一叠一样，跟他夹在褡裢里的那几张也一样。泡过水，又在冯四怀里捂干了，皱成一团，边上烂了一圈。", "他没敢硬展，把纸铺在一块湿布上，等它慢慢软下来，再用指头一点一点推平。", "字洇开了大半，墨晕成一片一片灰影。", "他把纸举起来，凑到灯前，让灯光从纸背透过来。洇开的地方，墨重的笔画还留着一道深痕。", "他一个字一个字地认。", "第一行，只剩中间两个字，墨最重，看得清：西堤。", "第二行，开头一个字只剩半边，像是“二”，又像是“三”。后头一个“更”字，倒还完整。", "第三行全糊了。", "最后一行，靠左边，四个字挤在一起，墨又重又匀，像是写的人落笔前特意蘸足了：", "……不必入册。", "“不必”前头，还有一点残墨，是半个字，只剩中间一个“口”，和底下拖出来的一竖，像是一个“事”字。", "他把纸放下，又举起来，又放下。", "字是寻常的楷书，不是台阁体，看不出是谁的手。", "他取过一张竹纸，在上面写了四样东西：", "谁写的。何时写的。从何处来。有无印押。", "这是户房收一份文书，要先看的四样。一样不全，就不作数。", "他对着那张泡烂的纸，一样一样地看。", "谁写的，看不出来。冯四不识字，不是他写的；写的人没落款。", "何时写的，没有日子。", "从何处来，冯四死了，他婆娘不知道。", "有无印押，没有。", "他把四样都划掉了。", "他知道这张纸说的是什么：十三日二更，西堤的人要动，这件事，不必记进册子。", "可他知道，不等于这张纸能替他说出来。", "第二日，余司吏来户房翻一本旧账，沈默把那张纸推过去。", "余司吏低头看着，手揣在袖子里，没有伸出来碰它。", "“冯四身上的？”", "“是。”", "“没有日子，没有落款，没有印。”余司吏说，“一张纸要作证，得有人认它。没人认的纸，就是废纸。”", "“冯四认它。他揣在枕头底下。”", "“冯四死了。”", "余司吏的眼睛还落在纸上，落在最后那四个字上。他的指头在案沿上叩了一下，又缩回了袖子里。", "“这种话，衙门里常写。”他说完，拿起旧账，走了。", "那天夜里，户房又只点了一盏灯。", "沈默看着那四个字，和“不必”前头那半个“事”字。", "此事不必入册。", "他在哪里见过这句话。", "不是听人说的，是写过的。一笔一画，照着别人的批，誊过一遍。", "那是他进衙门的头一年。余司吏把一张临时核销单放在他面前，说，照着誊，一个字不要错。", "单子末尾一行批语，他誊的时候还觉得奇怪，多看了一眼：", "此事不必入册。", "一字不差。"], "recap": "工食单上写着：十三日二更，奉县丞口谕，调西堤夫役往东埠头扛粮。门簿上，两夜都是承发房的冯四“奉县丞口谕”出城。郑典史认了是他点的头：那夜西堤要是不决，水就进城了。吴县丞说：我没有交代过。他照样落了款，又说自己做知县那年报了实数，后来降调到这里。第三日，冯四在溪口淹死了，怀里揣着一张泡烂的纸。"}, {"n": 12, "cn": "十二", "title": "旧笔", "era": "", "chars": 1101, "mins": 3, "html": "<p data-p=\"0\">库房最里头那排架子，是嘉靖三十几年的底单，一年一捆，麻绳扎着，绳结上挂着竹牌。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>找到三十五年那一捆，绳子已经糟了，一碰就断。<\/p>\n<p data-p=\"2\">漫水那一夜，水没淹到这一层。纸只是潮，摸上去软塌塌的，一股霉味。<\/p>\n<p data-p=\"3\">他一张一张往下翻。都是户房的底：收了什么，发了什么，誊了什么，存一份在这里，不往上送。<\/p>\n<p data-p=\"4\">翻到七月，他的手停了。<\/p>\n<p data-p=\"5\">那一张的字，他认得。<\/p>\n<p data-p=\"6\">不是认得是谁写的，是认得那种写法。一笔一画，很用力，每一个字都写得太端正了，端正得有点僵。<\/p>\n<p data-p=\"7\">横是横，竖是竖，像是写字的人生怕哪一笔歪了，被人挑出来。<\/p>\n<p data-p=\"8\">是他自己的字。进衙门头一年的字。<\/p>\n<p data-p=\"9\">是<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>把他荐进户房的，说户房缺一个字写得端正的人。<\/p>\n<p data-p=\"10\">他把那张单子抽出来，铺在案上。<\/p>\n<p data-p=\"11\">临时核销单。<\/p>\n<p data-p=\"12\">西堤中段，塌陷一段，连夜抢筑，用石料若干方、土方若干、夫役若干工，共银一千三百八十两。<\/p>\n<p data-p=\"13\">他把这一行看了三遍。<\/p>\n<p data-p=\"14\">然后他回到户房，开了抽屉，取出那本核销册，翻到末页。<\/p>\n<p data-p=\"15\">贴补的那条纸上：一千三百八十两。<\/p>\n<p data-p=\"16\">他把两样东西并排摆着。<\/p>\n<p data-p=\"17\">一个是五年前，他自己誊的。一个是今年，别人贴上去的。<\/p>\n<p data-p=\"18\">一两不多，一两不少。<\/p>\n<p data-p=\"19\">单子往下，是一行批：<\/p>\n<p class=\"chao\" data-p=\"20\">此事不必入册。<\/p>\n<p data-p=\"21\">批语底下，是经手的名字，一行一行排着：<\/p>\n<p class=\"chao\" data-p=\"22\">司吏，余某。<\/p>\n<p class=\"chao\" data-p=\"23\">誊录，书手沈默。<\/p>\n<p data-p=\"24\">他的名字在最后一行。字写得最用力。<\/p>\n<p data-p=\"25\">单子右上角，记着日子：嘉靖三十五年七月初九。<\/p>\n<p data-p=\"26\">那一年六月，西堤中段也塌过一段，十几丈长，连夜抢住了，没开口子。西乡低处的田，泡了几日。<\/p>\n<p data-p=\"27\">那一年他刚进衙门，坐在户房最外头那张案子后头，每日誊余司吏递过来的东西。递过来什么，他誊什么。他誊得很仔细，一个字不敢错，誊完了，余司吏看一眼，收走，他再誊下一张。<\/p>\n<p data-p=\"28\">他记得那年夏天，母亲托人捎话进城，说三都的屋子进了水，墙泡塌了半边。<\/p>\n<p data-p=\"29\">他没回去。户房离不了人。<\/p>\n<p data-p=\"30\">那年秋天，家里搬进了城。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"31\">余司吏是傍晚来的。他看见案上摊着那两样东西，站住了，没往前走。<\/p>\n<p data-p=\"32\">“三十五年这张单子，”沈默说，“是我誊的。”<\/p>\n<p data-p=\"33\">“是我递给你的。”<\/p>\n<p data-p=\"34\">“一千三百八十两。今年也是。”<\/p>\n<p data-p=\"35\">余司吏咳了两声。<\/p>\n<p data-p=\"36\">“中段，”沈默说，“三十五年塌过，三十九年二月修竣，腊月又修，今年开了口子。”<\/p>\n<p data-p=\"37\">“旧例。”<\/p>\n<p data-p=\"38\">“什么旧例？”<\/p>\n<p data-p=\"39\">余司吏看着那张单子，看着单子最后一行，那个写得最用力的名字。<\/p>\n<p data-p=\"40\">“你誊这张单子那年，”他说，“我也这么问过一回。”<\/p>\n<p data-p=\"41\">“问谁？”<\/p>\n<p data-p=\"42\">“问我前头那个司吏。”<\/p>\n<p data-p=\"43\">“他怎么答的？”<\/p>\n<p data-p=\"44\">余司吏转过身，往门口走。<\/p>\n<p data-p=\"45\">“他说，旧例。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"46\">那天夜里，户房的灯点到很晚。<\/p>\n<p data-p=\"47\">沈默坐着，没有写竹纸。<\/p>\n<p data-p=\"48\">那几张竹纸、那张“伏乞垂怜”的呈子，都还在褡裢里。他把褡裢解下来，摊在案上，一样一样看过去：点夫的数，险报交驿的时辰，宋某等五户，门簿上<b class=\"rn\" data-c=\"fengsi\">冯四<\/b>那一行。<\/p>\n<p data-p=\"49\">都是他留着护自己的。<\/p>\n<p data-p=\"50\">他把三十五年那张单子折好，放了进去，放在最底下。<\/p>\n<p data-p=\"51\">褡裢里的东西，头一回有一样，是对他自己不利的。<\/p>", "paras": ["库房最里头那排架子，是嘉靖三十几年的底单，一年一捆，麻绳扎着，绳结上挂着竹牌。", "沈默找到三十五年那一捆，绳子已经糟了，一碰就断。", "漫水那一夜，水没淹到这一层。纸只是潮，摸上去软塌塌的，一股霉味。", "他一张一张往下翻。都是户房的底：收了什么，发了什么，誊了什么，存一份在这里，不往上送。", "翻到七月，他的手停了。", "那一张的字，他认得。", "不是认得是谁写的，是认得那种写法。一笔一画，很用力，每一个字都写得太端正了，端正得有点僵。", "横是横，竖是竖，像是写字的人生怕哪一笔歪了，被人挑出来。", "是他自己的字。进衙门头一年的字。", "是余司吏把他荐进户房的，说户房缺一个字写得端正的人。", "他把那张单子抽出来，铺在案上。", "临时核销单。", "西堤中段，塌陷一段，连夜抢筑，用石料若干方、土方若干、夫役若干工，共银一千三百八十两。", "他把这一行看了三遍。", "然后他回到户房，开了抽屉，取出那本核销册，翻到末页。", "贴补的那条纸上：一千三百八十两。", "他把两样东西并排摆着。", "一个是五年前，他自己誊的。一个是今年，别人贴上去的。", "一两不多，一两不少。", "单子往下，是一行批：", "此事不必入册。", "批语底下，是经手的名字，一行一行排着：", "司吏，余某。", "誊录，书手沈默。", "他的名字在最后一行。字写得最用力。", "单子右上角，记着日子：嘉靖三十五年七月初九。", "那一年六月，西堤中段也塌过一段，十几丈长，连夜抢住了，没开口子。西乡低处的田，泡了几日。", "那一年他刚进衙门，坐在户房最外头那张案子后头，每日誊余司吏递过来的东西。递过来什么，他誊什么。他誊得很仔细，一个字不敢错，誊完了，余司吏看一眼，收走，他再誊下一张。", "他记得那年夏天，母亲托人捎话进城，说三都的屋子进了水，墙泡塌了半边。", "他没回去。户房离不了人。", "那年秋天，家里搬进了城。", "余司吏是傍晚来的。他看见案上摊着那两样东西，站住了，没往前走。", "“三十五年这张单子，”沈默说，“是我誊的。”", "“是我递给你的。”", "“一千三百八十两。今年也是。”", "余司吏咳了两声。", "“中段，”沈默说，“三十五年塌过，三十九年二月修竣，腊月又修，今年开了口子。”", "“旧例。”", "“什么旧例？”", "余司吏看着那张单子，看着单子最后一行，那个写得最用力的名字。", "“你誊这张单子那年，”他说，“我也这么问过一回。”", "“问谁？”", "“问我前头那个司吏。”", "“他怎么答的？”", "余司吏转过身，往门口走。", "“他说，旧例。”", "那天夜里，户房的灯点到很晚。", "沈默坐着，没有写竹纸。", "那几张竹纸、那张“伏乞垂怜”的呈子，都还在褡裢里。他把褡裢解下来，摊在案上，一样一样看过去：点夫的数，险报交驿的时辰，宋某等五户，门簿上冯四那一行。", "都是他留着护自己的。", "他把三十五年那张单子折好，放了进去，放在最底下。", "褡裢里的东西，头一回有一样，是对他自己不利的。"], "recap": "冯四的婆娘说，那张纸他睡觉都压在枕头底下。沈默一个字一个字地认：西堤，二更，最后一行是“不必入册”。无日月，无落款，无印押，四样都不作数。余司吏说，这种话衙门里常写。夜里他想起来，这句话他誊过：进衙门的头一年，余司吏递给他一张单子，说照着誊，一个字不要错。"}, {"n": 13, "cn": "十三", "title": "回头", "era": "", "chars": 1584, "mins": 4, "html": "<p data-p=\"0\">那张呈子，他写了一整夜。<\/p>\n<p data-p=\"1\">题目是：为西堤中段历年核销事。<\/p>\n<p data-p=\"2\">他把能写的都写了：三十五年中段塌陷，抢修一千三百八十两，批“此事不必入册”；三十九年二月修竣，腊月又修，料石七百二十方，实到四百出头；四十年核销册末页贴补，原额七百两，贴作一千三百八十两；六月十二、十三两夜，承发房差役<b class=\"rn\" data-c=\"fengsi\">冯四<\/b>奉“县丞口谕”往西堤调夫，门簿有记。<\/p>\n<p data-p=\"3\">每一条后头，都写着凭据在哪里。<\/p>\n<p data-p=\"4\">写到天亮，他把呈子叠好，压在案头。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"5\"><b class=\"rn\" data-c=\"yusili\">余司吏<\/b>来得早。他进门，看见案头那一叠纸，站住了。<\/p>\n<p data-p=\"6\">“给县丞的？”<\/p>\n<p data-p=\"7\">“是。”<\/p>\n<p data-p=\"8\">余司吏没有伸手，就站着，把最上头那一张从头看到尾。看完，他在<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>对面那张案子后头坐下了。这是他头一回在户房坐下。<\/p>\n<p data-p=\"9\">“三十五年那张单子，”他说，“誊录的是谁？”<\/p>\n<p data-p=\"10\">“是我。”<\/p>\n<p data-p=\"11\">“县丞抽屉里那张禀帖，收讫旁边是谁的字？”<\/p>\n<p data-p=\"12\">“是我。”<\/p>\n<p data-p=\"13\">“两样放在一起，”余司吏说，“你是什么？”<\/p>\n<p data-p=\"14\">沈默没有答。<\/p>\n<p data-p=\"15\">“你写'历年核销有弊'，”余司吏说，“县丞看了，头一句问的是：你既知有弊，三十五年为何照誊？今年为何不报？你是新书吏，照着上头的意思誊，这不算错。可你自己递上去，就是你认了：你知道，你经手，你没说。”<\/p>\n<p data-p=\"16\">“那就认。”<\/p>\n<p data-p=\"17\">“认了，然后呢？”余司吏看着他，“一千三百八十两，是户房定的数？你报上去，报给县丞。县丞再往上报，报给谁？”<\/p>\n<p data-p=\"18\">窗外有人在扫院子，竹扫帚刮着青砖，一下一下。<\/p>\n<p data-p=\"19\">“二十六年那一回，”余司吏说，“<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>替我担了。”<\/p>\n<p data-p=\"20\">外头的扫帚声停了。<\/p>\n<p data-p=\"21\">“你有谁替你担？”<\/p>\n<p data-p=\"22\">沈默看着案头那沓纸。<\/p>\n<p data-p=\"23\">“你家里，几口人？”余司吏问。<\/p>\n<p data-p=\"24\">“四口。”<\/p>\n<p data-p=\"25\">“四口。”余司吏站起来，“灾后的损账，府里催着要。那是你能核的，也是你该核的。先把那个核清楚。”<\/p>\n<p data-p=\"26\">他走到门口，回过头。<\/p>\n<p data-p=\"27\">“这一叠，烧了也好，锁了也好。别递。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"28\">那天他回家早。<\/p>\n<p data-p=\"29\">母亲病了。七月初水退下去，她非要回三都看一眼，说要看看老屋还剩几根梁。<\/p>\n<p data-p=\"30\">在泥地里走了一整天，回来就咳，咳了半个月，夜里发起热来。<\/p>\n<p data-p=\"31\">回来那天，她只说了一句话：<\/p>\n<p data-p=\"32\">“槐树死了。”<\/p>\n<p data-p=\"33\">郎中来过，开了方子，说药要吃半个月。<\/p>\n<p data-p=\"34\"><b class=\"rn\" data-c=\"heshi\">何氏<\/b>把药包摊在桌上，一包一包数。<\/p>\n<p data-p=\"35\">“一剂四十文。”她说，“半个月，就是六百文。”<\/p>\n<p data-p=\"36\">她把药包收起来，又说：“塾里的先生打发人来问，下月的束脩，几时交。”<\/p>\n<p data-p=\"37\">“下月初就交。”<\/p>\n<p data-p=\"38\">“米又涨了。”何氏说，“昨日一斗八十文，今日八十八文。”<\/p>\n<p data-p=\"39\">她没有再说别的，去灶边煎药了。<\/p>\n<p data-p=\"40\"><b class=\"rn\" data-c=\"ahe\">阿禾<\/b>趴在桌边描红，描完一张，举起来给他看。<\/p>\n<p data-p=\"41\">“爹，先生说，等我会写字了，也能进衙门当书办。”<\/p>\n<p data-p=\"42\">沈默看着那张描红纸。<\/p>\n<p data-p=\"43\">“书办是做什么的？”阿禾问。<\/p>\n<p data-p=\"44\">“抄字的。”他说。<\/p>\n<p data-p=\"45\">阿禾“哦”了一声，又低头去描下一张。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"46\">那天夜里，等一家人都睡了，沈默把那叠呈子从怀里取出来，又把褡裢里的东西一样一样倒出来：竹纸，冯四的纸，<b class=\"rn\" data-c=\"qiulaohan\">邱老汉<\/b>的呈子，三十五年那张单子。<\/p>\n<p data-p=\"47\">他把它们叠在一起，放进床底下一只旧木匣里。木匣是他当年考秀才时装书用的。<\/p>\n<p data-p=\"48\">他上了锁，把钥匙揣进怀里。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">往后几日，他只核灾损的账。<\/p>\n<p data-p=\"50\">淹田多少亩，倒屋多少间，死了多少口，赈了多少米，一样一样，核得清清楚楚。他算得快，几百户人家的数，一日就能出一本，一个尾数都不差。<\/p>\n<p data-p=\"51\">第五日，账送到二堂。<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>翻了几页，点了点头。<\/p>\n<p data-p=\"52\">“这几日的账，核得清楚。”<\/p>\n<p data-p=\"53\">沈默躬身退出来。廊下有风，太阳很好，雨停了已经半个多月。<\/p>\n<p data-p=\"54\">他想，他只是个书办。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"55\">第七日，<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>带着两个差役进了户房，手里捧着一叠封条。<\/p>\n<p data-p=\"56\">“府里来的文，”郑典史说，“灾后西堤一应册籍，即日起封存候勘。没有府里的批，谁也不准调看。”<\/p>\n<p data-p=\"57\">差役先去了库房。辛字、戌字那几排架子，三十几年那几捆底单，一捆一捆贴上了封条，封条上盖着县印。<\/p>\n<p data-p=\"58\">然后他们回到户房。<\/p>\n<p data-p=\"59\">“核销册呢？”<\/p>\n<p data-p=\"60\">沈默开了抽屉，把那本册子取出来。<\/p>\n<p data-p=\"61\">册子是他接差那天从孙书办的案子上接过来的。册首经手那一行，还是那一滴干了的墨点；末页那条贴补的纸，浆糊早干了，硬硬地贴着。<\/p>\n<p data-p=\"62\">差役把册子合上，用麻绳扎了，横竖贴了两道封条。<\/p>\n<p data-p=\"63\">郑典史看了他一眼。<\/p>\n<p data-p=\"64\">“府里的意思，”他说，“不冲谁。”<\/p>\n<p data-p=\"65\">他们捧着册子走了。<\/p>\n<p data-p=\"66\">沈默站在空了的抽屉前头。<\/p>\n<p data-p=\"67\">那只旧木匣，还在他家床底下。<\/p>", "paras": ["那张呈子，他写了一整夜。", "题目是：为西堤中段历年核销事。", "他把能写的都写了：三十五年中段塌陷，抢修一千三百八十两，批“此事不必入册”；三十九年二月修竣，腊月又修，料石七百二十方，实到四百出头；四十年核销册末页贴补，原额七百两，贴作一千三百八十两；六月十二、十三两夜，承发房差役冯四奉“县丞口谕”往西堤调夫，门簿有记。", "每一条后头，都写着凭据在哪里。", "写到天亮，他把呈子叠好，压在案头。", "余司吏来得早。他进门，看见案头那一叠纸，站住了。", "“给县丞的？”", "“是。”", "余司吏没有伸手，就站着，把最上头那一张从头看到尾。看完，他在沈默对面那张案子后头坐下了。这是他头一回在户房坐下。", "“三十五年那张单子，”他说，“誊录的是谁？”", "“是我。”", "“县丞抽屉里那张禀帖，收讫旁边是谁的字？”", "“是我。”", "“两样放在一起，”余司吏说，“你是什么？”", "沈默没有答。", "“你写'历年核销有弊'，”余司吏说，“县丞看了，头一句问的是：你既知有弊，三十五年为何照誊？今年为何不报？你是新书吏，照着上头的意思誊，这不算错。可你自己递上去，就是你认了：你知道，你经手，你没说。”", "“那就认。”", "“认了，然后呢？”余司吏看着他，“一千三百八十两，是户房定的数？你报上去，报给县丞。县丞再往上报，报给谁？”", "窗外有人在扫院子，竹扫帚刮着青砖，一下一下。", "“二十六年那一回，”余司吏说，“孙书办替我担了。”", "外头的扫帚声停了。", "“你有谁替你担？”", "沈默看着案头那沓纸。", "“你家里，几口人？”余司吏问。", "“四口。”", "“四口。”余司吏站起来，“灾后的损账，府里催着要。那是你能核的，也是你该核的。先把那个核清楚。”", "他走到门口，回过头。", "“这一叠，烧了也好，锁了也好。别递。”", "那天他回家早。", "母亲病了。七月初水退下去，她非要回三都看一眼，说要看看老屋还剩几根梁。", "在泥地里走了一整天，回来就咳，咳了半个月，夜里发起热来。", "回来那天，她只说了一句话：", "“槐树死了。”", "郎中来过，开了方子，说药要吃半个月。", "何氏把药包摊在桌上，一包一包数。", "“一剂四十文。”她说，“半个月，就是六百文。”", "她把药包收起来，又说：“塾里的先生打发人来问，下月的束脩，几时交。”", "“下月初就交。”", "“米又涨了。”何氏说，“昨日一斗八十文，今日八十八文。”", "她没有再说别的，去灶边煎药了。", "阿禾趴在桌边描红，描完一张，举起来给他看。", "“爹，先生说，等我会写字了，也能进衙门当书办。”", "沈默看着那张描红纸。", "“书办是做什么的？”阿禾问。", "“抄字的。”他说。", "阿禾“哦”了一声，又低头去描下一张。", "那天夜里，等一家人都睡了，沈默把那叠呈子从怀里取出来，又把褡裢里的东西一样一样倒出来：竹纸，冯四的纸，邱老汉的呈子，三十五年那张单子。", "他把它们叠在一起，放进床底下一只旧木匣里。木匣是他当年考秀才时装书用的。", "他上了锁，把钥匙揣进怀里。", "往后几日，他只核灾损的账。", "淹田多少亩，倒屋多少间，死了多少口，赈了多少米，一样一样，核得清清楚楚。他算得快，几百户人家的数，一日就能出一本，一个尾数都不差。", "第五日，账送到二堂。吴县丞翻了几页，点了点头。", "“这几日的账，核得清楚。”", "沈默躬身退出来。廊下有风，太阳很好，雨停了已经半个多月。", "他想，他只是个书办。", "第七日，郑典史带着两个差役进了户房，手里捧着一叠封条。", "“府里来的文，”郑典史说，“灾后西堤一应册籍，即日起封存候勘。没有府里的批，谁也不准调看。”", "差役先去了库房。辛字、戌字那几排架子，三十几年那几捆底单，一捆一捆贴上了封条，封条上盖着县印。", "然后他们回到户房。", "“核销册呢？”", "沈默开了抽屉，把那本册子取出来。", "册子是他接差那天从孙书办的案子上接过来的。册首经手那一行，还是那一滴干了的墨点；末页那条贴补的纸，浆糊早干了，硬硬地贴着。", "差役把册子合上，用麻绳扎了，横竖贴了两道封条。", "郑典史看了他一眼。", "“府里的意思，”他说，“不冲谁。”", "他们捧着册子走了。", "沈默站在空了的抽屉前头。", "那只旧木匣，还在他家床底下。"], "recap": "库房里，嘉靖三十五年七月那张临时核销单：西堤中段抢筑，共银一千三百八十两，“此事不必入册”。誊录，书手沈默。是他自己的字，写得太用力。今年贴补的数，一两不多，一两不少。余司吏说：旧例。那天夜里，他把这张单子也放进了褡裢，头一回，有一样是对他自己不利的。"}, {"n": 14, "cn": "十四", "title": "赈粮", "era": "", "chars": 1607, "mins": 5, "html": "<p data-p=\"0\">七月下旬，官仓见了底。<\/p>\n<p data-p=\"1\">府里拨的赈米还在路上，说是要等秋粮起运之后一并调拨。半赈发了半个月，粥厂的锅一日比一日稀。<\/p>\n<p data-p=\"2\"><b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>把<b class=\"rn\" data-c=\"zhangyuanwai\">张员外<\/b>请到了二堂。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>是被叫去记数的，坐在屏风边上一张小几后头，面前摊着纸笔。<\/p>\n<p data-p=\"4\">张员外还是那件半旧的绸衫，进门先给吴县丞作了揖，坐下来，茶端上来，他没喝。<\/p>\n<p data-p=\"5\">“张家愿出三百石。”他说，“米已经在船上了，三日内到埠头。”<\/p>\n<p data-p=\"6\">吴县丞点了点头：“张员外仁义。”<\/p>\n<p data-p=\"7\">“仁义不敢当。”张员外说，“只有一桩，三百石米，总得知道落在谁的口里。核田、核户的时候，张家的账房跟着一起核。”<\/p>\n<p data-p=\"8\">吴县丞没有马上说话。<\/p>\n<p data-p=\"9\">“核田是官府的事。”<\/p>\n<p data-p=\"10\">“是官府的事。”张员外说，“张家只是跟着看看，米别落错了地方。”<\/p>\n<p data-p=\"11\">屏风后头静了一会儿。沈默的笔停在纸上。<\/p>\n<p data-p=\"12\">“还有一桩。”张员外又说，“种我家地的佃户，按例是东家管。张家既然出了米给官府，佃户就不必再从官米里领了，省得一家吃两份。”<\/p>\n<p data-p=\"13\">吴县丞端起茶，喝了一口，放下。<\/p>\n<p data-p=\"14\">“可。”<\/p>\n<p data-p=\"15\">沈默在纸上记：张宅捐米三百石。核田核户，张宅账房会同。张宅佃户，归东家自赈。<\/p>\n<p data-p=\"16\">他记完，又看了一眼最后那一行。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">送张员外出二堂的时候，张员外在廊下站住了。<\/p>\n<p data-p=\"18\">“沈书办，借一步说话。”<\/p>\n<p data-p=\"19\">两个人走到廊子尽头，那里有一棵老桂树，叶子底下凉快。<\/p>\n<p data-p=\"20\">“三都那一带，我家的佃户三十多户。”张员外说，“往年遇灾，东家开仓，佃户借粮，秋后拿工抵。今年不一样，田淹了，秋后没有工可抵。我开了仓，就是白送。三十多户，我送得起一年，送不起三年。”<\/p>\n<p data-p=\"21\">他说得很平，像是在跟一个懂行的人算账。<\/p>\n<p data-p=\"22\">他朝廊子那头看了一眼，没有人，又说：<\/p>\n<p data-p=\"23\">“我家三都的田，也淹了。淹一季，张家熬得过。”<\/p>\n<p data-p=\"24\">“所以刚才那一条，”沈默说，“是员外自己提的。”<\/p>\n<p data-p=\"25\">“是我提的。”张员外说，“可册子是户房誊的。”<\/p>\n<p data-p=\"26\">他看着沈默。<\/p>\n<p data-p=\"27\">“佃户归不归东家，看的是册上怎么写。写成种张家地的，有东家养着，官米就领不着。写成没东家的穷佃户，就领得到。”<\/p>\n<p data-p=\"28\">“三十多户，大大小小一百多口。”张员外说，“<b class=\"rn\" data-c=\"qiulaohan\">邱老汉<\/b>那个孙子，也在里头。”<\/p>\n<p data-p=\"29\">廊下有风，桂树叶子哗地响了一阵。<\/p>\n<p data-p=\"30\">“员外要户房怎么写？”<\/p>\n<p data-p=\"31\">“不是我要怎么写。”张员外说，“沈书办是三都人，这些人家，哪家是我的佃户，哪家原本有自己的几分田，户房比我清楚。写成什么样，都是户房的事。”<\/p>\n<p data-p=\"32\">他把袖口上一片桂树叶拈了下来。<\/p>\n<p data-p=\"33\">“只是，户房那里，还压着一张田界的帖子。宋家的。”<\/p>\n<p data-p=\"34\">沈默的手在袖子里攥了一下。<\/p>\n<p data-p=\"35\">那张帖子，是<b class=\"rn\" data-c=\"laozhou\">老宋<\/b>五日前递上来的。水退了，宋家和张家两块田中间的界石冲没了，张家的管事重新打了木桩。老宋说，桩子往他家那边挪了二尺，挪了一整条，算起来，半亩。<\/p>\n<p data-p=\"36\">户房要对着鱼鳞册核。册上画得清清楚楚，那一条界，原本在哪里。<\/p>\n<p data-p=\"37\">“田界的事，”张员外说，“水退了才看得清。泥还没干，看不清，不急。缓到秋后，再勘也不迟。”<\/p>\n<p data-p=\"38\">他说完，像是想起了什么，又添了一句：<\/p>\n<p data-p=\"39\">“西堤那年腊月的石料，是我家的船运的。运了几趟，每趟多少方，船上都有单子。我心里有数。”<\/p>\n<p data-p=\"40\">他看着沈默的脸。<\/p>\n<p data-p=\"41\">“我家只管运，运多少，记多少。县里怎么核成七百二十方，是县里的事。沈书办若用得着，船单可以抄一份给你。”<\/p>\n<p data-p=\"42\">沈默站在桂树底下，一个字也没答。<\/p>\n<p data-p=\"43\">张员外也不等他答，拱了拱手，往外走。走到廊子拐角，又回过头来，笑了笑。<\/p>\n<p data-p=\"44\">“明年丝价要涨。”他说，“三都那几块低田，种稻是可惜了。”<\/p>\n<p data-p=\"45\">他抬头看了看院墙外头的天。<\/p>\n<p data-p=\"46\">“我家祠堂后头那几亩，是老太爷手上开出来的，”他说，“那几亩不改，留着种稻。”<\/p>\n<p data-p=\"47\">他把手笼进了袖子里。<\/p>\n<p data-p=\"48\">“祭祖的米，总得是自家田里出的。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">那天傍晚，户房只剩他一个人。<\/p>\n<p data-p=\"50\">案上摆着两样东西。<\/p>\n<p data-p=\"51\">左边是张家佃户的名册，是张家账房一早送来的，一户一户，誊得整整齐齐。三十四户。第二十一户写着：邱，口一。<\/p>\n<p data-p=\"52\">原本是口二。前一个字被划掉了，墨还新。<\/p>\n<p data-p=\"53\">右边是老宋那张田界帖子，压在西乡三都的鱼鳞册上。鱼鳞册翻在东村那一页，宋家那几块田，一格一格，边上的线画得清清楚楚。<\/p>\n<p data-p=\"54\">他把灯点上，看着这两样东西。<\/p>\n<p data-p=\"55\">一样能让一百多口人领到米，其中一口，是那个他打发走的孩子。<\/p>\n<p data-p=\"56\">一样是老宋家剩下的半亩田。<\/p>\n<p data-p=\"57\">灯油添过一回，两样东西，都没有动。<\/p>", "paras": ["七月下旬，官仓见了底。", "府里拨的赈米还在路上，说是要等秋粮起运之后一并调拨。半赈发了半个月，粥厂的锅一日比一日稀。", "吴县丞把张员外请到了二堂。", "沈默是被叫去记数的，坐在屏风边上一张小几后头，面前摊着纸笔。", "张员外还是那件半旧的绸衫，进门先给吴县丞作了揖，坐下来，茶端上来，他没喝。", "“张家愿出三百石。”他说，“米已经在船上了，三日内到埠头。”", "吴县丞点了点头：“张员外仁义。”", "“仁义不敢当。”张员外说，“只有一桩，三百石米，总得知道落在谁的口里。核田、核户的时候，张家的账房跟着一起核。”", "吴县丞没有马上说话。", "“核田是官府的事。”", "“是官府的事。”张员外说，“张家只是跟着看看，米别落错了地方。”", "屏风后头静了一会儿。沈默的笔停在纸上。", "“还有一桩。”张员外又说，“种我家地的佃户，按例是东家管。张家既然出了米给官府，佃户就不必再从官米里领了，省得一家吃两份。”", "吴县丞端起茶，喝了一口，放下。", "“可。”", "沈默在纸上记：张宅捐米三百石。核田核户，张宅账房会同。张宅佃户，归东家自赈。", "他记完，又看了一眼最后那一行。", "送张员外出二堂的时候，张员外在廊下站住了。", "“沈书办，借一步说话。”", "两个人走到廊子尽头，那里有一棵老桂树，叶子底下凉快。", "“三都那一带，我家的佃户三十多户。”张员外说，“往年遇灾，东家开仓，佃户借粮，秋后拿工抵。今年不一样，田淹了，秋后没有工可抵。我开了仓，就是白送。三十多户，我送得起一年，送不起三年。”", "他说得很平，像是在跟一个懂行的人算账。", "他朝廊子那头看了一眼，没有人，又说：", "“我家三都的田，也淹了。淹一季，张家熬得过。”", "“所以刚才那一条，”沈默说，“是员外自己提的。”", "“是我提的。”张员外说，“可册子是户房誊的。”", "他看着沈默。", "“佃户归不归东家，看的是册上怎么写。写成种张家地的，有东家养着，官米就领不着。写成没东家的穷佃户，就领得到。”", "“三十多户，大大小小一百多口。”张员外说，“邱老汉那个孙子，也在里头。”", "廊下有风，桂树叶子哗地响了一阵。", "“员外要户房怎么写？”", "“不是我要怎么写。”张员外说，“沈书办是三都人，这些人家，哪家是我的佃户，哪家原本有自己的几分田，户房比我清楚。写成什么样，都是户房的事。”", "他把袖口上一片桂树叶拈了下来。", "“只是，户房那里，还压着一张田界的帖子。宋家的。”", "沈默的手在袖子里攥了一下。", "那张帖子，是老宋五日前递上来的。水退了，宋家和张家两块田中间的界石冲没了，张家的管事重新打了木桩。老宋说，桩子往他家那边挪了二尺，挪了一整条，算起来，半亩。", "户房要对着鱼鳞册核。册上画得清清楚楚，那一条界，原本在哪里。", "“田界的事，”张员外说，“水退了才看得清。泥还没干，看不清，不急。缓到秋后，再勘也不迟。”", "他说完，像是想起了什么，又添了一句：", "“西堤那年腊月的石料，是我家的船运的。运了几趟，每趟多少方，船上都有单子。我心里有数。”", "他看着沈默的脸。", "“我家只管运，运多少，记多少。县里怎么核成七百二十方，是县里的事。沈书办若用得着，船单可以抄一份给你。”", "沈默站在桂树底下，一个字也没答。", "张员外也不等他答，拱了拱手，往外走。走到廊子拐角，又回过头来，笑了笑。", "“明年丝价要涨。”他说，“三都那几块低田，种稻是可惜了。”", "他抬头看了看院墙外头的天。", "“我家祠堂后头那几亩，是老太爷手上开出来的，”他说，“那几亩不改，留着种稻。”", "他把手笼进了袖子里。", "“祭祖的米，总得是自家田里出的。”", "那天傍晚，户房只剩他一个人。", "案上摆着两样东西。", "左边是张家佃户的名册，是张家账房一早送来的，一户一户，誊得整整齐齐。三十四户。第二十一户写着：邱，口一。", "原本是口二。前一个字被划掉了，墨还新。", "右边是老宋那张田界帖子，压在西乡三都的鱼鳞册上。鱼鳞册翻在东村那一页，宋家那几块田，一格一格，边上的线画得清清楚楚。", "他把灯点上，看着这两样东西。", "一样能让一百多口人领到米，其中一口，是那个他打发走的孩子。", "一样是老宋家剩下的半亩田。", "灯油添过一回，两样东西，都没有动。"], "recap": "他写了一夜的呈子，条条有凭据。余司吏说：你既知有弊，三十五年为何照誊？今年为何不报？二十六年那一回，孙书办替我担了，你有谁替你担？母亲病了，药钱、束脩、米价一样一样涨。他把呈子和褡裢里的东西锁进床底下的旧木匣。第七日，府文来，西堤一应册籍封存，核销册也被贴了封条。"}, {"n": 15, "cn": "十五", "title": "封柜", "era": "", "chars": 1916, "mins": 5, "html": "<p data-p=\"0\">赈册是第三日送出去的。<\/p>\n<p data-p=\"1\">三都那一页后头，多了三十四户。每一户名字底下，都写着同样四个字：无主贫户。<\/p>\n<p data-p=\"2\">字是<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>的，一笔一画，写得很稳。<\/p>\n<p data-p=\"3\">第二十一户：邱，口一。<\/p>\n<p data-p=\"4\">同一日，<b class=\"rn\" data-c=\"laozhou\">老宋<\/b>那张田界帖子，从鱼鳞册上挪了下来，摊在案头。帖子的右下角，户房要批一行字，才能往上转。<\/p>\n<p data-p=\"5\">他蘸了墨，写：<\/p>\n<p class=\"chao\" data-p=\"6\">泥淖未干，界址难辨，俟秋后会勘。<\/p>\n<p data-p=\"7\">写完，他看着“俟秋后会勘”那几个字。笔划很顺，跟<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>在灾状上写“余俟续勘”时，是一样的顺。<\/p>\n<p data-p=\"8\">他盖了户房的章，把帖子放进待转的那一摞里。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"9\">傍晚，张家的账房来了一趟，什么话也没说，把一个油纸包放在他案上，作了个揖，走了。<\/p>\n<p data-p=\"10\">油纸包里是一张船单的抄件：嘉靖三十九年腊月，张宅船户，运西堤中段石料，船几只，趟几回，每回几方。末尾一行，合计：四百二十方。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"11\">第二日，三都的佃户在西门外的粥厂领米。<\/p>\n<p data-p=\"12\"><b class=\"rn\" data-c=\"qiusunzi\">邱家那个孩子<\/b>也来了，排在队里，个子不高，两只手攥着一只布袋。轮到他，差役照着赈册念：“三都，邱，口一。”一勺一勺倒进袋子里。<\/p>\n<p data-p=\"13\">孩子把袋口扎紧，抱在怀里，从桌边走过去。走到沈默跟前，他停下来，认出了这张脸，把米袋夹在胳膊底下，笨拙地朝他作了个揖。<\/p>\n<p data-p=\"14\">然后他抱着米走了。<\/p>\n<p data-p=\"15\">沈默看着他的背影，看到坡底下，看不见了。<\/p>\n<p data-p=\"16\"><b class=\"rn\" data-c=\"ayun\">阿芸<\/b>是快收锅的时候来的。她没排队，径直走到桌前。<\/p>\n<p data-p=\"17\">“我爹叫我来问，”她说，“田界的帖子，核了没有。”<\/p>\n<p data-p=\"18\">“批了，秋后会勘。”<\/p>\n<p data-p=\"19\">阿芸没有马上说话。她回头看了看坡底下那一队抱着米袋往回走的人，三都的，大多是张家的佃户。<\/p>\n<p data-p=\"20\">“那半亩，”她说，“我家今秋还要种的。”<\/p>\n<p data-p=\"21\">她说完就走了。<\/p>\n<p data-p=\"22\">往后，沈默没有再去过三都的土地庙。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"23\">那天夜里，他把床底下的木匣拿出来，开了锁。<\/p>\n<p data-p=\"24\">船单抄件放进去，压在最上头。<\/p>\n<p data-p=\"25\">他把匣子里的东西一样一样摊开：三十五年那张单子，门簿上抄来的<b class=\"rn\" data-c=\"fengsi\">冯四<\/b>那一行，冯四怀里那张泡烂的纸，他抄下的<b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>那句供词：四百出头，现在又多了这张船单。<\/p>\n<p data-p=\"26\">一样一样连起来，只差一处。<\/p>\n<p data-p=\"27\">核销册上记的是七百二十方，船单上运的是四百二十方。中间那一道，是验收：石料到了堤上，验收的人点过数、画过押，写进验收簿，户房才能照着核销。<\/p>\n<p data-p=\"28\">那本验收簿，那个漫水的夜里，他从水里捞出来过。验收人一栏是空的，第二页被人拆了，新线旧眼。天亮时，它从最上一层不见了。<\/p>\n<p data-p=\"29\">能开那把锁的，只有<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"30\">第二日，他去<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>那里，抄了一份封存的单子。户房的东西封了，户房该有一份底。<\/p>\n<p data-p=\"31\">辛字三格，西堤核销底册，一本。<\/p>\n<p data-p=\"32\">嘉靖三十五年户房底单，一捆。<\/p>\n<p data-p=\"33\">嘉靖四十年西堤核销册，一本。<\/p>\n<p data-p=\"34\">一样一样，他往下看，看到底。<\/p>\n<p data-p=\"35\">戌字七号，没有。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"36\">余司吏那天在户房待到很晚。沈默等到廊下没人了，把封存单放在他面前。<\/p>\n<p data-p=\"37\">“戌字七号，”他说，“不在单子上。”<\/p>\n<p data-p=\"38\">余司吏看着那张单子，把它往灯下挪了挪。<\/p>\n<p data-p=\"39\">“封存之前，就不在库房了。”沈默说，“那天天亮，锁是扣上的。”<\/p>\n<p data-p=\"40\">“嗯。”<\/p>\n<p data-p=\"41\">“在你那里。”<\/p>\n<p data-p=\"42\">余司吏没有否认。<\/p>\n<p data-p=\"43\">“你护着的是谁？”沈默问，“是县丞，还是府里？”<\/p>\n<p data-p=\"44\">“都不是。”<\/p>\n<p data-p=\"45\">“那是谁？”<\/p>\n<p data-p=\"46\">余司吏咳了一阵。咳完了，他把那张封存单折起来，放在一边。<\/p>\n<p data-p=\"47\">“那本册子被拆的两页，”他说，“是<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>的字。”<\/p>\n<p data-p=\"48\">沈默的手从案上收了回来。<\/p>\n<p data-p=\"49\">“腊月他跟着工房去堤上验料。料石不够，中段不实，他不肯画押。”余司吏说，“回来，他把实数写在那两页上。”<\/p>\n<p data-p=\"50\">“那是他对的。”<\/p>\n<p data-p=\"51\">“不画押，是他对。”余司吏说，“可他知道中段不实，只跟我说了一句，半年里没往县里递一个字。律上有'失时不修堤防'一条，经手的官吏都要论罪。如今堤决了，册子一出来，县里头一个要问的就是：你腊月就知道，为什么不报？”<\/p>\n<p data-p=\"52\">“那两页，就是他知道的凭据。”<\/p>\n<p data-p=\"53\">窗外起了风，吹得窗纸鼓了一下。<\/p>\n<p data-p=\"54\">“跟你那张禀帖，是一样的。”<\/p>\n<p data-p=\"55\">沈默看着他。<\/p>\n<p data-p=\"56\">“他在二都，咳着血。他家里，现在有一个儿子。”余司吏说，“他要是背上这一条，革了役，恤银一文没有，死了，名字底下还要挂一个罪。”<\/p>\n<p data-p=\"57\">“二十六年那一回，”沈默问，“他为什么替你扛？”<\/p>\n<p data-p=\"58\">余司吏的眼睛落在灯上。灯油快干了，火苗一点一点矮下去。<\/p>\n<p data-p=\"59\">“他说，”他终于开口，“你家里有人等你吃饭，我没有。你往上走，往后，还能替人再改一回。”<\/p>\n<p data-p=\"60\">灯芯爆了一下。<\/p>\n<p data-p=\"61\">“我往上走了，”余司吏说，“没有再改过。”<\/p>\n<p data-p=\"62\">两个人都没有再说话。<\/p>\n<p data-p=\"63\">余司吏扶着案沿站起来，看着案头那一摞待转的帖子。老宋那一张，压在最上头，右下角是沈默的批：俟秋后会勘。<\/p>\n<p data-p=\"64\">“你按下宋家的界，为的是一百多口人。”他说，“我按下那本册子，为的是一个人。”<\/p>\n<p data-p=\"65\">他没有往下说。<\/p>\n<p data-p=\"66\">沈默看着那一行批，看着自己写的那几个字。<\/p>\n<p data-p=\"67\">“那就不看了。”他说。<\/p>\n<p data-p=\"68\">余司吏没有接话。他往门口走，走到门边，停住了。<\/p>\n<p data-p=\"69\">他从腰里摸出一样东西，放在门边那张案子的角上。<\/p>\n<p data-p=\"70\">是一把钥匙。铜的，磨得发亮。<\/p>\n<p data-p=\"71\">“府里委的勘官，后日到。”他说，“明日郑典史要把户房的柜子，连我那一只，一并封了。”<\/p>\n<p data-p=\"72\">他没有回头。<\/p>\n<p data-p=\"73\">“你若真要看，明早之前去。过了明日，我也保不住。”<\/p>\n<p data-p=\"74\">他走了。<\/p>\n<p data-p=\"75\">那把钥匙，搁在案角上，灯照着，亮了一点。<\/p>", "paras": ["赈册是第三日送出去的。", "三都那一页后头，多了三十四户。每一户名字底下，都写着同样四个字：无主贫户。", "字是沈默的，一笔一画，写得很稳。", "第二十一户：邱，口一。", "同一日，老宋那张田界帖子，从鱼鳞册上挪了下来，摊在案头。帖子的右下角，户房要批一行字，才能往上转。", "他蘸了墨，写：", "泥淖未干，界址难辨，俟秋后会勘。", "写完，他看着“俟秋后会勘”那几个字。笔划很顺，跟吴县丞在灾状上写“余俟续勘”时，是一样的顺。", "他盖了户房的章，把帖子放进待转的那一摞里。", "傍晚，张家的账房来了一趟，什么话也没说，把一个油纸包放在他案上，作了个揖，走了。", "油纸包里是一张船单的抄件：嘉靖三十九年腊月，张宅船户，运西堤中段石料，船几只，趟几回，每回几方。末尾一行，合计：四百二十方。", "第二日，三都的佃户在西门外的粥厂领米。", "邱家那个孩子也来了，排在队里，个子不高，两只手攥着一只布袋。轮到他，差役照着赈册念：“三都，邱，口一。”一勺一勺倒进袋子里。", "孩子把袋口扎紧，抱在怀里，从桌边走过去。走到沈默跟前，他停下来，认出了这张脸，把米袋夹在胳膊底下，笨拙地朝他作了个揖。", "然后他抱着米走了。", "沈默看着他的背影，看到坡底下，看不见了。", "阿芸是快收锅的时候来的。她没排队，径直走到桌前。", "“我爹叫我来问，”她说，“田界的帖子，核了没有。”", "“批了，秋后会勘。”", "阿芸没有马上说话。她回头看了看坡底下那一队抱着米袋往回走的人，三都的，大多是张家的佃户。", "“那半亩，”她说，“我家今秋还要种的。”", "她说完就走了。", "往后，沈默没有再去过三都的土地庙。", "那天夜里，他把床底下的木匣拿出来，开了锁。", "船单抄件放进去，压在最上头。", "他把匣子里的东西一样一样摊开：三十五年那张单子，门簿上抄来的冯四那一行，冯四怀里那张泡烂的纸，他抄下的王老实那句供词：四百出头，现在又多了这张船单。", "一样一样连起来，只差一处。", "核销册上记的是七百二十方，船单上运的是四百二十方。中间那一道，是验收：石料到了堤上，验收的人点过数、画过押，写进验收簿，户房才能照着核销。", "那本验收簿，那个漫水的夜里，他从水里捞出来过。验收人一栏是空的，第二页被人拆了，新线旧眼。天亮时，它从最上一层不见了。", "能开那把锁的，只有余司吏。", "第二日，他去郑典史那里，抄了一份封存的单子。户房的东西封了，户房该有一份底。", "辛字三格，西堤核销底册，一本。", "嘉靖三十五年户房底单，一捆。", "嘉靖四十年西堤核销册，一本。", "一样一样，他往下看，看到底。", "戌字七号，没有。", "余司吏那天在户房待到很晚。沈默等到廊下没人了，把封存单放在他面前。", "“戌字七号，”他说，“不在单子上。”", "余司吏看着那张单子，把它往灯下挪了挪。", "“封存之前，就不在库房了。”沈默说，“那天天亮，锁是扣上的。”", "“嗯。”", "“在你那里。”", "余司吏没有否认。", "“你护着的是谁？”沈默问，“是县丞，还是府里？”", "“都不是。”", "“那是谁？”", "余司吏咳了一阵。咳完了，他把那张封存单折起来，放在一边。", "“那本册子被拆的两页，”他说，“是孙书办的字。”", "沈默的手从案上收了回来。", "“腊月他跟着工房去堤上验料。料石不够，中段不实，他不肯画押。”余司吏说，“回来，他把实数写在那两页上。”", "“那是他对的。”", "“不画押，是他对。”余司吏说，“可他知道中段不实，只跟我说了一句，半年里没往县里递一个字。律上有'失时不修堤防'一条，经手的官吏都要论罪。如今堤决了，册子一出来，县里头一个要问的就是：你腊月就知道，为什么不报？”", "“那两页，就是他知道的凭据。”", "窗外起了风，吹得窗纸鼓了一下。", "“跟你那张禀帖，是一样的。”", "沈默看着他。", "“他在二都，咳着血。他家里，现在有一个儿子。”余司吏说，“他要是背上这一条，革了役，恤银一文没有，死了，名字底下还要挂一个罪。”", "“二十六年那一回，”沈默问，“他为什么替你扛？”", "余司吏的眼睛落在灯上。灯油快干了，火苗一点一点矮下去。", "“他说，”他终于开口，“你家里有人等你吃饭，我没有。你往上走，往后，还能替人再改一回。”", "灯芯爆了一下。", "“我往上走了，”余司吏说，“没有再改过。”", "两个人都没有再说话。", "余司吏扶着案沿站起来，看着案头那一摞待转的帖子。老宋那一张，压在最上头，右下角是沈默的批：俟秋后会勘。", "“你按下宋家的界，为的是一百多口人。”他说，“我按下那本册子，为的是一个人。”", "他没有往下说。", "沈默看着那一行批，看着自己写的那几个字。", "“那就不看了。”他说。", "余司吏没有接话。他往门口走，走到门边，停住了。", "他从腰里摸出一样东西，放在门边那张案子的角上。", "是一把钥匙。铜的，磨得发亮。", "“府里委的勘官，后日到。”他说，“明日郑典史要把户房的柜子，连我那一只，一并封了。”", "他没有回头。", "“你若真要看，明早之前去。过了明日，我也保不住。”", "他走了。", "那把钥匙，搁在案角上，灯照着，亮了一点。"], "recap": "官仓见底。张员外捐米三百石，条件是张家佃户归东家自赈。廊下，他对沈默说：佃户算不算张家的，看户房册上怎么写，邱老汉的孙子也在里头；又提起户房压着的那张宋家田界帖子，桩子往宋家那边挪了二尺；还说腊月的石料是张家的船运的，船上都有单子。案上两样东西，一百多口人的米，和老宋家的半亩田。"}, {"n": 16, "cn": "十六", "title": "钥匙", "era": "", "chars": 1803, "mins": 5, "html": "<p data-p=\"0\">他等到三更，才出门。<\/p>\n<p data-p=\"1\">户房在衙门最里一进，夜里没有人。廊下的灯笼早灭了，他摸着墙走，走到户房后头那间小屋。<\/p>\n<p data-p=\"2\">小屋里堆着户房的旧家什，靠墙立着一只柜子，黑漆剥了大半，铜锁锈着。是司吏的柜子。三十年来，只有<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>开过它。<\/p>\n<p data-p=\"3\">他把钥匙插进去。锁很涩，拧了两下，才咔的一声开了。<\/p>\n<p data-p=\"4\">他点上带来的那盏小油灯，用手挡着光。<\/p>\n<p data-p=\"5\">柜子里是纸。<\/p>\n<p data-p=\"6\">满满一柜子的纸。一捆一捆，用麻绳扎着，每一捆上头压一张小签，签上写着年份：嘉靖二十二年，二十三年，二十四年……一直排到四十年。<\/p>\n<p data-p=\"7\">最上头一层，单放着一样东西，用油布包着。他打开，是那本验收簿的封皮：西堤中段验收簿。封皮上那张窄纸条还贴着，台阁体，另册核销；纸条底下，册已缴销，四十年五月廿八日。<\/p>\n<p data-p=\"8\">封皮里夹着一个封套，封套上一个字：孙。<\/p>\n<p data-p=\"9\">封套里是两页纸，就是验收簿被拆走的那两页。字不是台阁体，是寻常的楷书，写得很重：<\/p>\n<p class=\"chao\" data-p=\"10\">腊月十九日，往西堤中段验料。料石实到四百二十方，与册载七百二十方不符。中段石基不实，恐不能当汛。未敢验收。<\/p>\n<p data-p=\"11\">底下没有画押，只写了一个名字：孙。<\/p>\n<p data-p=\"12\">他把这两页放在灯下，一个字一个字地看，看到油灯结了一朵灯花。<\/p>\n<p data-p=\"13\">然后他去翻那一捆一捆的纸。<\/p>\n<p data-p=\"14\">都是底稿。余司吏的字，小楷，一行一行，记着三十年来户房过手的事：<\/p>\n<p data-p=\"15\">哪一年哪一笔账，是照谁的意思做的，哪一个数，是谁叫改的。<\/p>\n<p data-p=\"16\">他抽出二十六年那一捆。<\/p>\n<p class=\"chao\" data-p=\"17\">七月，西乡二都某户，田没，税册减半。孙某认之，杖二十。<\/p>\n<p data-p=\"18\">他抽出三十五年那一捆。<\/p>\n<p class=\"chao\" data-p=\"19\">七月，西堤中段抢修，照府数一千三百八十两造单，不入册。<\/p>\n<p class=\"chao\" data-p=\"20\">誊录<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>，新进书手，未与闻。<\/p>\n<p data-p=\"21\">“未与闻”三个字，写得比别的字小。<\/p>\n<p data-p=\"22\">他抽出三十九年那一捆。<\/p>\n<p data-p=\"23\">腊月，孙某验料中段，不肯押。归来问我：账册与堤，先信哪个。未答。<\/p>\n<p data-p=\"24\">他抽出四十年那一捆，最薄，只有几张。<\/p>\n<p data-p=\"25\">五月初七，县丞口谕：西堤核销，照府核数一千三百八十两造册。末页贴补，册首孙某经手名刮去。廿八日，戌字七号登缴销。<\/p>\n<p data-p=\"26\">六月十三日凌晨，沈默核出差额，至库房。<\/p>\n<p data-p=\"27\">六月十三晓，取戌字七号入柜。<\/p>\n<p data-p=\"28\">六月二十，沈默私补东村五户，越例。划之。<\/p>\n<p data-p=\"29\">最底下压着一张单子，不是底稿，是一张分派单：<\/p>\n<p class=\"chao\" data-p=\"30\">嘉靖四十年五月起，府准县留堤工余平。户房司吏、书手，每名月加册费三钱。<\/p>\n<p data-p=\"31\">底下一排名字。第二个是：书手沈默。<\/p>\n<p data-p=\"32\">他坐在地上，背靠着柜子。<\/p>\n<p data-p=\"33\">油灯的火苗很小，照着满地摊开的纸。三十年，一年一捆，每一捆里都是真话。<\/p>\n<p data-p=\"34\">没有一张出过这间屋子。<\/p>\n<p data-p=\"35\">他想起自己床底下那只木匣，想起褡裢里那几张竹纸：点夫一百四十二名，险报交驿，驿簿有记。<\/p>\n<p data-p=\"36\">他再坐了一会儿。<\/p>\n<p data-p=\"37\">然后他从怀里摸出一叠空白的竹纸，蘸了随身带来的墨。<\/p>\n<p data-p=\"38\">他开始誊。<\/p>\n<p data-p=\"39\"><b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>那两页，一个字一个字誊。四十年五月那几行，一个字一个字誊。<\/p>\n<p data-p=\"40\">三十五年那一行，连“未与闻”那三个字，也誊了。册费分派单，誊了，连他自己的名字。<\/p>\n<p data-p=\"41\">他誊得很快。进衙门五年，他别的本事没有，誊得又快又准，一个字不错。<\/p>\n<p data-p=\"42\">外头不知什么时候起了风。窗纸发白了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"43\">五更的梆子刚过，院子里有了脚步声。<\/p>\n<p data-p=\"44\">不是一个人。好几个人，踩在青砖上，还有封条纸被风吹得哗啦哗啦响。<\/p>\n<p data-p=\"45\">沈默的手停了。<\/p>\n<p data-p=\"46\">小屋的门被推开了。进来的不是<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>，是余司吏。<\/p>\n<p data-p=\"47\">他披着一件旧夹袄，头发没梳，像是一夜没睡。他看了一眼满地的纸，又看了一眼沈默手里那叠竹纸。<\/p>\n<p data-p=\"48\">“后门。”他压低了声音，“从库房那边绕出去。”<\/p>\n<p data-p=\"49\">“余先生——”<\/p>\n<p data-p=\"50\">“走。”<\/p>\n<p data-p=\"51\">余司吏蹲下来，把地上的纸一捆一捆往柜子里塞。塞得很乱。他把油灯拿起来，端在自己手里。<\/p>\n<p data-p=\"52\">沈默把那叠竹纸塞进怀里，从后门出去，贴着库房的墙，绕到廊下。<\/p>\n<p data-p=\"53\">他刚站定，郑典史就带着人进了院子。<\/p>\n<p data-p=\"54\">户房后头小屋的灯还亮着。郑典史停住了脚。<\/p>\n<p data-p=\"55\">“谁在里头？”<\/p>\n<p data-p=\"56\">余司吏端着灯，从小屋里走出来。<\/p>\n<p data-p=\"57\">“郑老爷。”<\/p>\n<p data-p=\"58\">郑典史看了看他，又看了看他身后那只敞着门的柜子。<\/p>\n<p data-p=\"59\">“余先生，天没亮，开柜子做什么？”<\/p>\n<p data-p=\"60\">“柜子是我的，里头的东西是我收的。”余司吏说，“府里的人来之前，我自己理一理。”<\/p>\n<p data-p=\"61\">“府文昨日就到了。”郑典史说，“户房的柜子，一律封存候勘。封存之前私开，按例要问。”<\/p>\n<p data-p=\"62\">“我开的。”余司吏说，“问我。”<\/p>\n<p data-p=\"63\">郑典史站了一会儿。院子里的风把封条吹得卷起来，差役用手按着。<\/p>\n<p data-p=\"64\">“余先生，”他说，“得罪了。”<\/p>\n<p data-p=\"65\">他朝差役摆了摆手。两个差役上前，一左一右站在余司吏身边，没有架他。另外两个进了小屋，把柜门合上，横竖贴了两道封条，盖了县印。<\/p>\n<p data-p=\"66\">满柜子的纸，又都关回去了。<\/p>\n<p data-p=\"67\">余司吏被带着往外走，走到廊下，经过沈默身边。<\/p>\n<p data-p=\"68\">沈默站在廊柱旁边，像是刚来上差。<\/p>\n<p data-p=\"69\">余司吏没有停，也没有看他。走过去的那一步，他的嘴唇动了一下，声音很低，低得只有他们两个人听得见：<\/p>\n<p data-p=\"70\">“我这辈子的纸，没一张出过这个门。”<\/p>", "paras": ["他等到三更，才出门。", "户房在衙门最里一进，夜里没有人。廊下的灯笼早灭了，他摸着墙走，走到户房后头那间小屋。", "小屋里堆着户房的旧家什，靠墙立着一只柜子，黑漆剥了大半，铜锁锈着。是司吏的柜子。三十年来，只有余司吏开过它。", "他把钥匙插进去。锁很涩，拧了两下，才咔的一声开了。", "他点上带来的那盏小油灯，用手挡着光。", "柜子里是纸。", "满满一柜子的纸。一捆一捆，用麻绳扎着，每一捆上头压一张小签，签上写着年份：嘉靖二十二年，二十三年，二十四年……一直排到四十年。", "最上头一层，单放着一样东西，用油布包着。他打开，是那本验收簿的封皮：西堤中段验收簿。封皮上那张窄纸条还贴着，台阁体，另册核销；纸条底下，册已缴销，四十年五月廿八日。", "封皮里夹着一个封套，封套上一个字：孙。", "封套里是两页纸，就是验收簿被拆走的那两页。字不是台阁体，是寻常的楷书，写得很重：", "腊月十九日，往西堤中段验料。料石实到四百二十方，与册载七百二十方不符。中段石基不实，恐不能当汛。未敢验收。", "底下没有画押，只写了一个名字：孙。", "他把这两页放在灯下，一个字一个字地看，看到油灯结了一朵灯花。", "然后他去翻那一捆一捆的纸。", "都是底稿。余司吏的字，小楷，一行一行，记着三十年来户房过手的事：", "哪一年哪一笔账，是照谁的意思做的，哪一个数，是谁叫改的。", "他抽出二十六年那一捆。", "七月，西乡二都某户，田没，税册减半。孙某认之，杖二十。", "他抽出三十五年那一捆。", "七月，西堤中段抢修，照府数一千三百八十两造单，不入册。", "誊录沈默，新进书手，未与闻。", "“未与闻”三个字，写得比别的字小。", "他抽出三十九年那一捆。", "腊月，孙某验料中段，不肯押。归来问我：账册与堤，先信哪个。未答。", "他抽出四十年那一捆，最薄，只有几张。", "五月初七，县丞口谕：西堤核销，照府核数一千三百八十两造册。末页贴补，册首孙某经手名刮去。廿八日，戌字七号登缴销。", "六月十三日凌晨，沈默核出差额，至库房。", "六月十三晓，取戌字七号入柜。", "六月二十，沈默私补东村五户，越例。划之。", "最底下压着一张单子，不是底稿，是一张分派单：", "嘉靖四十年五月起，府准县留堤工余平。户房司吏、书手，每名月加册费三钱。", "底下一排名字。第二个是：书手沈默。", "他坐在地上，背靠着柜子。", "油灯的火苗很小，照着满地摊开的纸。三十年，一年一捆，每一捆里都是真话。", "没有一张出过这间屋子。", "他想起自己床底下那只木匣，想起褡裢里那几张竹纸：点夫一百四十二名，险报交驿，驿簿有记。", "他再坐了一会儿。", "然后他从怀里摸出一叠空白的竹纸，蘸了随身带来的墨。", "他开始誊。", "孙书办那两页，一个字一个字誊。四十年五月那几行，一个字一个字誊。", "三十五年那一行，连“未与闻”那三个字，也誊了。册费分派单，誊了，连他自己的名字。", "他誊得很快。进衙门五年，他别的本事没有，誊得又快又准，一个字不错。", "外头不知什么时候起了风。窗纸发白了。", "五更的梆子刚过，院子里有了脚步声。", "不是一个人。好几个人，踩在青砖上，还有封条纸被风吹得哗啦哗啦响。", "沈默的手停了。", "小屋的门被推开了。进来的不是郑典史，是余司吏。", "他披着一件旧夹袄，头发没梳，像是一夜没睡。他看了一眼满地的纸，又看了一眼沈默手里那叠竹纸。", "“后门。”他压低了声音，“从库房那边绕出去。”", "“余先生——”", "“走。”", "余司吏蹲下来，把地上的纸一捆一捆往柜子里塞。塞得很乱。他把油灯拿起来，端在自己手里。", "沈默把那叠竹纸塞进怀里，从后门出去，贴着库房的墙，绕到廊下。", "他刚站定，郑典史就带着人进了院子。", "户房后头小屋的灯还亮着。郑典史停住了脚。", "“谁在里头？”", "余司吏端着灯，从小屋里走出来。", "“郑老爷。”", "郑典史看了看他，又看了看他身后那只敞着门的柜子。", "“余先生，天没亮，开柜子做什么？”", "“柜子是我的，里头的东西是我收的。”余司吏说，“府里的人来之前，我自己理一理。”", "“府文昨日就到了。”郑典史说，“户房的柜子，一律封存候勘。封存之前私开，按例要问。”", "“我开的。”余司吏说，“问我。”", "郑典史站了一会儿。院子里的风把封条吹得卷起来，差役用手按着。", "“余先生，”他说，“得罪了。”", "他朝差役摆了摆手。两个差役上前，一左一右站在余司吏身边，没有架他。另外两个进了小屋，把柜门合上，横竖贴了两道封条，盖了县印。", "满柜子的纸，又都关回去了。", "余司吏被带着往外走，走到廊下，经过沈默身边。", "沈默站在廊柱旁边，像是刚来上差。", "余司吏没有停，也没有看他。走过去的那一步，他的嘴唇动了一下，声音很低，低得只有他们两个人听得见：", "“我这辈子的纸，没一张出过这个门。”"], "recap": "三十四户张家佃户写进赈册，都是“无主贫户”，邱家孙子领到了米，朝沈默作了个揖。宋家的田界，他批了“俟秋后会勘”。张家送来船单：实运四百二十方。验收簿在余司吏那里。余司吏说，被拆的两页是孙书办的字，他腊月就知道中段不实，没报；二十六年孙书办替他扛下，说他往上走，往后还能替人再改一回。“我往上走了，没有再改过。”他留下柜子的钥匙。"}, {"n": 17, "cn": "十七", "title": "寄出", "era": "", "chars": 2360, "mins": 6, "html": "<p data-p=\"0\">府里委的勘官，在县里住了两日。<\/p>\n<p data-p=\"1\">头一日，在二堂听<b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>讲灾情，吃了一顿饭。第二日，上西门城楼，往西乡那边看了一阵，说了一句“水势已退，安辑为要”，又吃了一顿饭。<\/p>\n<p data-p=\"2\">户房后头那只柜子上的封条，他没有看。<\/p>\n<p data-p=\"3\">第三日一早，他带着吴县丞写好的详文，回府里去了。<\/p>\n<p data-p=\"4\"><b class=\"rn\" data-c=\"yusili\">余司吏<\/b>停了差，在家里候着。擅开官柜那一条，吴县丞还没批，就那么压着。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"5\">往后十来天，<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>每日在户房核灾损的账。淹田多少亩，倒屋多少间，赈了多少米，一样一样，核得清清楚楚。这本账，是县里报省的详文要用的。<\/p>\n<p data-p=\"6\">详文定在八月十六日封发。<\/p>\n<p data-p=\"7\">八月十五那天傍晚，他收拾好案头，回家了。<\/p>\n<p data-p=\"8\">那天夜里，他把床底下的木匣拖出来，开了锁，把里头的东西一样一样摆在桌上。<\/p>\n<p data-p=\"9\"><b class=\"rn\" data-c=\"heshi\">何氏<\/b>在旁边缝<b class=\"rn\" data-c=\"ahe\">阿禾<\/b>的冬衣。手边那一摞鞋底，比上个月高了一截。<\/p>\n<p data-p=\"10\">她看了一眼，没有问。<\/p>\n<p data-p=\"11\">他像核一本账那样，把它们一样一样看过去。<\/p>\n<p data-p=\"12\"><b class=\"rn\" data-c=\"qiulaohan\">邱老汉<\/b>的呈子。<b class=\"rn\" data-c=\"laozhou\">老宋<\/b>的禀帖。三十五年那张单子。<b class=\"rn\" data-c=\"fengsi\">冯四<\/b>那张烂纸。张家的船单。<\/p>\n<p data-p=\"13\">邱老汉死在土地庙里。老宋那半亩，是他按下的。余司吏在家里候着。明年开春，堤还要修，册子上还会是一千三百八十两。<\/p>\n<p data-p=\"14\">另一头，是他的差事，家里一份进项，阿禾的书。<\/p>\n<p data-p=\"15\">他把两头摆在一起，算了很久。<\/p>\n<p data-p=\"16\">这数，过不去。<\/p>\n<p data-p=\"17\">他铺开一张纸，写了一行题目：为西堤决口前后诸事，据实陈明。<\/p>\n<p data-p=\"18\">底下，他先写了四个字：可证之事。<\/p>\n<p data-p=\"19\">一，西堤嘉靖四十年核销册，原额七百两，末页贴补作一千三百八十两。册现封存在县，可调验。<\/p>\n<p data-p=\"20\">二，三十九年腊月中段石料，核销册载七百二十方；张宅船单载实运四百二十方；领工王某供称到堤四百出头。三者可对。<\/p>\n<p data-p=\"21\">三，六月十二日，西乡民宋某递禀，报西堤堤脚塌陷，户房收讫，未即转呈。<\/p>\n<p data-p=\"22\">四，六月十二、十三两夜一更，承发房差役冯四“奉县丞口谕”出城往西堤调夫。西门门簿有记。十三日二更，西堤守夫尽数调往东埠头官仓。同夜三更，中段决口。<\/p>\n<p data-p=\"23\">五，十三日一更二点，典史险报交驿，驿簿有记。<\/p>\n<p data-p=\"24\">他写到第三条，把灯芯往上挑了挑。<\/p>\n<p data-p=\"25\">“户房收讫，未即转呈”后头，他添了一行：<\/p>\n<p class=\"chao\" data-p=\"26\">经手书办沈默之失。<\/p>\n<p data-p=\"27\">又在第一条后头添了一行：嘉靖三十五年西堤中段抢修，亦作一千三百八十两，不入册。其临时核销单，誊录者，书手沈默。<\/p>\n<p data-p=\"28\">余司吏的底稿上，这一行后头，还有三个字：未与闻。<\/p>\n<p data-p=\"29\">他没有抄。<\/p>\n<p data-p=\"30\">何氏的针停了。<\/p>\n<p data-p=\"31\">“你写的这个，”她说，“会连累家里吗？”<\/p>\n<p data-p=\"32\">这是她嫁过来这些年，头一回问衙门里的事。<\/p>\n<p data-p=\"33\">“会。”<\/p>\n<p data-p=\"34\">他想起土地庙门口那张缺腿的桌子。三文钱一张。<\/p>\n<p data-p=\"35\">他又想起余司吏那一柜子的纸。<\/p>\n<p data-p=\"36\">还有吴县丞抽屉里那张老宋的禀帖。<\/p>\n<p data-p=\"37\">何氏没有再问。她把线头咬断，又穿了一根，针又动起来了。<\/p>\n<p data-p=\"38\">“阿禾的束脩，”她说，“我前日交了。”<\/p>\n<p data-p=\"39\">可证之事写完，他另起一行，写：未能证实之事。<\/p>\n<p data-p=\"40\">一，中段堤脚决口前有新翻泥土，锹印齐整，领工王某称非其人所为。何人所掘，未知。<\/p>\n<p data-p=\"41\">二，差役冯四所奉“县丞口谕”，县丞亲口言未曾交代。此口谕出自何人，未知。冯四已溺毙。<\/p>\n<p data-p=\"42\">三，冯四身后遗纸一张，残存“西堤”“不必入册”等字，无日月、无落款、无印押。<\/p>\n<p data-p=\"43\">四，乡间有毁堤淹田之说。所闻如此，未能证实。<\/p>\n<p data-p=\"44\">末尾那一句，他提着笔，停了一下。<\/p>\n<p data-p=\"45\">写的是：伏乞察核。<\/p>\n<p data-p=\"46\">木匣里，还有一叠竹纸，是那一夜在余司吏柜子前头誊的。<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>那两页，县丞五月那道口谕，余司吏自己记下的贴补、刮名、缴销，一行一行，誊得一字不差。<\/p>\n<p data-p=\"47\">有了这一叠，“可证之事”能多出三条，最硬的三条。<\/p>\n<p data-p=\"48\">他把那一叠拿起来，在手里掂了掂。<\/p>\n<p data-p=\"49\">然后他放回了木匣里，压在最底下。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"50\">第二日，他告了半日假，出西门，去了东村。<\/p>\n<p data-p=\"51\">宋家的屋顶补了一半，另一半盖着稻草。<\/p>\n<p data-p=\"52\"><b class=\"rn\" data-c=\"ayun\">阿芸<\/b>在门前的空地上晒稻草。看见他，她停了手。<\/p>\n<p data-p=\"53\">“十二日夜里，”沈默说，“我听你爹说过，你那天夜里从城里回家，走的是堤上。”<\/p>\n<p data-p=\"54\">阿芸把手里那捆稻草放下了。<\/p>\n<p data-p=\"55\">“你看见什么了？”<\/p>\n<p data-p=\"56\">阿芸看着他，又往村口那条去张家的路上看了一眼。<\/p>\n<p data-p=\"57\">“中段有灯。”她说，“有几个人，在堤脚底下挖。不是王领工的人，说话不是我们这边的口音。”<\/p>\n<p data-p=\"58\">“你肯画押吗？”<\/p>\n<p data-p=\"59\">“不肯。”<\/p>\n<p data-p=\"60\">她说得很快，像是早就想好了。<\/p>\n<p data-p=\"61\">“我家押着张家的田。”她说，“押了一亩。秋后还不上，那一亩就是张家的。”<\/p>\n<p data-p=\"62\">她弯下腰，把一捆稻草翻过来。<\/p>\n<p data-p=\"63\">“田界那半亩，你按下了。”她说，“剩下的，我得留着。”<\/p>\n<p data-p=\"64\">沈默站在那里，没有再问。<\/p>\n<p data-p=\"65\">回城的路上，他在“未能证实之事”第一条后头，添了一句：有乡民言，六月十二夜见中段堤脚有数人掘土，外乡口音。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"66\">那天夜里，他把呈子封进一个油纸包，在封皮上写：呈浙江按察司。<\/p>\n<p data-p=\"67\">驿站还是那个驿站。马棚里两匹马，一匹前腿的布拆了，能走了。<\/p>\n<p data-p=\"68\"><b class=\"rn\" data-c=\"linyicheng\">祝驿丞<\/b>正在给一只公文袋封口，见他进来，手停了。<\/p>\n<p data-p=\"69\">“沈书办。”<\/p>\n<p data-p=\"70\">沈默把那个封好的油纸包放在桌上。<\/p>\n<p data-p=\"71\">祝驿丞看了看封皮，没有伸手。<\/p>\n<p data-p=\"72\">“私书走驿，按例是不许的。”<\/p>\n<p data-p=\"73\">“驿上替人捎的私书，十封里头有几封？”<\/p>\n<p data-p=\"74\">祝驿丞没答。他把桌上那只公文袋往前推了推。<\/p>\n<p data-p=\"75\">“县里今日也有一封往省里去。”他用指头点了点封皮，“为西乡灾后安辑事。”<\/p>\n<p data-p=\"76\">他把沈默的油纸包，和那只公文袋，并排放在桌上。<\/p>\n<p data-p=\"77\">一封报安辑。一封报西堤有人动过。<\/p>\n<p data-p=\"78\">“都往省里去。”祝驿丞说，“一个袋子装着。”<\/p>\n<p data-p=\"79\">他把那两样东西摆正，边角对齐。<\/p>\n<p data-p=\"80\">“沈书办，”他说，“若你是我，你送哪一封？”<\/p>\n<p data-p=\"81\">沈默没有答。<\/p>\n<p data-p=\"82\">六月十三那一夜，这张桌上也是这样摆着两样东西。他记得那一封险报，压在桌上，一直压到五更。<\/p>\n<p data-p=\"83\">祝驿丞也记得。<\/p>\n<p data-p=\"84\">“我都送。”祝驿丞说。<\/p>\n<p data-p=\"85\">他把油纸包塞进公文袋，封了口，然后翻开驿簿，蘸了墨。<\/p>\n<p data-p=\"86\">“簿子上，”他说，“两封都得记。”<\/p>\n<p data-p=\"87\">他写：八月十六日，县详文一封；户房书办沈默私书一封，呈按察司。附驿。<\/p>\n<p data-p=\"88\">他把簿子转过来，给沈默看。<\/p>\n<p data-p=\"89\">沈默看着那一行，等墨干了，才走。<\/p>\n<p data-p=\"90\">从驿站出来，雨停了很久了。<\/p>\n<p data-p=\"91\">天上的月亮，比昨夜还圆一些。<\/p>\n<p data-p=\"92\">他走得很快。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"93\">第二日一早，他到衙门，<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>站在大门口，像是在等人。<\/p>\n<p data-p=\"94\">“沈书办。”<\/p>\n<p data-p=\"95\">沈默站住了。<\/p>\n<p data-p=\"96\">“你寄往按察司的，”郑典史说，“驿簿上有了。”<\/p>\n<p data-p=\"97\">沈默站在台阶下，没有往上走。<\/p>\n<p data-p=\"98\">“驿簿每日送承发房，我照例看。”郑典史说，“驿马前夜就出了县界。县丞老爷看过驿簿了。”<\/p>\n<p data-p=\"99\">“县丞老爷怎么说？”<\/p>\n<p data-p=\"100\">郑典史看了他一会儿。<\/p>\n<p data-p=\"101\">“他说，让他寄。”<\/p>", "paras": ["府里委的勘官，在县里住了两日。", "头一日，在二堂听吴县丞讲灾情，吃了一顿饭。第二日，上西门城楼，往西乡那边看了一阵，说了一句“水势已退，安辑为要”，又吃了一顿饭。", "户房后头那只柜子上的封条，他没有看。", "第三日一早，他带着吴县丞写好的详文，回府里去了。", "余司吏停了差，在家里候着。擅开官柜那一条，吴县丞还没批，就那么压着。", "往后十来天，沈默每日在户房核灾损的账。淹田多少亩，倒屋多少间，赈了多少米，一样一样，核得清清楚楚。这本账，是县里报省的详文要用的。", "详文定在八月十六日封发。", "八月十五那天傍晚，他收拾好案头，回家了。", "那天夜里，他把床底下的木匣拖出来，开了锁，把里头的东西一样一样摆在桌上。", "何氏在旁边缝阿禾的冬衣。手边那一摞鞋底，比上个月高了一截。", "她看了一眼，没有问。", "他像核一本账那样，把它们一样一样看过去。", "邱老汉的呈子。老宋的禀帖。三十五年那张单子。冯四那张烂纸。张家的船单。", "邱老汉死在土地庙里。老宋那半亩，是他按下的。余司吏在家里候着。明年开春，堤还要修，册子上还会是一千三百八十两。", "另一头，是他的差事，家里一份进项，阿禾的书。", "他把两头摆在一起，算了很久。", "这数，过不去。", "他铺开一张纸，写了一行题目：为西堤决口前后诸事，据实陈明。", "底下，他先写了四个字：可证之事。", "一，西堤嘉靖四十年核销册，原额七百两，末页贴补作一千三百八十两。册现封存在县，可调验。", "二，三十九年腊月中段石料，核销册载七百二十方；张宅船单载实运四百二十方；领工王某供称到堤四百出头。三者可对。", "三，六月十二日，西乡民宋某递禀，报西堤堤脚塌陷，户房收讫，未即转呈。", "四，六月十二、十三两夜一更，承发房差役冯四“奉县丞口谕”出城往西堤调夫。西门门簿有记。十三日二更，西堤守夫尽数调往东埠头官仓。同夜三更，中段决口。", "五，十三日一更二点，典史险报交驿，驿簿有记。", "他写到第三条，把灯芯往上挑了挑。", "“户房收讫，未即转呈”后头，他添了一行：", "经手书办沈默之失。", "又在第一条后头添了一行：嘉靖三十五年西堤中段抢修，亦作一千三百八十两，不入册。其临时核销单，誊录者，书手沈默。", "余司吏的底稿上，这一行后头，还有三个字：未与闻。", "他没有抄。", "何氏的针停了。", "“你写的这个，”她说，“会连累家里吗？”", "这是她嫁过来这些年，头一回问衙门里的事。", "“会。”", "他想起土地庙门口那张缺腿的桌子。三文钱一张。", "他又想起余司吏那一柜子的纸。", "还有吴县丞抽屉里那张老宋的禀帖。", "何氏没有再问。她把线头咬断，又穿了一根，针又动起来了。", "“阿禾的束脩，”她说，“我前日交了。”", "可证之事写完，他另起一行，写：未能证实之事。", "一，中段堤脚决口前有新翻泥土，锹印齐整，领工王某称非其人所为。何人所掘，未知。", "二，差役冯四所奉“县丞口谕”，县丞亲口言未曾交代。此口谕出自何人，未知。冯四已溺毙。", "三，冯四身后遗纸一张，残存“西堤”“不必入册”等字，无日月、无落款、无印押。", "四，乡间有毁堤淹田之说。所闻如此，未能证实。", "末尾那一句，他提着笔，停了一下。", "写的是：伏乞察核。", "木匣里，还有一叠竹纸，是那一夜在余司吏柜子前头誊的。孙书办那两页，县丞五月那道口谕，余司吏自己记下的贴补、刮名、缴销，一行一行，誊得一字不差。", "有了这一叠，“可证之事”能多出三条，最硬的三条。", "他把那一叠拿起来，在手里掂了掂。", "然后他放回了木匣里，压在最底下。", "第二日，他告了半日假，出西门，去了东村。", "宋家的屋顶补了一半，另一半盖着稻草。", "阿芸在门前的空地上晒稻草。看见他，她停了手。", "“十二日夜里，”沈默说，“我听你爹说过，你那天夜里从城里回家，走的是堤上。”", "阿芸把手里那捆稻草放下了。", "“你看见什么了？”", "阿芸看着他，又往村口那条去张家的路上看了一眼。", "“中段有灯。”她说，“有几个人，在堤脚底下挖。不是王领工的人，说话不是我们这边的口音。”", "“你肯画押吗？”", "“不肯。”", "她说得很快，像是早就想好了。", "“我家押着张家的田。”她说，“押了一亩。秋后还不上，那一亩就是张家的。”", "她弯下腰，把一捆稻草翻过来。", "“田界那半亩，你按下了。”她说，“剩下的，我得留着。”", "沈默站在那里，没有再问。", "回城的路上，他在“未能证实之事”第一条后头，添了一句：有乡民言，六月十二夜见中段堤脚有数人掘土，外乡口音。", "那天夜里，他把呈子封进一个油纸包，在封皮上写：呈浙江按察司。", "驿站还是那个驿站。马棚里两匹马，一匹前腿的布拆了，能走了。", "祝驿丞正在给一只公文袋封口，见他进来，手停了。", "“沈书办。”", "沈默把那个封好的油纸包放在桌上。", "祝驿丞看了看封皮，没有伸手。", "“私书走驿，按例是不许的。”", "“驿上替人捎的私书，十封里头有几封？”", "祝驿丞没答。他把桌上那只公文袋往前推了推。", "“县里今日也有一封往省里去。”他用指头点了点封皮，“为西乡灾后安辑事。”", "他把沈默的油纸包，和那只公文袋，并排放在桌上。", "一封报安辑。一封报西堤有人动过。", "“都往省里去。”祝驿丞说，“一个袋子装着。”", "他把那两样东西摆正，边角对齐。", "“沈书办，”他说，“若你是我，你送哪一封？”", "沈默没有答。", "六月十三那一夜，这张桌上也是这样摆着两样东西。他记得那一封险报，压在桌上，一直压到五更。", "祝驿丞也记得。", "“我都送。”祝驿丞说。", "他把油纸包塞进公文袋，封了口，然后翻开驿簿，蘸了墨。", "“簿子上，”他说，“两封都得记。”", "他写：八月十六日，县详文一封；户房书办沈默私书一封，呈按察司。附驿。", "他把簿子转过来，给沈默看。", "沈默看着那一行，等墨干了，才走。", "从驿站出来，雨停了很久了。", "天上的月亮，比昨夜还圆一些。", "他走得很快。", "第二日一早，他到衙门，郑典史站在大门口，像是在等人。", "“沈书办。”", "沈默站住了。", "“你寄往按察司的，”郑典史说，“驿簿上有了。”", "沈默站在台阶下，没有往上走。", "“驿簿每日送承发房，我照例看。”郑典史说，“驿马前夜就出了县界。县丞老爷看过驿簿了。”", "“县丞老爷怎么说？”", "郑典史看了他一会儿。", "“他说，让他寄。”"], "recap": "三更，沈默打开余司吏的柜子：一年一捆，三十年的底稿，哪一笔照谁的意思做的，都记着。孙书办那两页：料石实到四百二十方，未敢验收。四十年五月初七，县丞口谕，照府核数造册，末页贴补，刮名。他连夜誊下。五更，郑典史带人来封柜，余司吏端着灯走出来：柜子是我的，问我。他对沈默说：我这辈子的纸，没一张出过这个门。"}, {"n": 18, "cn": "十八", "title": "等", "era": "", "chars": 1231, "mins": 4, "html": "<p data-p=\"0\">寄出去的第二日，什么都没有发生。<\/p>\n<p data-p=\"1\">第三日，第十日，也什么都没有发生。<\/p>\n<p data-p=\"2\"><b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>没有叫他去二堂。<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>在廊下碰见他，点一点头，走过去。<\/p>\n<p data-p=\"3\"><b class=\"rn\" data-c=\"yusili\">余司吏<\/b>还在家里候着，擅开官柜那一条，还压在吴县丞的案上，没批。<\/p>\n<p data-p=\"4\">衙门里，各房照常点卯，照常收帖，照常发签。<\/p>\n<p data-p=\"5\">西门外的粥厂撤了，土坡上的草棚拆了，西乡的人一家一家回了村，在泥里翻地，补种秋菜，等着种麦。<\/p>\n<p data-p=\"6\">整个县衙，没有一个人慌。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"7\">八月底，吴县丞批下来一张条子：灾后田界多有变动，户房重造西乡鱼鳞册。着书办<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>专办。<\/p>\n<p data-p=\"8\">重造鱼鳞册，一个人，要抄大半年。<\/p>\n<p data-p=\"9\">户房后头那间小屋，柜子已经封了，腾出一张案子来，给他抄册子。<\/p>\n<p data-p=\"10\">他从西乡一都抄起。一页一页，一格一格，田的形状描下来，户主的名字写上去。<\/p>\n<p data-p=\"11\">抄到三都，东村，他的笔停了。<\/p>\n<p data-p=\"12\">宋家那几块田，挨着张家那一块。新册要照现界誊录。现界，就是张家管事打下的那一排木桩。有争议的，旁边注两个字：待勘。<\/p>\n<p data-p=\"13\">他照着里长报上来的现界，蘸了墨，把那一条界线描下来。<\/p>\n<p data-p=\"14\">描到一半，他把笔提起来，蘸了一回墨。然后接着描完了。<\/p>\n<p data-p=\"15\">那一条线，比旧册上的，往宋家那边挪了二尺。<\/p>\n<p data-p=\"16\">旁边，他写：待勘。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"17\">九月初，<b class=\"rn\" data-c=\"laozhou\">老宋<\/b>来了一趟户房。<\/p>\n<p data-p=\"18\">是来税契的。乡里人典田押地，契要拿到户房来，盖一个印，交一笔契税，才算数。<\/p>\n<p data-p=\"19\">跟着来的是张家的账房。契上写着：东村宋某，今因灾后无食，将村前田一亩，押与张宅，借米二石。秋后本利不还，田归张宅管业。<\/p>\n<p data-p=\"20\">老宋站在案前，把契递上来。<\/p>\n<p data-p=\"21\">沈默接过来，把“借米二石”那一行看了两遍。<\/p>\n<p data-p=\"22\">“契税，”账房说，“张宅这边出。”<\/p>\n<p data-p=\"23\">沈默拿起印，盖在契尾。印泥是新调的，红得发亮。<\/p>\n<p data-p=\"24\">老宋把契收回去，叠好，揣进怀里。<\/p>\n<p data-p=\"25\">“先把今年过了。”他说。<\/p>\n<p data-p=\"26\">他没有看沈默，转身出去了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"27\"><b class=\"rn\" data-c=\"linyicheng\">祝驿丞<\/b>是在九月初八的夜里，看见那一行字的。<\/p>\n<p data-p=\"28\">那天傍晚下了一场急雨。从省城下来的马到驿站时，公文袋湿透了，滴着水。<\/p>\n<p data-p=\"29\">按例，湿了的公文要烘干再往下递。祝驿丞把公文袋拆开，一封一封取出来，摊在灶边的竹匾上，一封一封翻着烘。<\/p>\n<p data-p=\"30\">有一封，封套是好的，封面上一行楷字：浙江等处承宣布政使司，札付该县。封口压着朱红的大印，方方正正，比县里的印大出一圈。<\/p>\n<p data-p=\"31\">祝驿丞把它翻过来，又翻了回去。<\/p>\n<p data-p=\"32\">八月十六日那一封，寄的是按察司。<\/p>\n<p data-p=\"33\">封套泡透了，薄得发亮。<\/p>\n<p data-p=\"34\">他拿起来翻面的时候，正好对着灶火。<\/p>\n<p data-p=\"35\">火光从封套背后透过来，里头那张札付上的墨，一行一行，显出了影子。<\/p>\n<p data-p=\"36\">他没想看。他只是拿着它，没有马上放下。<\/p>\n<p data-p=\"37\">字是反的，又洇了。他认得出几个：<\/p>\n<p class=\"chao\" data-p=\"38\">……该县西堤既决，水势已成，不必再议。所据书办私书，发回该县，照常办理……<\/p>\n<p data-p=\"39\">祝驿丞把那封札子放回竹匾上，翻过面，让火烤另一边。<\/p>\n<p data-p=\"40\">他在灶边坐着，往灶里添了两回柴。<\/p>\n<p data-p=\"41\">灶火噼噼地响。竹匾上的公文，一封一封，慢慢干了，封套从透亮变回不透亮，什么也看不见了。<\/p>\n<p data-p=\"42\">天亮的时候，他把它们一封一封装回公文袋，封好口，交给马夫。<\/p>\n<p data-p=\"43\">他翻开驿簿，写：九月初九晨，省札若干件，雨湿，烘干转递。<\/p>\n<p data-p=\"44\">他没有往户房那边去。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"45\">九月十五，沈默还在小屋里抄鱼鳞册。<\/p>\n<p data-p=\"46\">抄到四都，郑典史那边的差役来了，站在门口。<\/p>\n<p data-p=\"47\">“沈书办，县丞老爷叫你去二堂。”<\/p>\n<p data-p=\"48\">“什么事？”<\/p>\n<p data-p=\"49\">“按察司的回文，”差役说，“到了。”<\/p>", "paras": ["寄出去的第二日，什么都没有发生。", "第三日，第十日，也什么都没有发生。", "吴县丞没有叫他去二堂。郑典史在廊下碰见他，点一点头，走过去。", "余司吏还在家里候着，擅开官柜那一条，还压在吴县丞的案上，没批。", "衙门里，各房照常点卯，照常收帖，照常发签。", "西门外的粥厂撤了，土坡上的草棚拆了，西乡的人一家一家回了村，在泥里翻地，补种秋菜，等着种麦。", "整个县衙，没有一个人慌。", "八月底，吴县丞批下来一张条子：灾后田界多有变动，户房重造西乡鱼鳞册。着书办沈默专办。", "重造鱼鳞册，一个人，要抄大半年。", "户房后头那间小屋，柜子已经封了，腾出一张案子来，给他抄册子。", "他从西乡一都抄起。一页一页，一格一格，田的形状描下来，户主的名字写上去。", "抄到三都，东村，他的笔停了。", "宋家那几块田，挨着张家那一块。新册要照现界誊录。现界，就是张家管事打下的那一排木桩。有争议的，旁边注两个字：待勘。", "他照着里长报上来的现界，蘸了墨，把那一条界线描下来。", "描到一半，他把笔提起来，蘸了一回墨。然后接着描完了。", "那一条线，比旧册上的，往宋家那边挪了二尺。", "旁边，他写：待勘。", "九月初，老宋来了一趟户房。", "是来税契的。乡里人典田押地，契要拿到户房来，盖一个印，交一笔契税，才算数。", "跟着来的是张家的账房。契上写着：东村宋某，今因灾后无食，将村前田一亩，押与张宅，借米二石。秋后本利不还，田归张宅管业。", "老宋站在案前，把契递上来。", "沈默接过来，把“借米二石”那一行看了两遍。", "“契税，”账房说，“张宅这边出。”", "沈默拿起印，盖在契尾。印泥是新调的，红得发亮。", "老宋把契收回去，叠好，揣进怀里。", "“先把今年过了。”他说。", "他没有看沈默，转身出去了。", "祝驿丞是在九月初八的夜里，看见那一行字的。", "那天傍晚下了一场急雨。从省城下来的马到驿站时，公文袋湿透了，滴着水。", "按例，湿了的公文要烘干再往下递。祝驿丞把公文袋拆开，一封一封取出来，摊在灶边的竹匾上，一封一封翻着烘。", "有一封，封套是好的，封面上一行楷字：浙江等处承宣布政使司，札付该县。封口压着朱红的大印，方方正正，比县里的印大出一圈。", "祝驿丞把它翻过来，又翻了回去。", "八月十六日那一封，寄的是按察司。", "封套泡透了，薄得发亮。", "他拿起来翻面的时候，正好对着灶火。", "火光从封套背后透过来，里头那张札付上的墨，一行一行，显出了影子。", "他没想看。他只是拿着它，没有马上放下。", "字是反的，又洇了。他认得出几个：", "……该县西堤既决，水势已成，不必再议。所据书办私书，发回该县，照常办理……", "祝驿丞把那封札子放回竹匾上，翻过面，让火烤另一边。", "他在灶边坐着，往灶里添了两回柴。", "灶火噼噼地响。竹匾上的公文，一封一封，慢慢干了，封套从透亮变回不透亮，什么也看不见了。", "天亮的时候，他把它们一封一封装回公文袋，封好口，交给马夫。", "他翻开驿簿，写：九月初九晨，省札若干件，雨湿，烘干转递。", "他没有往户房那边去。", "九月十五，沈默还在小屋里抄鱼鳞册。", "抄到四都，郑典史那边的差役来了，站在门口。", "“沈书办，县丞老爷叫你去二堂。”", "“什么事？”", "“按察司的回文，”差役说，“到了。”"], "recap": "勘官住了两日，看了城楼，吃了两顿饭，回府了。八月十五夜，沈默写成呈文：可证之事五条，未能证实之事四条，其中一条是他自己收了禀帖未报。何氏头一回问：会连累家里吗？他说：会。誊来的那一叠，他放回了木匣。阿芸说出那夜在堤上看见有人挖土，不肯画押。八月十六日，祝驿丞把私书和县里的详文装进同一个袋子：我都送。第二日，郑典史说：县丞老爷说，让他寄。"}, {"n": 19, "cn": "十九", "title": "批回", "era": "", "chars": 1767, "mins": 5, "html": "<p data-p=\"0\">二堂里只点了一盏灯。<\/p>\n<p data-p=\"1\"><b class=\"rn\" data-c=\"wuxiancheng\">吴县丞<\/b>坐在案后，案上摊着两样东西：一封拆开的公文，一个油纸包。油纸包他认得，封皮上是他自己的字：呈浙江按察司。<\/p>\n<p data-p=\"2\">从八月十六日寄出，到今日，不满一个月。<\/p>\n<p data-p=\"3\">他原以为，要等到年底。<\/p>\n<p data-p=\"4\">原样退回来了。<\/p>\n<p data-p=\"5\">“坐。”吴县丞说。<\/p>\n<p data-p=\"6\">这是他头一回在二堂里被让坐。<\/p>\n<p data-p=\"7\">吴县丞把那封公文推过来。<\/p>\n<p data-p=\"8\">按察司的批，只有几行：<\/p>\n<p class=\"chao\" data-p=\"9\">据该县户房书办私书一件，所陈西堤决口事。<\/p>\n<p class=\"chao\" data-p=\"10\">查近来民间多有毁堤淹田之说，殊无实据。<\/p>\n<p class=\"chao\" data-p=\"11\">着该县查明灾情，安辑流民，毋使讹言惑众。原呈发回该县，照常办理。<\/p>\n<p data-p=\"12\"><b class=\"rn\" data-c=\"shenmo\">沈默<\/b>把它看了三遍。<\/p>\n<p data-p=\"13\">他写了五条可证之事：贴补的核销册，对不上的料石，收讫的禀帖，门簿上的口谕，驿簿上的时辰。批里一条也没有提。<\/p>\n<p data-p=\"14\">批里提的，只有他写在最后、写着“所闻如此，未能证实”的那一句。<\/p>\n<p data-p=\"15\">“你写的，”吴县丞说，“我都看了。”<\/p>\n<p data-p=\"16\">他把油纸包打开，抽出那几页纸，翻到“可证之事”。<\/p>\n<p data-p=\"17\">“五条，条条都对。”<\/p>\n<p data-p=\"18\">沈默抬起头。<\/p>\n<p data-p=\"19\">“核销册是贴过的，料石是不够的，禀帖是你收了没报的，门簿上是那么记的。”吴县丞说，“都对。”<\/p>\n<p data-p=\"20\">他把那几页纸放下。<\/p>\n<p data-p=\"21\">“可上头要回的，只有这一句。”<\/p>\n<p data-p=\"22\">窗外有风，吹得灯火歪了一下。<\/p>\n<p data-p=\"23\">“那一夜的口谕，”沈默说，“到底是谁的？”<\/p>\n<p data-p=\"24\">吴县丞没有答。他把茶盏转了半圈，又转了回来。<\/p>\n<p data-p=\"25\">“那一夜，我在府里。”他说，“后半夜，府城也下着雨。我坐在驿馆里，听着雨，一夜没睡。”<\/p>\n<p data-p=\"26\">“十四日回来，我上了西门城楼。水贴着城墙，到第三块砖，停了。”<\/p>\n<p data-p=\"27\">他看着沈默。<\/p>\n<p data-p=\"28\">“城里，一滴水也没进。”<\/p>\n<p data-p=\"29\">这话他说得很慢，像是说给沈默听，也像是说给自己听。<\/p>\n<p data-p=\"30\">“县里要结案。”吴县丞说，“你写一张具结：所呈系灾后传闻，未经查实。”<\/p>\n<p data-p=\"31\">沈默没有动。<\/p>\n<p data-p=\"32\">“<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>擅开官柜那一条，”吴县丞说，“县里拟的是免议。批的是：柜中所存，与本案无涉，查无实据。”<\/p>\n<p data-p=\"33\">他把一张空白的具结纸推过来。<\/p>\n<p data-p=\"34\">“你这一张若是实据，”他说，“柜子里的东西，就和本案有涉了。”<\/p>\n<p data-p=\"35\">沈默看着那张空白的纸。<\/p>\n<p data-p=\"36\">“具了结，这件事到你这里，就算了了。”吴县丞说。<\/p>\n<p data-p=\"37\">他把那张空白的具结纸，往沈默面前又推了一寸。<\/p>\n<p data-p=\"38\">“我做知县那年，没有人叫我具结。”<\/p>\n<p data-p=\"39\">沈默拿起笔。<\/p>\n<p data-p=\"40\">具结人户房书办沈默，今蒙发回所呈私书一件。所呈系灾后传闻，未经查实，并无确据。所具是实。<\/p>\n<p data-p=\"41\">他写完，落了名字，画了押。<\/p>\n<p data-p=\"42\">吴县丞把具结收起来，压在案头。<\/p>\n<p data-p=\"43\">“回去吧。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"44\">第二日，<b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>挨了打。<\/p>\n<p data-p=\"45\">是在衙门后院打的。<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>站在一边，差役数着数，二十板。打完，判了追赔料石银二十两，限一年交清。<\/p>\n<p data-p=\"46\">沈默在户房里，隔着两道墙，听得见板子落下去的声音。一下，一下，很有间隔。<\/p>\n<p data-p=\"47\">王老实被架出来的时候，脸是白的，脚拖在地上。经过户房门口，他抬起头，看见了沈默。<\/p>\n<p data-p=\"48\">“沈书办，”他说，喘着气，几乎是松了一口气，“打完了，就算过去了。”<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"49\">同一日下午，余司吏回了户房。<\/p>\n<p data-p=\"50\">他还是那件旧夹袄，进门，在自己那张案子后头坐下，把案上的灰拂了拂，翻开一本没核完的账。<\/p>\n<p data-p=\"51\">不像是一个多月没来，只是告了几日假。<\/p>\n<p data-p=\"52\">傍晚，<b class=\"rn\" data-c=\"sunjiahaizi\">孙书办的儿子<\/b>来了，站在门口，不进来，只朝余司吏作了个揖。<\/p>\n<p data-p=\"53\">“余伯伯，”他说，“我爹没了。初十夜里。”<\/p>\n<p data-p=\"54\">余司吏的笔停了。<\/p>\n<p data-p=\"55\">“走得安静吗？”<\/p>\n<p data-p=\"56\">“安静。”孩子说，“咳了一夜，天亮前睡着了，就没醒。”<\/p>\n<p data-p=\"57\">余司吏点了点头。<\/p>\n<p data-p=\"58\">孩子又作了个揖，走了。<\/p>\n<p data-p=\"59\">户房里很静。沈默看着余司吏的背。余司吏没有回头，也没有咳。<\/p>\n<p data-p=\"60\">“你早知道？”沈默问。<\/p>\n<p data-p=\"61\">他没说早知道什么。<\/p>\n<p data-p=\"62\">余司吏翻了一页账，拿起笔，接着往下核。<\/p>\n<p data-p=\"63\">他没有答。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"64\">那天夜里，吴县丞叫人送来一份结案的稿子，让户房誊正，明日一早用印。<\/p>\n<p data-p=\"65\">沈默点上灯，铺开纸。<\/p>\n<p data-p=\"66\">查西堤中段决口，系连日霪雨，水势骤涨，堤身冲刷所致。领工王某虚报工数，挪卖料石，已杖责追赔。西乡被水各户，已经勘实赈济，安辑如常。民间所传毁堤淹田之说，查无故意毁堤之实。<\/p>\n<p data-p=\"67\">他一个字一个字地誊。<\/p>\n<p data-p=\"68\">誊得很快，很准，一个字不错。<\/p>\n<p data-p=\"69\">誊完，他从头到尾又看了一遍，看到最后一句。<\/p>\n<p data-p=\"70\">查无故意毁堤之实。<\/p>\n<p data-p=\"71\">第二日一早，他把誊好的结案送到二堂。<\/p>\n<p data-p=\"72\">结案三页。吴县丞看了第一页，翻到第三页，在末尾落了款，用了印。<\/p>\n<p data-p=\"73\">中间那一页，他没有翻。<\/p>\n<p data-p=\"74\">他把结案推到一边，拉开抽屉，从里头取出一样东西，放在沈默面前。<\/p>\n<p data-p=\"75\">是那张禀帖。纸边烂了，右下角那枚印，朱红的：户房收讫。<\/p>\n<p data-p=\"76\">旁边是他自己的字：六月十二日，西乡民宋某具。<\/p>\n<p data-p=\"77\">“收着吧。”吴县丞说。<\/p>\n<p data-p=\"78\">他回到户房，把结案的底稿放进今年那一捆底单里，用麻绳扎好，在竹牌上写：嘉靖四十年。<\/p>\n<p data-p=\"79\">底稿末尾，誊录那一栏，是他的名字。<\/p>\n<p data-p=\"80\">字写得很稳。<\/p>\n<p data-p=\"81\">嘉靖三十五年那张单子上的字，写得太用力。<\/p>\n<p data-p=\"82\">今年这一张，一笔都没有用力。<\/p>", "paras": ["二堂里只点了一盏灯。", "吴县丞坐在案后，案上摊着两样东西：一封拆开的公文，一个油纸包。油纸包他认得，封皮上是他自己的字：呈浙江按察司。", "从八月十六日寄出，到今日，不满一个月。", "他原以为，要等到年底。", "原样退回来了。", "“坐。”吴县丞说。", "这是他头一回在二堂里被让坐。", "吴县丞把那封公文推过来。", "按察司的批，只有几行：", "据该县户房书办私书一件，所陈西堤决口事。", "查近来民间多有毁堤淹田之说，殊无实据。", "着该县查明灾情，安辑流民，毋使讹言惑众。原呈发回该县，照常办理。", "沈默把它看了三遍。", "他写了五条可证之事：贴补的核销册，对不上的料石，收讫的禀帖，门簿上的口谕，驿簿上的时辰。批里一条也没有提。", "批里提的，只有他写在最后、写着“所闻如此，未能证实”的那一句。", "“你写的，”吴县丞说，“我都看了。”", "他把油纸包打开，抽出那几页纸，翻到“可证之事”。", "“五条，条条都对。”", "沈默抬起头。", "“核销册是贴过的，料石是不够的，禀帖是你收了没报的，门簿上是那么记的。”吴县丞说，“都对。”", "他把那几页纸放下。", "“可上头要回的，只有这一句。”", "窗外有风，吹得灯火歪了一下。", "“那一夜的口谕，”沈默说，“到底是谁的？”", "吴县丞没有答。他把茶盏转了半圈，又转了回来。", "“那一夜，我在府里。”他说，“后半夜，府城也下着雨。我坐在驿馆里，听着雨，一夜没睡。”", "“十四日回来，我上了西门城楼。水贴着城墙，到第三块砖，停了。”", "他看着沈默。", "“城里，一滴水也没进。”", "这话他说得很慢，像是说给沈默听，也像是说给自己听。", "“县里要结案。”吴县丞说，“你写一张具结：所呈系灾后传闻，未经查实。”", "沈默没有动。", "“余司吏擅开官柜那一条，”吴县丞说，“县里拟的是免议。批的是：柜中所存，与本案无涉，查无实据。”", "他把一张空白的具结纸推过来。", "“你这一张若是实据，”他说，“柜子里的东西，就和本案有涉了。”", "沈默看着那张空白的纸。", "“具了结，这件事到你这里，就算了了。”吴县丞说。", "他把那张空白的具结纸，往沈默面前又推了一寸。", "“我做知县那年，没有人叫我具结。”", "沈默拿起笔。", "具结人户房书办沈默，今蒙发回所呈私书一件。所呈系灾后传闻，未经查实，并无确据。所具是实。", "他写完，落了名字，画了押。", "吴县丞把具结收起来，压在案头。", "“回去吧。”", "第二日，王老实挨了打。", "是在衙门后院打的。郑典史站在一边，差役数着数，二十板。打完，判了追赔料石银二十两，限一年交清。", "沈默在户房里，隔着两道墙，听得见板子落下去的声音。一下，一下，很有间隔。", "王老实被架出来的时候，脸是白的，脚拖在地上。经过户房门口，他抬起头，看见了沈默。", "“沈书办，”他说，喘着气，几乎是松了一口气，“打完了，就算过去了。”", "同一日下午，余司吏回了户房。", "他还是那件旧夹袄，进门，在自己那张案子后头坐下，把案上的灰拂了拂，翻开一本没核完的账。", "不像是一个多月没来，只是告了几日假。", "傍晚，孙书办的儿子来了，站在门口，不进来，只朝余司吏作了个揖。", "“余伯伯，”他说，“我爹没了。初十夜里。”", "余司吏的笔停了。", "“走得安静吗？”", "“安静。”孩子说，“咳了一夜，天亮前睡着了，就没醒。”", "余司吏点了点头。", "孩子又作了个揖，走了。", "户房里很静。沈默看着余司吏的背。余司吏没有回头，也没有咳。", "“你早知道？”沈默问。", "他没说早知道什么。", "余司吏翻了一页账，拿起笔，接着往下核。", "他没有答。", "那天夜里，吴县丞叫人送来一份结案的稿子，让户房誊正，明日一早用印。", "沈默点上灯，铺开纸。", "查西堤中段决口，系连日霪雨，水势骤涨，堤身冲刷所致。领工王某虚报工数，挪卖料石，已杖责追赔。西乡被水各户，已经勘实赈济，安辑如常。民间所传毁堤淹田之说，查无故意毁堤之实。", "他一个字一个字地誊。", "誊得很快，很准，一个字不错。", "誊完，他从头到尾又看了一遍，看到最后一句。", "查无故意毁堤之实。", "第二日一早，他把誊好的结案送到二堂。", "结案三页。吴县丞看了第一页，翻到第三页，在末尾落了款，用了印。", "中间那一页，他没有翻。", "他把结案推到一边，拉开抽屉，从里头取出一样东西，放在沈默面前。", "是那张禀帖。纸边烂了，右下角那枚印，朱红的：户房收讫。", "旁边是他自己的字：六月十二日，西乡民宋某具。", "“收着吧。”吴县丞说。", "他回到户房，把结案的底稿放进今年那一捆底单里，用麻绳扎好，在竹牌上写：嘉靖四十年。", "底稿末尾，誊录那一栏，是他的名字。", "字写得很稳。", "嘉靖三十五年那张单子上的字，写得太用力。", "今年这一张，一笔都没有用力。"], "recap": "寄出去以后，什么都没有发生。沈默被派去重造西乡鱼鳞册，宋家那一条界，照现界往宋家那边描了二尺。老宋把一亩田押给张宅，借米二石：先把今年过了。九月初八夜，祝驿丞在灶边烘干省里的札付，透着火光看见几个反字：不必再议，书办私书发回该县，照常办理。九月十五，按察司的回文到了。"}, {"n": 20, "cn": "二十", "title": "照例", "era": "", "chars": 1615, "mins": 5, "html": "<p data-p=\"0\">十一月初一，下了头一场霜。<\/p>\n<p data-p=\"1\">户房的窗纸冻得发硬。<b class=\"rn\" data-c=\"shenmo\">沈默<\/b>早上来，研墨，砚里的水结了一层薄冰，他用笔杆敲碎了，冰碴子浮在墨里，一会儿就化了。<\/p>\n<p data-p=\"2\">对面那张案子后头，<b class=\"rn\" data-c=\"yusili\">余司吏<\/b>已经坐着了。他咳了一阵，咳完，翻开一本账。<\/p>\n<p data-p=\"3\">院子里，<b class=\"rn\" data-c=\"zhengdianshi\">郑典史<\/b>在点卯，一个一个念名字，跟往常一样。<\/p>\n<p data-p=\"4\">新来的书手是辰时到的。十九岁，姓顾，瘦，穿一件洗得发白的长衫，进门先给余司吏作揖，又给沈默作揖，作得很深。<\/p>\n<p data-p=\"5\">余司吏指了指靠里那张案子。<\/p>\n<p data-p=\"6\">“你坐那儿。”<\/p>\n<p data-p=\"7\">那是<b class=\"rn\" data-c=\"sunshuban\">孙书办<\/b>的案子。案上的笔筒里，插着三支笔。有一支没洗，笔头的墨干成了硬壳。<\/p>\n<p data-p=\"8\"><b class=\"rn\" data-c=\"xiaolu\">小顾<\/b>看着那支笔，没敢碰。<\/p>\n<p data-p=\"9\">“这一支……还要吗？”<\/p>\n<p data-p=\"10\">沈默走过去，把那支笔抽出来，拿到外头，舀了一盆温水，把笔头浸进去。<\/p>\n<p data-p=\"11\">硬壳慢慢软了。墨一丝一丝化开，把一盆水染黑了。他用指头捋了几遍，换了一盆水，又捋了几遍。<\/p>\n<p data-p=\"12\">笔头散开，又聚拢。毫没有坏。<\/p>\n<p data-p=\"13\">他甩了甩水，把笔插回笔筒里。<\/p>\n<p data-p=\"14\">“还能用。”他说。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"15\">午后，余司吏把这个月的册费分下来。<\/p>\n<p data-p=\"16\">一个红纸包，递到小顾手里。小顾接过来，捏了捏，没打开，揣进了袖子里。<\/p>\n<p data-p=\"17\">“二两一钱。”余司吏说。<\/p>\n<p data-p=\"18\">小顾“嗯”了一声，又作了个揖。<\/p>\n<p data-p=\"19\">他没有问为什么是这个数。<\/p>\n<p data-p=\"20\">沈默低头看着自己案上的账，翻过一页。<\/p>\n<p data-p=\"21\">案头送来一摞契，等着税契用印。<\/p>\n<p data-p=\"22\">最上头一张：西乡三都东村宋某，前因灾后无食，以田一亩押与张宅，借米二石。今秋本利未还，田归张宅管业，听其改种。<\/p>\n<p data-p=\"23\">契尾有县丞的签押，照旧。<\/p>\n<p data-p=\"24\">沈默拿起户房的印，盖在契上。印泥是新调的，红得发亮。<\/p>\n<p data-p=\"25\">底下一张，是张宅报来的雇工册，开了一家缫丝坊，雇了二十几个人。一行一行往下，看到一行：东村宋氏女，十七，缫丝。<\/p>\n<p data-p=\"26\">他翻过去了。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"27\">西堤在修。<\/p>\n<p data-p=\"28\">冬天农闲，各村出夫，中段那个口子，要在开春前补上。<\/p>\n<p data-p=\"29\">户房要派人去核工料，派的还是他。<\/p>\n<p data-p=\"30\">出西门的时候，驿站门口，<b class=\"rn\" data-c=\"linyicheng\">祝驿丞<\/b>在给一匹马钉掌。看见他，点了点头。他也点了点头。<\/p>\n<p data-p=\"31\">西堤上很多人。中段那个口子两头，石料一堆一堆码着，民夫扛着土袋往上走，一个领工站在高处吆喝。<\/p>\n<p data-p=\"32\">是<b class=\"rn\" data-c=\"wanglaoshi\">王老实<\/b>。他的腿还有一点瘸，看见沈默，远远地哈了哈腰。<\/p>\n<p data-p=\"33\">沈默在石料堆边上站了一会儿。<\/p>\n<p data-p=\"34\">他没有数。<\/p>\n<p data-p=\"35\">他沿着堤往回走。堤下就是西乡，田里的水早退干了，泥冻得发硬。<\/p>\n<p data-p=\"36\">东村村口，宋家那一亩，现在是张家的。地上新挖了一排坑，一个一个，间隔得很匀。几个张家的佃户正弯着腰，往坑里栽桑苗。苗很细，一尺来高，在风里晃。<\/p>\n<p data-p=\"37\">他从堤上走过去，没停。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"38\">天快黑的时候，小顾捧着一本册子，走到他案前。<\/p>\n<p data-p=\"39\">“沈先生，”他说，“这一笔，学生不知道该怎么写。”<\/p>\n<p data-p=\"40\">是西堤补修的核销册。册面写着：中段补筑，用石料若干方，工银一千三百八十两。<\/p>\n<p data-p=\"41\">小顾又翻开另一本，是存留银的旧册，翻到“堤防”一项。<\/p>\n<p data-p=\"42\">“岁修额定，七百两。”小顾说，“差得太多了。这册子要送县丞老爷看，头一行，要写学生的名字。”<\/p>\n<p data-p=\"43\">沈默把那两本册子并排放着，七百两那一行，和一千三百八十两那一行，挨在一起。<\/p>\n<p data-p=\"44\">“批语栏，”他说，“写'照册转录'。”<\/p>\n<p data-p=\"45\">“不写'核明无误'？”<\/p>\n<p data-p=\"46\">“不写。”沈默说，“你只是抄。不要替别人把话说满。”<\/p>\n<p data-p=\"47\">小顾点点头，拿起笔，又停住了。<\/p>\n<p data-p=\"48\">“沈先生，”他问，“若册上写错了呢？”<\/p>\n<p data-p=\"49\">窗外，天已经暗下来了。院子里有人在关门，门轴吱呀了一声。<\/p>\n<p data-p=\"50\">沈默停了一下。<\/p>\n<p data-p=\"51\">“先照册写。”<\/p>\n<p data-p=\"52\">小顾“嗯”了一声，回到自己案前，蘸了墨，用那支洗过的笔，一笔一画地写起来。写得很用力。<\/p>\n<p data-p=\"53\">余司吏收拾好案头，披上夹袄，走到门口，回头看了一眼靠里那张案子。小顾还在写。<\/p>\n<p data-p=\"54\">“孙书办那支笔，”他说，“还能用？”<\/p>\n<p data-p=\"55\">“还能用。”<\/p>\n<p data-p=\"56\">余司吏点了点头，咳了两声，走了。<\/p>\n<p data-p=\"57\">快落锁的时候，门房送进来一张帖子，说是傍晚一个乡下人递在门口的，人已经走了。<\/p>\n<p data-p=\"58\">沈默接过来。纸是糙的，三文钱一张的那种：<\/p>\n<p class=\"chao\" data-p=\"59\">具禀人西乡三都佃户宋某，为西堤中段新筑土松，恐难当来年春汛……<\/p>\n<p data-p=\"60\">他没有往下看。把帖子折好。印盒就在手边，他没有打开。<\/p>\n<p data-p=\"61\">他把那张帖子，压在了账册底下。<\/p>\n<div class=\"brk\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n<p data-p=\"62\">那天夜里他回家，<b class=\"rn\" data-c=\"ahe\">阿禾<\/b>还没睡，趴在桌边描红。<\/p>\n<p data-p=\"63\">“爹，先生说我的字写得端正。”阿禾把描红纸举起来，“等我长大了，也能进衙门。”<\/p>\n<p data-p=\"64\">他摸了摸阿禾的头，看着那张纸。一笔一画，很用力。<\/p>\n<p data-p=\"65\">床底下那只旧木匣，他没有再打开过。<\/p>", "paras": ["十一月初一，下了头一场霜。", "户房的窗纸冻得发硬。沈默早上来，研墨，砚里的水结了一层薄冰，他用笔杆敲碎了，冰碴子浮在墨里，一会儿就化了。", "对面那张案子后头，余司吏已经坐着了。他咳了一阵，咳完，翻开一本账。", "院子里，郑典史在点卯，一个一个念名字，跟往常一样。", "新来的书手是辰时到的。十九岁，姓顾，瘦，穿一件洗得发白的长衫，进门先给余司吏作揖，又给沈默作揖，作得很深。", "余司吏指了指靠里那张案子。", "“你坐那儿。”", "那是孙书办的案子。案上的笔筒里，插着三支笔。有一支没洗，笔头的墨干成了硬壳。", "小顾看着那支笔，没敢碰。", "“这一支……还要吗？”", "沈默走过去，把那支笔抽出来，拿到外头，舀了一盆温水，把笔头浸进去。", "硬壳慢慢软了。墨一丝一丝化开，把一盆水染黑了。他用指头捋了几遍，换了一盆水，又捋了几遍。", "笔头散开，又聚拢。毫没有坏。", "他甩了甩水，把笔插回笔筒里。", "“还能用。”他说。", "午后，余司吏把这个月的册费分下来。", "一个红纸包，递到小顾手里。小顾接过来，捏了捏，没打开，揣进了袖子里。", "“二两一钱。”余司吏说。", "小顾“嗯”了一声，又作了个揖。", "他没有问为什么是这个数。", "沈默低头看着自己案上的账，翻过一页。", "案头送来一摞契，等着税契用印。", "最上头一张：西乡三都东村宋某，前因灾后无食，以田一亩押与张宅，借米二石。今秋本利未还，田归张宅管业，听其改种。", "契尾有县丞的签押，照旧。", "沈默拿起户房的印，盖在契上。印泥是新调的，红得发亮。", "底下一张，是张宅报来的雇工册，开了一家缫丝坊，雇了二十几个人。一行一行往下，看到一行：东村宋氏女，十七，缫丝。", "他翻过去了。", "西堤在修。", "冬天农闲，各村出夫，中段那个口子，要在开春前补上。", "户房要派人去核工料，派的还是他。", "出西门的时候，驿站门口，祝驿丞在给一匹马钉掌。看见他，点了点头。他
